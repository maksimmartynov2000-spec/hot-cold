<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10142c" />

  <title id="docTitle">Hot or Cold</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-180.png" />

  <meta name="apple-mobile-web-app-title" content="Hot or Cold" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p0: #6366f1;
      --p1: #fbbf24;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      background-color: #0b1220;
      background-image: linear-gradient(160deg, #10142c 0%, #1a2142 45%, #0b1220 100%);
      background-repeat: no-repeat;
      background-size: 100% 100%;
      overscroll-behavior: none;
      display: flex;
      justify-content: center;
      align-items: center;
      align-items: safe center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: calc(12px + env(safe-area-inset-top))
               calc(12px + env(safe-area-inset-right))
               calc(12px + env(safe-area-inset-bottom))
               calc(12px + env(safe-area-inset-left));
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 24px 20px;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
      transition: max-width 0.2s;
    }
    .card.wide { max-width: 1100px; }

    /* В потоке, а не абсолютом: в игре шапка сжимается, строка статуса поднимается
       вверх и раньше уезжала прямо под переключатель языка */
    .top-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 8px;
    }
    .account-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 130px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .own-best { color: rgba(255, 255, 255, 0.45); font-weight: 600; }
    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 13px;
      line-height: 1.2;
      cursor: pointer;
      font-family: inherit;
    }
    .account-chip .chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 24, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-card {
      width: 100%;
      max-width: 320px;
      background: #1b1e3d;
      /* окно живёт за пределами .card, свой цвет текста ему нужен явно —
         иначе достаётся чёрный по умолчанию от body */
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px 18px 18px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .modal-card .modal-text {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .lang-switcher {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      font-weight: 500;
      z-index: 5;
    }
    .lang-switcher:focus { border-color: rgba(255,255,255,0.4); }

    .header { text-align: center; margin-bottom: 20px; margin-top: 10px; transition: margin 0.15s; }
    .header .emoji { font-size: clamp(30px, 8vw, 40px); margin-bottom: 6px; transition: font-size 0.15s; }
    .header h1 { font-size: clamp(20px, 5vw, 24px); font-weight: 700; letter-spacing: -0.5px; transition: font-size 0.15s; }
    .header.compact {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 12px; margin-top: 0;
    }
    .header.compact .emoji { font-size: 20px; margin-bottom: 0; }
    .header.compact h1 { font-size: 15px; opacity: 0.7; }

    .row { display: flex; gap: 8px; width: 100%; }

    input[type=number], input[type=text], select.field {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
      outline: none;
      -moz-appearance: textfield;
      caret-color: #fff;
      font-family: inherit;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    select.field option { background: #1e1b4b; color: #fff; }

    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-block { width: 100%; }

    .btn-yellow {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #fbbf24;
      color: #1c1917;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-yellow:hover { background: #f59e0b; }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.16); }

    .btn-reset {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-family: inherit;
    }

    /* ---------- Стартовый экран ---------- */
    .mode-list { display: flex; flex-direction: column; gap: 12px; }
    .mode-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }
    .mode-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.3); }
    .mode-btn .m-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .mode-btn .m-sub { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
    .mode-btn.duel { border-left: 3px solid var(--p1); }
    .mode-btn.solo { border-left: 3px solid var(--p0); }
    .mode-btn.run { border-left: 3px solid #4ade80; }

    /* ---------- Настройка дуэли ---------- */
    .setup-field { margin-bottom: 14px; }
    .setup-field label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .setup-row { display: flex; gap: 8px; }

    /* ---------- Игровое поле ---------- */
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "p0 p1" "center center";
      gap: 12px;
      align-items: start;
    }
    .board.solo { grid-template-columns: 1fr; grid-template-areas: "center"; }
    .board .pc0 { grid-area: p0; }
    .board .pc1 { grid-area: p1; }
    .board .center { grid-area: center; min-width: 0; }

    @media (min-width: 860px) {
      .board.duel {
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-areas: "p0 center p1";
        gap: 20px;
        align-items: start;
      }
      .thermo-wrap { margin: 10px 0 22px; }
      .thermo-tube {
        width: 24px;
        height: 140px;
        border-radius: 12px 12px 0 0;
      }
      .thermo-tube::before { left: 4px; width: 4px; top: 6px; bottom: 6px; }
      .thermo-bulb { width: 54px; height: 54px; margin-top: -6px; }
      .thermo-bulb::after { top: 11px; left: 14px; width: 13px; height: 8px; }
    }

    .pcard {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .pcard.active {
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    .pcard .p-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
      color: #fff;
      word-break: break-word;
    }
    .pcard .p-name .p-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 7px currentColor;
    }
    .pcard .p-pips { font-size: 13px; letter-spacing: 2px; margin-bottom: 10px; opacity: 0.65; transition: opacity 0.2s; }
    .pcard.active .p-pips { opacity: 1; }
    .pcard .p-wins-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .token-btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .token-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
    .token-btn:disabled { opacity: 0.28; cursor: default; }
    .token-btn.armed { background: rgba(74, 222, 128, 0.2); border-color: #4ade80; color: #86efac; }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .info-bar .confirmed { font-size: 13px; color: rgba(255, 255, 255, 0.6); }
    .info-bar .attempts { font-size: 13px; font-weight: 600; color: #a5f3fc; }
    .info-bar .attempts.low { color: #f87171; }

    .turn-banner {
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid transparent;
    }

    .confirmed strong { color: #fde68a; font-weight: 700; }

    .thermo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 6px 0 18px;
    }
    .thermo-tube {
      position: relative;
      width: 18px;
      height: 104px;
      border-radius: 9px 9px 0 0;
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.32);
      border-bottom: none;
      overflow: hidden;
      z-index: 1;
    }
    .thermo-tube::before {
      /* стеклянный блик слева по всей трубке */
      content: "";
      position: absolute;
      top: 4px; bottom: 4px; left: 3px;
      width: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,0.28);
      z-index: 3;
      pointer-events: none;
    }
    .thermo-fill {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      height: 8%;
      background: #93C5FD;
      transition: height 0.65s cubic-bezier(.4,0,.2,1), background-color 0.6s ease;
      z-index: 1;
    }
    .thermo-fill::after {
      /* мениск — светлая полоска на поверхности ртути */
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.45);
    }
    .thermo-bulb {
      position: relative;
      width: 40px;
      height: 40px;
      margin-top: -5px;
      border-radius: 50%;
      background: #93C5FD;
      border: 2px solid rgba(255,255,255,0.32);
      box-shadow: 0 0 18px 2px rgba(147,197,253,0.35);
      transition: background-color 0.6s ease, box-shadow 0.6s ease;
      z-index: 2;
    }
    .thermo-bulb::after {
      /* блик-отражение на стекле колбы */
      content: "";
      position: absolute;
      top: 8px; left: 10px;
      width: 9px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      transform: rotate(-25deg);
    }
    .thermo-bulb.pulse { animation: thermoPulse 0.8s ease 2; }
    @keyframes thermoPulse {
      0%, 100% { box-shadow: 0 0 18px 2px rgba(255,255,255,0.4); }
      50% { box-shadow: 0 0 0 14px rgba(255,255,255,0); }
    }

    .feedback-panel {
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: center;
      animation: pop 0.3s ease;
    }
    .feedback-panel .fb-label { font-size: clamp(20px, 6vw, 26px); font-weight: 600; }

    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feedback-panel { animation: none; }
      .pcard.active { transform: none; }
      .thermo-fill, .thermo-bulb { transition: none; }
      .thermo-bulb.pulse { animation: none; }
    }

    /* Компактная раскладка одиночной игры на телефоне — чтобы всё помещалось
       на экран без прокрутки. На широких экранах (≥860px) не действует. */
    @media (max-width: 859px) {
      .card.solo-game .header { display: none; }

      .card.solo-game .info-bar { margin-bottom: 10px; }

      .card.solo-game .thermo-wrap { margin: 0 0 4px; }

      .card.solo-game .feedback-panel {
        background: none !important;
        border: none !important;
        padding: 0 0 8px;
        margin-bottom: 8px;
        animation: none;
      }
      .card.solo-game .feedback-panel .fb-label { font-size: 16px; }

      .card.solo-game .guess-section { margin-bottom: 10px; }
      .card.solo-game .guess-section p { margin-bottom: 5px; }

      .card.solo-game .history-list { max-height: 96px; }

      .card.solo-game .lang-switcher {
        position: static;
        display: block;
        margin: 0 0 10px auto;
      }
    }

    .final-box {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid #fbbf24;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .final-box p {
      text-align: center;
      font-size: 14px;
      color: #fde68a;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .result-box {
      border-radius: 14px;
      padding: 18px 14px;
      margin-bottom: 16px;
      text-align: center;
      line-height: 1.4;
    }
    .result-win { background: rgba(22, 163, 74, 0.16); border: 1px solid #16a34a; color: #86efac; }
    .result-lose { background: rgba(239, 68, 68, 0.16); border: 1px solid #ef4444; color: #fca5a5; }
    .result-round { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
    .result-box .r-icon { font-size: 32px; line-height: 1; margin-bottom: 6px; }
    .result-box .r-title { font-size: 18px; font-weight: 800; }
    .result-box .r-score {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 14px; flex-wrap: wrap;
    }
    .result-box .r-chip {
      padding: 6px 14px; border-radius: 999px; border: 1.5px solid;
      font-weight: 700; font-size: 13px; background: rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    .result-box .r-vs { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 700; }
    .result-box .r-secret { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.45); }
    .result-box .r-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }

    .guess-section { margin-bottom: 16px; }
    .guess-section p { margin-bottom: 8px; font-size: 14px; color: rgba(255, 255, 255, 0.65); font-weight: 500; }

    .history-section { margin-bottom: 16px; }
    .history-title {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .history-list.tall { max-height: 340px; }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      gap: 10px;
    }
    .history-item .h-num { color: rgba(255, 255, 255, 0.4); font-size: 12px; flex-shrink: 0; }
    .history-item .h-who { font-size: 12px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .h-guess { font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .history-item .h-label { font-size: 13px; font-weight: 600; text-align: right; word-break: break-word; }

    .legend { margin-top: 20px; }
    #scaleBox { margin-bottom: 10px; }
    .legend-body { margin-top: 10px; }

    .legend-bar { display: none; }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 210px));
      justify-content: center;
      gap: 8px 18px;
    }
    .legend-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
    .legend-item .l-label { font-weight: 600; }
    .legend-item .l-range { color: rgba(255, 255, 255, 0.4); font-variant-numeric: tabular-nums; }

    @media (min-width: 860px) {
      .legend-bar {
        display: flex;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 16px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }
      .legend-bar span { flex: 1; }

      .legend-grid {
        grid-template-columns: repeat(8, 1fr);
        justify-content: stretch;
        gap: 4px;
      }
      .legend-item {
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        text-align: center;
        gap: 3px;
      }
      .legend-item .l-label { font-size: 11.5px; line-height: 1.25; }
      .legend-item .l-range { font-size: 11px; }
    }

    .instruction-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .instruction-box summary {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      outline: none;
    }
    .instruction-box p {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.4;
      white-space: pre-line;
    }

    .hidden { display: none !important; }

    :focus-visible { outline: 2px solid #a5f3fc; outline-offset: 2px; }

    #updateBanner {
      cursor: pointer;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }
    .lb-wrap { margin-top: 14px; }
    .lb-list { margin-top: 8px; }
    .lb-title {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;

<body>
<div class="card" id="card">
  <div id="updateBanner" class="hidden"></div>
  <div class="top-controls">
    <button class="account-chip hidden" id="accountChip" onclick="openLogoutModal()">
      <span>👤</span><span class="chip-name" id="accountChipName"></span>
    </button>
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()" aria-label="Звук"></button>
    <select class="lang-switcher" id="langSwitcher" onchange="changeLanguage()">
      <option value="en">🇺🇸 EN</option>
      <option value="ru">🇷🇺 RU</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="de">🇩🇪 DE</option>
    </select>
  </div>

  <div class="header">
    <div class="emoji">🌡️</div>
    <h1 id="tTitle">Hot or Cold</h1>
  </div>

  <!-- ЭКРАН 1: выбор режима -->
  <div id="screenMode">
    <div class="mode-list">
      <button class="mode-btn solo" onclick="openSetup('solo')">
        <div class="m-title" id="tModeSolo">Single player</div>
      </button>
      <button class="mode-btn duel" onclick="openSetup('duel')">
        <div class="m-title" id="tModeDuel">Play with a friend</div>
      </button>
      <button class="mode-btn run" onclick="openRunEntry()">
        <div class="m-title" id="tModeRun"></div>
      </button>
    </div>
  </div>

  <!-- ЭКРАН 2: настройка -->
  <div id="screenSetup" class="hidden">
    <div class="setup-field">
      <label id="tLblRange">Range</label>
      <select class="field" id="rangeMax" onchange="buildAttemptsOptions()"></select>
    </div>

    <div class="setup-field" id="attemptsField">
      <label id="tLblAttempts">Attempts</label>
      <select class="field" id="attemptsCount"></select>
    </div>

    <div id="duelOnlyFields">
      <div class="setup-field">
        <label id="tLblP1">Player 1</label>
        <input type="text" id="nameP1" maxlength="14" />
      </div>
      <div class="setup-field">
        <label id="tLblP2">Player 2</label>
        <input type="text" id="nameP2" maxlength="14" />
      </div>
      <div class="setup-field">
        <label id="tLblWins">Play until how many wins</label>
        <select class="field" id="winsNeeded">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </div>
      <div class="setup-field">
        <label id="tLblHandicap">Handicap</label>
        <select class="field" id="handicap"></select>
      </div>
    </div>

    <div class="setup-row">
      <button class="btn-ghost" onclick="showScreen('mode')" id="tBack">Back</button>
      <button class="btn btn-block" onclick="startFromSetup()" id="tStartMatch">Start match</button>
    </div>
  </div>

  <!-- ЭКРАН 3: игра -->
  <div id="screenGame" class="hidden">
    <div class="board" id="board">

      <div class="pcard pc0" id="pcard0">
        <div class="p-name" id="pname0"></div>
        <div class="p-wins-label" id="tWinsLabel0">Wins</div>
        <div class="p-pips" id="ppips0"></div>
        <button class="token-btn" id="ptoken0" onclick="useToken(0)"></button>
      </div>

      <div class="pcard pc1" id="pcard1">
        <div class="p-name" id="pname1"></div>
        <div class="p-wins-label" id="tWinsLabel1">Wins</div>
        <div class="p-pips" id="ppips1"></div>
        <button class="token-btn" id="ptoken1" onclick="useToken(1)"></button>
      </div>

      <div class="center">

        <div class="info-bar" id="infoBar">
          <span class="confirmed" id="tConfirmed">Number generated ✓</span>
          <span class="attempts" id="attemptsLabel"></span>
          <button class="btn-reset" onclick="leaveGame()" id="tMenu">Menu</button>
        </div>

        <div class="turn-banner hidden" id="turnBanner"></div>

        <div class="thermo-wrap hidden" id="thermoWrap">
          <div class="thermo-tube"><div class="thermo-fill" id="thermoFill"></div></div>
          <div class="thermo-bulb" id="thermoBulb"></div>
        </div>

        <div class="feedback-panel hidden" id="feedbackPanel">
          <div class="fb-label" id="feedbackLabel"></div>
        </div>

        <div class="final-box hidden" id="finalBox">
          <p id="tFinalWarning">Attempts used — last chance!</p>
          <div class="row">
            <input type="number" id="finalInput" min="1" max="1000" placeholder="" pattern="[0-9]*" inputmode="numeric" />
            <button class="btn-yellow" onclick="submitFinal()" id="tFinalSubmit">Submit</button>
          </div>
        </div>

        <div class="result-box hidden" id="resultBox"></div>

        <div class="guess-section" id="guessSection">
          <p id="tEnterGuess">Enter a number</p>
          <div class="row">
            <input type="number" id="guessInput" min="1" max="1000" placeholder="" pattern="[0-9]*" inputmode="numeric" />
            <button class="btn" onclick="handleGuess()" id="tSubmitGuess">Check</button>
          </div>
        </div>

        <div class="history-section hidden" id="historySection">
          <div class="history-title" id="tHistoryTitle">Guess History</div>
          <div class="history-list" id="historyList"></div>
        </div>

      </div>
    </div>

    <div class="legend">
      <details class="instruction-box" id="scaleBox" open>
        <summary id="tLegendTitle">Distance Scale</summary>
        <div class="legend-body">
          <div class="legend-bar" id="legendBar"></div>
          <div class="legend-grid" id="legendGrid"></div>
        </div>
      </details>
    </div>
  </div>

  <!-- ЭКРАН: выбор вход/регистрация -->
  <div id="screenAuthChoice" class="hidden">
    <div class="mode-list">
      <button class="mode-btn solo" onclick="showRunAuth('login')">
        <div class="m-title" id="tRunChoiceLogin"></div>
        <div class="m-sub" id="tRunChoiceLoginSub"></div>
      </button>
      <button class="mode-btn run" onclick="showRunAuth('register')">
        <div class="m-title" id="tRunChoiceRegister"></div>
        <div class="m-sub" id="tRunChoiceRegisterSub"></div>
      </button>
    </div>
    <button class="btn-ghost btn-block" style="margin-top:12px" id="tRunChoiceBack" onclick="showScreen('mode')"></button>
  </div>

  <!-- ЭКРАН: форма входа или регистрации -->
  <div id="screenAuth" class="hidden">
    <div class="lb-title" id="runAuthTitle" style="font-size:15px;margin-bottom:10px"></div>
    <div class="setup-field">
      <label id="tRunName"></label>
      <input type="text" id="runUsername" maxlength="20" />
    </div>
    <div class="setup-field">
      <label id="tRunPin"></label>
      <input type="text" id="runPin" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="1234" />
    </div>
    <div id="runAuthError" class="lb-title hidden" style="color:#f87171"></div>
    <div class="setup-row">
      <button class="btn-ghost" id="tRunAuthBack" onclick="showScreen('authChoice')"></button>
      <button class="btn btn-block" id="runAuthSubmitBtn" onclick="runAuthSubmit()"></button>
    </div>
  </div>

  <!-- ЭКРАН: хаб режима на рейтинг (старт/результат/топ) -->
  <div id="screenRunHub" class="hidden">
    <div id="runHubMessage"></div>
    <button class="btn btn-block" id="tRunStart" onclick="startRun()"></button>
    <div class="lb-wrap">
      <div class="lb-head">
        <div class="lb-title" id="tRunTop"></div>
        <div class="lb-tabs">
          <button class="lb-tab" id="tRunTopWeek" onclick="setLeaderboardScope('week')"></button>
          <button class="lb-tab" id="tRunTopAll" onclick="setLeaderboardScope('all')"></button>
        </div>
      </div>
      <div id="runLeaderboardList" class="lb-list"></div>
    </div>
    <div class="run-hub-actions">
      <button class="btn-ghost btn-block" id="tRunToMenu" onclick="showScreen('mode')"></button>
    </div>
  </div>
</div>

<!-- Подтверждение выхода из аккаунта -->
<div class="modal-backdrop hidden" id="logoutModal">
  <div class="modal-card">
    <div class="modal-text" id="tLogoutAsk"></div>
    <div class="setup-row">
      <button class="btn-ghost btn-block" id="tLogoutCancel" onclick="closeLogoutModal()"></button>
      <button class="btn btn-block" id="tLogoutConfirm" onclick="confirmLogout()"></button>
    </div>
  </div>
</div>

  // Восемь цветов шкалы — фиксированы, не зависят от диапазона (это исходная,
  // одобренная палитра). Меняются только числовые границы каждого пояса.
  const TIER_COLORS = [
    { color: "#93C5FD", bg: "rgba(147, 197, 253, 0.15)" }, // очень холодно
    { color: "#38BDF8", bg: "rgba(56, 189, 248, 0.15)" },  // холодно
    { color: "#2DD4BF", bg: "rgba(45, 212, 191, 0.15)" },  // прохладно
    { color: "#FBBF24", bg: "rgba(251, 191, 36, 0.15)" },  // тепло
    { color: "#FB923C", bg: "rgba(251, 146, 60, 0.15)" },  // жарко
    { color: "#F87171", bg: "rgba(248, 113, 113, 0.15)" }, // очень горячо
    { color: "#FF5733", bg: "rgba(255, 87, 51, 0.18)" },   // очень-очень горячо
    { color: "#FF4500", bg: "rgba(255, 69, 0, 0.2)" },     // лава
  ];
  const BULLSEYE_TIER = { color: "#4ADE80", bg: "rgba(74, 222, 128, 0.15)" };

  // Верхние границы 8 поясов (от самого холодного к самому горячему) для
  // каждого диапазона. 1000 — эталон, остальные — та же логарифмическая форма,
  // пересчитанная под свой диапазон (см. ответ в чате).
  const RANGE_TIER_UPPER = {
    10:      [9, 7, 6, 5, 4, 3, 2, 1],
    100:     [99, 64, 32, 16, 8, 4, 2, 1],
    1000:    [1000, 500, 200, 100, 50, 20, 10, 3],
  };
  const RANGE_PRESETS = [10, 100, 1000];

  // Горячий конец шкалы не растёт вместе с диапазоном: жарко/горячо/очень горячо/лава
  // всегда означают одни и те же расстояния. Именно по горячим поясам игрок и вычисляет
  // число в конце — если бы они росли пропорционально, «лава» на диапазоне в 10 000
  // значила бы «где-то в пределах 40», и добить раунд стало бы невозможно.
  // Значения взяты из ручной таблицы для 1000 — то есть шкала ведёт себя так же, как там.
  const HOT_TIER_UPPER = [50, 20, 10, 3];

  // Для произвольного диапазона (режим на рейтинг) готовой таблицы поясов нет — считаем её.
  function generateTierUpper(rangeMax) {
    const maxDistance = Math.max(1, rangeMax - 1);

    // Тесный диапазон: горячие пояса в него просто не помещаются, раскладываем
    // логарифмически по всей ширине. Для 10 это даёт ровно ручную таблицу.
    if (maxDistance <= HOT_TIER_UPPER[0]) {
      const U = [];
      for (let i = 0; i < 8; i++) {
        U.push(Math.max(Math.round(maxDistance * Math.pow(0.45, i)), 8 - i));
      }
      for (let i = 1; i < 8; i++) {
        if (U[i] >= U[i - 1]) U[i] = Math.max(1, U[i - 1] - 1);
      }
      return U;
    }

    // Широкий диапазон: холодные четыре пояса растягиваются от края диапазона
    // до начала горячей зоны, горячие четыре — фиксированы.
    const ratio = Math.pow(HOT_TIER_UPPER[0] / maxDistance, 1 / 4);
    const U = [];
    for (let i = 0; i < 4; i++) U.push(Math.round(maxDistance * Math.pow(ratio, i)));
    HOT_TIER_UPPER.forEach(v => U.push(v));
    for (let i = 1; i < 8; i++) {
      if (U[i] >= U[i - 1]) U[i] = Math.max(1, U[i - 1] - 1);
    }
    return U;
  }

  function buildFeedbackMeta(rangeMax) {
    const U = RANGE_TIER_UPPER[rangeMax] || generateTierUpper(rangeMax);
    const meta = [];
    for (let i = 0; i < 8; i++) {
      const max = U[i];
      const min = (i === 7) ? 1 : U[i + 1] + 1;
      meta.push({
        min, max, labelIndex: i,
        color: TIER_COLORS[i].color, bg: TIER_COLORS[i].bg,
        rangeSign: (min === max) ? String(min) : (min + '–' + max)
      });
    }
    meta.push({ min: 0, max: 0, labelIndex: 8, rangeSign: "0",
                color: BULLSEYE_TIER.color, bg: BULLSEYE_TIER.bg });
    return meta;
  }

  function minAttempts(rangeMax) {
    return Math.max(1, Math.ceil(Math.log2(rangeMax)));
  }

  function formatNum(n) {
    try { return n.toLocaleString(currentLang === 'en' ? 'en-US' : currentLang); }
    catch (e) { return String(n); }
  }

  let RANGE_MAX = 1000;
  let MAX_GUESSES = 10;
  let FEEDBACK_META = buildFeedbackMeta(RANGE_MAX);
  const P_COLORS = ["#6366f1", "#fbbf24"];

  let currentLang = localStorage.getItem('hc_lang') || 'en';

    cur: 0,

  // ================= НАВИГАЦИЯ =================
  function showScreen(name) {
    screen = name;
    document.getElementById('screenMode').classList.toggle('hidden', name !== 'mode');
    document.getElementById('screenSetup').classList.toggle('hidden', name !== 'setup');
    document.getElementById('screenGame').classList.toggle('hidden', name !== 'game');

    document.getElementById('screenAuth').classList.toggle('hidden', name !== 'auth');

    document.querySelector('.legend').classList.toggle('hidden', name !== 'game');
    updateAccountChip();
  }

  function quitToMenu() {
    mode = null;
    D.matchOver = false;
    applyTranslations();
    showScreen('mode');
  }

  // Выход с игрового экрана: в режиме на рейтинг это отказ от текущей игры —
  // возвращаемся в хаб режима, а не в главное меню
  function leaveGame() {
    if (mode === 'run') {
      RUN = null;
      mode = null;
      applyTranslations();
      openRunHub();
      return;
    }
    quitToMenu();
  }

  // ================= ОБЩАЯ НАСТРОЙКА (диапазон/попытки/дуэль) =================
  function openSetup(m) {
    mode = m;
    const L = t();
    document.getElementById('duelOnlyFields').classList.toggle('hidden', m !== 'duel');
    document.getElementById('attemptsField').classList.toggle('hidden', m !== 'solo');
    document.getElementById('tStartMatch').textContent = (m === 'duel') ? L.startMatch : L.startGame;
    buildRangeOptions();
    if (m === 'duel') buildHandicapOptions();
    showScreen('setup');
  }

  function buildRangeOptions() {
    const sel = document.getElementById('rangeMax');
    if (!sel) return;
    const prev = sel.value;
    sel.innerHTML = '';
    RANGE_PRESETS.forEach(n => {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = '1–' + formatNum(n);
      sel.appendChild(o);
    });
    sel.value = RANGE_PRESETS.includes(parseInt(prev)) ? prev : '1000';
    buildAttemptsOptions();
  }

  function buildAttemptsOptions() {
    const rangeSel = document.getElementById('rangeMax');
    const rangeMax = parseInt(rangeSel && rangeSel.value) || 1000;
    const min = minAttempts(rangeMax);
    const sel = document.getElementById('attemptsCount');
    const prev = sel.value;
    const options = [min, min + 1, min + 2, min + 3, min + 5, min + 8, min + 12];
    sel.innerHTML = '';
    options.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
    sel.value = options.includes(parseInt(prev)) ? prev : String(min);
  }

  function applyRangeToInputs() {
    ['guessInput', 'finalInput'].forEach(id => {
      const el = document.getElementById(id);
      el.min = 1; el.max = RANGE_MAX;
    });
  }

  function startFromSetup() {
    RANGE_MAX = parseInt(document.getElementById('rangeMax').value) || 1000;
    if (mode === 'solo') {
      MAX_GUESSES = parseInt(document.getElementById('attemptsCount').value) || minAttempts(RANGE_MAX);
    }
    FEEDBACK_META = buildFeedbackMeta(RANGE_MAX);
    applyRangeToInputs();
    if (mode === 'duel') startMatch(); else startSolo();
  }

  // ================= ОДИНОЧНАЯ ИГРА =================
  function startSolo() {
    resetSolo();
    applyTranslations();
    showScreen('game');
  }

  function resetSolo() {
    secret = Math.floor(Math.random() * RANGE_MAX) + 1;
    history = [];
    gameOver = false;
    gameOverType = null;
    lastWinIsRecord = false;
    document.getElementById('finalInput').value = '';
    document.getElementById('guessInput').value = '';
    renderAll();
  }

  function handleGuess() {
    if (mode === 'duel') return duelGuess();
    if (mode === 'run') return runGuess();
    if (gameOver) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < 1 || guess > RANGE_MAX) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: null });
    input.value = '';

    soundForGuess(meta);
    if (distance === 0) {
      gameOver = true;
      gameOverType = 'win';
      lastWinIsRecord = maybeSaveRecord(RANGE_MAX, history.length);
    } else if (history.length >= MAX_GUESSES) {
      gameOver = true;
      gameOverType = 'lose_waiting';
    }
    renderAll();
  }

  function submitFinal() {
    const input = document.getElementById('finalInput');
    const g = parseInt(input.value);
    if (isNaN(g)) return;
    const win = (g === secret);
    gameOverType = win ? 'win' : 'lose';
    lastWinIsRecord = win ? maybeSaveRecord(RANGE_MAX, history.length + 1) : false;
    renderAll();
  }

  // ================= РЕКОРДЫ (только одиночная игра) =================
  function recordKey(rangeMax) { return 'hc_record_' + rangeMax; }

  function getRecord(rangeMax) {
    try {
      const v = localStorage.getItem(recordKey(rangeMax));
      return v ? parseInt(v) : null;
    } catch (e) { return null; }
  }

  function maybeSaveRecord(rangeMax, guesses) {
    try {
      const cur = getRecord(rangeMax);
      if (cur === null || guesses < cur) {
        localStorage.setItem(recordKey(rangeMax), String(guesses));
        return true;
      }
    } catch (e) {}
    return false;
  }

  // ================= ДУЭЛЬ =================
  function startMatch() {
    const L = t();
    mode = 'duel';
    D.names[0] = (document.getElementById('nameP1').value || '').trim() || L.defP1;
    D.names[1] = (document.getElementById('nameP2').value || '').trim() || L.defP2;
    D.winsNeeded = parseInt(document.getElementById('winsNeeded').value);
    D.handicap = parseInt(document.getElementById('handicap').value);
    D.wins = [0, 0];
    D.round = 1;
    D.matchOver = false;
    D.starter = (D.handicap === 3) ? 0 : (D.handicap === 4 ? 1 : 0);
    startRound();
    applyTranslations();
    showScreen('game');
  }

  function startRound() {
    secret = Math.floor(Math.random() * RANGE_MAX) + 1;
    history = [];
    D.tokens = [1, 1];
    if (D.handicap === 1) D.tokens[0] = 2;
    if (D.handicap === 2) D.tokens[1] = 2;
    D.cur = D.starter;
    D.armed = false;
    D.roundOver = false;
    D.roundWinner = null;
    document.getElementById('guessInput').value = '';
    renderAll();
  }

  function nextRound() {
    D.round++;
    if (D.handicap !== 3 && D.handicap !== 4) D.starter = 1 - D.starter;
    startRound();
  }

  function newMatch() {
    D.wins = [0, 0];
    D.round = 1;
    D.matchOver = false;
    D.starter = (D.handicap === 3) ? 0 : (D.handicap === 4 ? 1 : 0);
    startRound();
  }

  function useToken(p) {
    if (mode !== 'duel' || D.roundOver || D.matchOver) return;
    if (p !== D.cur) return;
    if (D.armed) {
      D.armed = false;
      D.tokens[p]++;
      renderAll();
      return;
    }
    if (D.tokens[p] <= 0) return;
    if (history.length === 0) return;   // нельзя первым ходом раунда
    D.tokens[p]--;
    D.armed = true;
    renderAll();
  }

  function duelGuess() {
    if (D.roundOver || D.matchOver) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < 1 || guess > RANGE_MAX) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: D.cur });
    soundForGuess(meta);
    input.value = '';

    const usedDouble = D.armed;
    D.armed = false;

    if (distance === 0) {
      D.roundOver = true;
      D.roundWinner = D.cur;
      D.wins[D.cur]++;
      if (D.wins[D.cur] >= D.winsNeeded) D.matchOver = true;
    } else if (!usedDouble) {
      D.cur = 1 - D.cur;
    }
    renderAll();
  }

  // ================= РЕНДЕР =================
  function getFeedback(distance) {
    return FEEDBACK_META.find(f => distance >= f.min && distance <= f.max) || FEEDBACK_META[0];
  }
  function getFbText(meta) { return t().labels[meta.labelIndex]; }

  function renderAll() {
    if (screen !== 'game' && mode === null) return;
    const duel = mode === 'duel';
    const board = document.getElementById('board');
    board.classList.toggle('duel', duel);
    board.classList.toggle('solo', !duel);
    document.getElementById('pcard0').classList.toggle('hidden', !duel);
    document.getElementById('pcard1').classList.toggle('hidden', !duel);
    document.getElementById('historyList').classList.toggle('tall', duel);

    renderFeedback();
    renderThermo();
    renderStatus();
    renderResult();
    renderHistory();

  function playTone(freq, seconds, delay) {
    if (!soundOn) return;
    try {
      // Контекст создаём при первом касании: iOS не даёт звучать без действия игрока
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const start = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + seconds);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + seconds + 0.02);
    } catch (e) {}
  }

    if (!soundOn) return;

  // Диапазон округляется до круглого числа: «от 1 до 250» читается и держится в голове,
  // «от 1 до 234» — нет. Шаг округления растёт вместе с числом.
  function roundRangeValue(v) {
    const step = v < 100 ? 10 : v < 500 ? 50 : v < 1000 ? 100 : v < 5000 ? 500 : 1000;
    return Math.max(10, Math.round(v / step) * step);
  }

  // Диапазон растёт до потолка и дальше не увеличивается: «угадай число до полумиллиона»
  // формально проходимо, но играть в это на телефоне невозможно
  function runRangeForRound(n) {
    const grown = RUN_CONFIG.start_range * Math.pow(RUN_CONFIG.growth, n - 1);
    return roundRangeValue(Math.min(grown, RUN_CONFIG.range_cap));
  }

  // Сложность после потолка идёт от точности: с каждым раундом на попытку меньше.
  // Без этого игра не заканчивается — по градуснику с девятью поясами игрок получает
  // за ход около трёх бит, а попыток выдаётся из расчёта одного бита за ход, то есть вдвое больше нужного.
  function runAttemptsForRound(n, range) {
    const buffer = Math.max(0, RUN_CONFIG.buffer_start - (n - 1) * RUN_CONFIG.buffer_shrink);
    const squeeze = Math.max(0, n - RUN_CONFIG.squeeze_start);
    // потолок: попыток всегда заметно меньше, чем чисел в диапазоне,
    // иначе на маленьких диапазонах раунд проходится тупым перебором
    const cap = Math.max(2, Math.ceil(range * 0.6));
    const allowed = Math.min(minAttempts(range) + buffer, cap) - squeeze;
    return Math.max(RUN_CONFIG.min_attempts, allowed);
  }

  // Режим на рейтинг играется на том же экране, что и одиночная игра:
  // термометр, история попыток и шкала берутся оттуда как есть
  function startRun() {
    RUN = { round: 1, totalScore: 0, locked: false };
    mode = 'run';
    startRunRound();
    applyTranslations();
    showScreen('game');
  }

  function startRunRound() {
    if (!RUN) return;
    RANGE_MAX = runRangeForRound(RUN.round);
    MAX_GUESSES = runAttemptsForRound(RUN.round, RANGE_MAX);
    FEEDBACK_META = buildFeedbackMeta(RANGE_MAX);
    secret = Math.floor(Math.random() * RANGE_MAX) + 1;
    history = [];
    gameOver = false;
    gameOverType = null;
    RUN.locked = false;
    document.getElementById('guessInput').value = '';
    applyRangeToInputs();
    applyTranslations();
  }

  function runGuess() {
    // locked — пауза между раундами: иначе можно ввести уже угаданное число ещё раз и получить очки повторно
    if (!RUN || RUN.locked) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < 1 || guess > RANGE_MAX) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: null });
    input.value = '';
    soundForGuess(meta);

    if (distance === 0) {
      const roundPoints = Math.round(100 * RUN.round * (minAttempts(RANGE_MAX) / history.length));
      RUN.totalScore += roundPoints;
      RUN.locked = true;
      RUN.round++;
      renderAll();
      const L = t();
      document.getElementById('feedbackLabel').textContent =
        L.labels[8] + '  +' + roundPoints + L.run.plus;
      setTimeout(startRunRound, 900);
    } else if (history.length >= MAX_GUESSES) {
      gameOver = true;
      soundGameOver();
      renderAll();
      endRun();
    } else {
      renderAll();
    }
  }

  async function endRun() {
    const L = t();
    const finalScore = RUN.totalScore;
    const roundsSurvived = RUN.round - 1;
    const secretWas = secret;
    RUN = null;
    let resultHtml = '<div class="rr-title">' + L.run.over + '</div>' +
      '<p>' + L.run.secretWas + '<strong>' + secretWas + '</strong></p>' +
      '<p>' + L.run.roundsDone + '<strong>' + roundsSurvived + '</strong></p>' +
      '<p>' + L.run.finalScore + '<strong>' + finalScore + '</strong></p>';
    const auth = runAuth();
    if (auth && sb) {
      try {
        const { data, error } = await sb.rpc('submit_run_score', {
          p_username: auth.username, p_pin: auth.pin, p_score: finalScore, p_rounds: roundsSurvived
        });
        if (error) {
          resultHtml += '<p class="rr-error">' + L.run.errNoSave + escapeHtml(runAuthErrorText(error.message)) + '</p>';
        } else if (data && data.length) {
          rememberRunBest(data[0].best_score);
          if (data[0].is_best) resultHtml += '<p class="rr-best">' + L.run.newBest + '</p>';
        }
      } catch (e) {
        resultHtml += '<p class="rr-error">' + L.run.errNoSave + L.run.errNoConn + '</p>';
      }
    }
    resultHtml = '<div class="run-result">' + resultHtml +
      '<button class="btn-ghost" id="shareBtn" onclick="shareRunResult(' +
      finalScore + ',' + roundsSurvived + ')">' + L.run.share + '</button>' +
      '</div>';
    mode = null;
    openRunHub(resultHtml);
  }

  // ================= ИНИЦИАЛИЗАЦИЯ =================
  document.getElementById('guessInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleGuess(); });
  document.getElementById('finalInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitFinal(); });
  document.getElementById('runPin').addEventListener('keydown', e => { if (e.key === 'Enter') runAuthSubmit(); });

  // Офлайн: страница открывается и играется без сети после первого захода
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  document.getElementById('langSwitcher').value = currentLang;
  document.getElementById('winsNeeded').value = '3';
  applyTranslations();
  showScreen('mode');

  checkRemoteConfig();
  setInterval(checkRemoteConfig, 60000);
</script>
</body>
</html>
