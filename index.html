  function resetSolo() {
    secret = RANGE_MIN + Math.floor(Math.random() * rangeCount());
    history = [];
    gameOver = false;
    gameOverType = null;
    movesUsed = 0;
    lastWinIsRecord = false;
    document.getElementById('finalInput').value = '';
    document.getElementById('guessInput').value = '';
    renderAll();
  }

  function handleGuess() {
    if (online) return onlineGuess();
    if (mode === 'duel') return duelGuess();
    if (mode === 'run') return runGuess();
    if (gameOver) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < RANGE_MIN || guess > RANGE_MAX) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: null });
    input.value = '';

    soundForGuess(meta);
    if (distance === 0) {
      gameOver = true;
      gameOverType = 'win';
      movesUsed = history.length;
      lastWinIsRecord = maybeSaveRecord(RANGE_MAX, history.length);
    } else if (history.length >= MAX_GUESSES) {
      gameOver = true;
      gameOverType = 'lose_waiting';
    }
    renderAll();
  }

  function submitFinal() {
    const input = document.getElementById('finalInput');
    const g = parseInt(input.value);
    if (isNaN(g)) return;
    const win = (g === secret);
    gameOverType = win ? 'win' : 'lose';
    // Последняя догадка в историю не идёт, но ходом она была — считаем её
    movesUsed = history.length + 1;
    lastWinIsRecord = win ? maybeSaveRecord(RANGE_MAX, history.length + 1) : false;
    renderAll();
  }

  // ================= РЕКОРДЫ (только одиночная игра) =================
  function recordKey(rangeMax) { return 'hc_record_' + (frostMode ? 's' : '') + rangeMax; }

  function getRecord(rangeMax) {
    try {
      const v = localStorage.getItem(recordKey(rangeMax));
      return v ? parseInt(v) : null;
    } catch (e) { return null; }
  }

  function maybeSaveRecord(rangeMax, guesses) {
    try {
      const cur = getRecord(rangeMax);
      if (cur === null || guesses < cur) {
        localStorage.setItem(recordKey(rangeMax), String(guesses));
        return true;
      }
    } catch (e) {}
    return false;
  }

  // ================= ДУЭЛЬ =================
  function startMatch() {
    const L = t();
    mode = 'duel';
    D.names[0] = (document.getElementById('nameP1').value || '').trim() || L.defP1;
    D.names[1] = (document.getElementById('nameP2').value || '').trim() || L.defP2;
    D.winsNeeded = parseInt(document.getElementById('winsNeeded').value);
    D.handicap = parseInt(document.getElementById('handicap').value);
    D.wins = [0, 0];
    D.round = 1;
    D.matchOver = false;
    D.starter = (D.handicap === 3) ? 0 : (D.handicap === 4 ? 1 : 0);
    startRound();
    applyTranslations();
    showScreen('game');
  }

  function startRound() {
    secret = RANGE_MIN + Math.floor(Math.random() * rangeCount());
    history = [];
    D.tokens = [1, 1];
    if (D.handicap === 1) D.tokens[0] = 2;
    if (D.handicap === 2) D.tokens[1] = 2;
    D.cur = D.starter;
    D.armed = false;
    D.roundOver = false;
    D.roundWinner = null;
    D.fog = [false, false];
    D.blind = [false, false];
    D.autoLava = [false, false];
    D.skip = [false, false];
    D.shortMemory = [false, false];
    D.nearBonus = false;
    D.lastBonus = null;
    placeBonuses();
    document.getElementById('guessInput').value = '';
    renderAll();
  }

  function nextRound() {
    if (online) return onlineNextRound();
    D.round++;
    if (D.handicap !== 3 && D.handicap !== 4) D.starter = 1 - D.starter;
    startRound();
  }

  function newMatch() {
    D.wins = [0, 0];
    D.round = 1;
    D.matchOver = false;
    D.starter = (D.handicap === 3) ? 0 : (D.handicap === 4 ? 1 : 0);
    startRound();
  }

  function useToken(p) {
    if (mode !== 'duel' || D.roundOver || D.matchOver) return;
    if (p !== D.cur) return;
    if (online) { if (p === online.seat) onlineToken(); return; }
    if (D.armed) {
      D.armed = false;
      D.tokens[p]++;
      renderAll();
      return;
    }
    if (D.tokens[p] <= 0) return;
    if (history.length === 0) return;   // нельзя первым ходом раунда
    D.tokens[p]--;
    D.armed = true;
    renderAll();
  }

  function duelGuess() {
    if (D.roundOver || D.matchOver) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < RANGE_MIN || guess > RANGE_MAX) return;
    input.value = '';
    duelPlay(guess);
  }

  function duelPlay(guess) {
    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: D.cur });
    soundForGuess(meta);

    const hit = D.bonuses.find(b => !b.taken && b.value === guess);
    const radius = bonusNearRadius();
    D.nearBonus = !hit && D.bonuses.some(b => !b.taken && Math.abs(b.value - guess) <= radius);
    // Помеха, которая ослепила бы игрока полностью, на месте превращается в
    // запас ходов — и ровно это игрок и увидит в строке под подсказкой
    let type = hit ? hit.type : null;
    if (type && bonusBlocked(type, 1 - D.cur)) type = 'extra';
    D.lastBonus = type;
    D.lastBonusBy = D.cur;
    if (hit) {
      hit.taken = true;
      applyBonus(type, D.cur);
    }

    const usedDouble = D.armed;
    D.armed = false;

    if (distance === 0) {
      D.roundOver = true;
      D.roundWinner = D.cur;
      D.wins[D.cur]++;
      if (D.wins[D.cur] >= D.winsNeeded) D.matchOver = true;
    } else if (!usedDouble) {
      D.cur = 1 - D.cur;
    }
    renderAll();
  }

  // Туман закрывает чужие ходы, слепой — свои. Вместе они не оставляют игроку
  // ничего: до конца раунда он не видит ни одной подсказки и просто перебирает
  // числа. Второй такой бонус на того же игрока не ложится
  function bonusBlocked(type, victim) {
    if (type === 'fog') return D.blind[victim];
    if (type === 'blind') return D.fog[victim];
    return false;
  }

  // Полезные бонусы бьют по сопернику, ловушки — по тому, кто наступил
  function applyBonus(type, by) {
    const rival = 1 - by;
    if (type === 'extra') D.tokens[by] += 2;
    if (type === 'fog') D.fog[rival] = true;
    if (type === 'blind') D.blind[rival] = true;
    if (type === 'lava') D.autoLava[rival] = true;
    if (type === 'skip') D.skip[by] = true;
    if (type === 'gift') D.tokens[rival] += 1;
    if (type === 'memory') D.shortMemory[by] = true;
  }

  // Ход отнят бонусом: игрок не вводит число, а нажимает кнопку. Раньше ход за
  // него делался сам через секунду — экран менялся, и в моменте никто не
  // понимал, что произошло и кто это сделал
  function forcedTurn() {
    if (mode !== 'duel' || D.roundOver || D.matchOver) return null;
    if (D.skip[D.cur]) return 'skip';
    if (D.autoLava[D.cur]) return 'lava';
    return null;
  }

  // Случайное число в самом горячем поясе, но не само загаданное: иначе бонус
  // дарил бы победу тому, за кого ходит случай
  function lavaThrow() {
    const lava = FEEDBACK_META[7];
    const options = [];
    for (let d = lava.min; d <= lava.max; d++) {
      [secret - d, secret + d].forEach(v => {
        if (v >= RANGE_MIN && v <= RANGE_MAX && v !== secret) options.push(v);
      });
    }
    return options.length ? options[Math.floor(Math.random() * options.length)] : null;
  }

  function doForcedTurn() {
    const kind = forcedTurn();
    if (!kind) return;
    // Жетон на отнятом ходе не сгорает
    if (D.armed) { D.armed = false; D.tokens[D.cur]++; }
    if (kind === 'skip') {
      D.skip[D.cur] = false;
      D.cur = 1 - D.cur;
      renderAll();
      return;
    }
    D.autoLava[D.cur] = false;
    const value = lavaThrow();
    if (value === null) { D.cur = 1 - D.cur; renderAll(); return; }
    duelPlay(value);
  }

  // ================= РЕНДЕР =================
  // Помехи из бонусов прячут чужие или свои ходы от того, чей сейчас ход.
  // Когда раунд окончен, прячется всё равно нечего — показываем как есть
  function hiddenRow(ownerP) {
    if (mode !== 'duel' || D.roundOver || D.matchOver) return false;
    if (ownerP === null || ownerP === undefined) return false;
    const viewer = D.cur;
    const mine = ownerP === viewer;
    if (D.fog[viewer] && !mine) return true;
    if (D.blind[viewer] && mine) return true;
    return false;
  }

  // Подсказка и градусник показывают положение дел прямо сейчас — то есть
  // последний сделанный ход. Если он от игрока закрыт, показывать нечего:
  // откатываться на ход раньше нельзя, старая подсказка прочитается как свежая
  function currentMove() {
    const last = history[history.length - 1];
    return (last && !hiddenRow(last.p)) ? last : null;
  }

  // Попал или нет — видно по поясу, а не по расстоянию. В онлайне расстояния
  // нет вовсе: сервер его не отдаёт, потому что догадка вместе с расстоянием
  // выдаёт ответ с точностью до двух вариантов
  function isHit(h) { return !!(h && h.meta && h.meta.labelIndex === 8); }

  function getFeedback(distance) {
    return FEEDBACK_META.find(f => distance >= f.min && distance <= f.max) || FEEDBACK_META[0];
  }
  function getFbText(meta) { return t().labels[meta.labelIndex]; }

  function renderAll() {
    if (screen !== 'game' && mode === null) return;
    const duel = mode === 'duel';
    const board = document.getElementById('board');
    board.classList.toggle('duel', duel);
    board.classList.toggle('solo', !duel);
    board.classList.toggle('over', roundOver());
    document.getElementById('pcard0').classList.toggle('hidden', !duel);
    document.getElementById('pcard1').classList.toggle('hidden', !duel);
    document.getElementById('historyList').classList.toggle('tall', duel);

    renderFeedback();
    renderVizToggles();
    renderThermo();
    renderNumberLine();
    renderStatus();
    renderResult();
    renderHistory();
    renderBonusLine();
    renderForcedTurn();
    syncScaleBox();
    if (duel) renderPlayers();
  }

  function renderBonusLine() {
    const box = document.getElementById('bonusLine');
    if (!box) return;
    const L = t();
    // Если панель отнятого хода уже сказала то же самое, строка не нужна:
    // два одинаковых сообщения подряд занимают пол-экрана телефона
    const show = mode === 'duel' && bonusMode && !D.roundOver &&
                 (D.lastBonus || D.nearBonus) &&
                 !(D.lastBonus && forcedTurn() === D.lastBonus);
    box.classList.toggle('hidden', !show);
    if (!show) return;
    const by = D.lastBonusBy, rival = 1 - by;
    const desc = (L.bonusDesc[D.lastBonus] || '')
      .replace('{a}', escapeHtml(D.names[by]))
      .replace('{b}', escapeHtml(D.names[rival]));
    // Рядом может лежать и ловушка, поэтому значок нейтральный: сигнал больше
    // не «иди сюда», а «здесь что-то есть — решай сам»
    box.innerHTML = D.lastBonus
      ? '<span class="b-name">🎁 ' + L.bonusNames[D.lastBonus] + '</span>' +
        '<span class="b-desc">' + desc + '</span>'
      : '<span class="b-name">❓ ' + L.bonusNear + '</span>';
  }

  function renderForcedTurn() {
    const box = document.getElementById('forcedTurn');
    if (!box) return;
    const kind = forcedTurn();
    box.classList.toggle('hidden', !kind);
    if (!kind) return;
    const L = t();
    document.getElementById('forcedText').textContent =
      L.forced[kind].replace('{a}', D.names[D.cur]);
    document.getElementById('forcedBtn').textContent = L.forcedBtn[kind];
  }

  function renderFeedback() {
    const panel = document.getElementById('feedbackPanel');
    const last = currentMove();
    const hide = !last || (mode === 'duel' ? D.roundOver : gameOverType === 'win' || gameOverType === 'lose');
    if (hide) { panel.classList.add('hidden'); return; }
    panel.style.background = last.meta.bg;
    panel.style.border = '1px solid ' + last.meta.color;
    panel.classList.remove('hidden');
    const label = document.getElementById('feedbackLabel');
    label.textContent = getFbText(last.meta);
    // Пояс — помощь для тренировки: там учатся. В игре с другом и в рейтинге его
    // нет, иначе это преимущество, а не учёба
    const band = document.getElementById('feedbackBand');
    const showBand = distanceHint && !isHit(last);
    band.classList.toggle('hidden', !showBand);
    band.textContent = showBand ? last.meta.rangeSign : '';
    band.style.color = last.meta.color;
    panel.classList.toggle('with-band', showBand);
    label.style.color = last.meta.color;
  }

  function renderThermo() {
    const wrap = document.getElementById('thermoWrap');
    wrap.classList.toggle('hidden', !showThermo);
    if (!showThermo) return;

    const fill = document.getElementById('thermoFill');
    const bulb = document.getElementById('thermoBulb');
    const last = currentMove();

    let pct, color;
    if (!last) {
      pct = 8;
      color = TIER_COLORS[0].color;
    } else if (isHit(last)) {
      pct = 100;
      color = BULLSEYE_TIER.color;
    } else {
      pct = Math.round(((last.meta.labelIndex + 1) / 9) * 100);
      color = last.meta.color;
    }

    fill.style.height = pct + '%';
    fill.style.background = color;
    bulb.style.background = color;
    bulb.style.boxShadow = '0 0 18px 2px ' + color + '59';

    if (isHit(last)) {
      bulb.classList.remove('pulse');
      void bulb.offsetWidth; // перезапуск анимации при повторной победе
      bulb.classList.add('pulse');
    } else {
      bulb.classList.remove('pulse');
    }
  }

  // ================= ЧИСЛОВАЯ ПРЯМАЯ =================
  // Игрок знает не точное расстояние, а пояс: «очень горячо» — это 4–10.
  // Значит из догадки g следует, что ответ лежит в [g−max; g−min] или [g+min; g+max].
  // Эти два участка и закрашиваем: ученик видит, что ответ бывает по обе стороны,
  // и что минус — не край мира, а такая же сторона прямой.
  const NL = { left: 6, right: 94, axisY: 25, baseY: 45 };

  function nlPos(v) {
    const span = Math.max(1, RANGE_MAX - RANGE_MIN);
    const k = (Math.min(RANGE_MAX, Math.max(RANGE_MIN, v)) - RANGE_MIN) / span;
    return NL.left + (NL.right - NL.left) * k;
  }

  // Шаг делений выбираем круглый и такой, чтобы их поместилось не больше нужного
  function nlStep(span, maxCount) {
    return [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000]
      .find(v => span / v <= maxCount) || span;
  }

  function nlText(x, y, anchor, size, fill, weight, str) {
    return '<text x="' + x + '%" y="' + y + '" text-anchor="' + anchor + '" font-size="' + size +
           '" font-weight="' + weight + '" fill="' + fill + '">' + str + '</text>';
  }

  // Игрок с выключенной анимацией в системе не должен ничего ловить глазами
  function nlCalm() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }

  // Движение точки описываем в самом SVG: разметку прямой мы каждый раз
  // собираем заново, и CSS-переход на новом элементе просто не с чего начинать
  // begin="indefinite" — обязательное: отсчёт SMIL идёт от загрузки страницы,
  // и «begin=0s» на только что вставленном элементе означает «уже давно кончилось».
  // Запускаем вручную сразу после вставки разметки, см. nlPlay()
  // Длительность живёт в CSS, рядом с переходом градусника: одно значение на
  // оба движения, иначе они разъедутся при первой же правке
  let moveDurCache = null;
  function moveDur() {
    if (moveDurCache === null) {
      const v = getComputedStyle(document.documentElement).getPropertyValue('--move-dur');
      moveDurCache = parseFloat(v) || 0.9;
    }
    return moveDurCache;
  }

  function nlSlide(attr, from, to) {
    return '<animate attributeName="' + attr + '" from="' + from + '%" to="' + to +
           '%" dur="' + moveDur() + 's" begin="indefinite" fill="freeze" ' +
           // та же кривая, что у перехода градусника (cubic-bezier(.4,0,.2,1)):
           // одинаковой длительности мало, с разной плавностью они всё равно
           // приходят в разное время
           'calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1" />';
  }

  function nlFade() {
    return '<animate attributeName="opacity" from="0" to="1" dur="' + moveDur() +
           's" begin="indefinite" fill="freeze" />';
  }

  function nlPlay(svg) {
    svg.querySelectorAll('animate').forEach(a => {
      try { a.beginElement(); } catch (e) {}
    });
  }

  // Где стояла точка в прошлый раз и от какого хода. Ключ нужен, чтобы прямая
  // не дёргалась на перерисовках без хода — от поворота экрана или кнопки
  let nlAnim = { key: null, x: null };

  function nlTick(v, y1, y2, stroke, width) {
    return '<line x1="' + nlPos(v) + '%" y1="' + y1 + '" x2="' + nlPos(v) + '%" y2="' + y2 +
           '" stroke="' + stroke + '" stroke-width="' + width + '" />';
  }

  // Партия (или раунд в дуэли) кончилась. Вопрос один и тот же в четырёх местах,
  // поэтому и ответ на него один
  function roundOver() {
    return (mode === 'duel') ? D.roundOver
                             : (gameOverType === 'win' || gameOverType === 'lose');
  }

  function renderNumberLine() {
    const box = document.getElementById('numLine');
    const svg = document.getElementById('numLineSvg');
    if (!box || !svg) return;
    box.classList.toggle('hidden', !showLine);
    if (!showLine) return;

    const span = Math.max(1, RANGE_MAX - RANGE_MIN);
    // Закрытые ходы на прямой не отмечаем, а залитой точкой обозначаем только
    // настоящий последний ход — если он виден
    const visible = history.slice(-historyVisible()).filter(h => !hiddenRow(h.p));
    const last = currentMove();
    const rings = last ? visible.filter(h => h !== last) : visible;
    let out = '';

    // Сама прямая
    out += '<line x1="' + NL.left + '%" y1="' + NL.axisY + '" x2="' + NL.right + '%" y2="' + NL.axisY +
           '" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round" />';

    // Подписей помещается столько, сколько позволяет ширина: считаем её по самому
    // длинному числу на прямой, иначе на узком телефоне они наедут друг на друга.
    // На телефоне шрифт крупнее: читать эти числа должен второклассник с рук
    const w = svg.clientWidth || 320;
    const fs = w < 520 ? 12 : 11;
    const labelPx = Math.max(formatNum(RANGE_MIN).length, formatNum(RANGE_MAX).length) * fs * 0.62 + 9;
    const labelPct = (labelPx / w) * 100;
    // Считаем по той длине, что прямая занимает на самом деле, а не по всей ширине
    const labelRoom = w * (NL.right - NL.left) / 100;
    const labelStep = nlStep(span, Math.max(2, Math.floor(labelRoom / labelPx)));
    const tickStep = nlStep(span, 20);

    for (let v = Math.ceil(RANGE_MIN / tickStep) * tickStep; v <= RANGE_MAX; v += tickStep) {
      if (v === 0 && RANGE_MIN < 0) continue;       // ноль рисуется отдельно и ярче
      out += nlTick(v, NL.axisY + 3, NL.axisY + 7, 'rgba(255,255,255,0.22)', 1.5);
    }

    for (let v = Math.ceil(RANGE_MIN / labelStep) * labelStep; v <= RANGE_MAX; v += labelStep) {
      if (v === 0 && RANGE_MIN < 0) continue;
      const p = nlPos(v);
      // пропускаем только те, что реально налезли бы на подписи границ
      if (Math.abs(p - NL.left) < labelPct || Math.abs(p - NL.right) < labelPct) continue;
      out += nlTick(v, NL.axisY + 3, NL.axisY + 9, 'rgba(255,255,255,0.35)', 1.5);
      out += nlText(p, NL.baseY, 'middle', fs, 'rgba(255,255,255,0.5)', 400, formatNum(v));
    }

    // Ноль отмечаем отдельно — ради него всё и затевалось
    if (RANGE_MIN < 0 && RANGE_MAX > 0) {
      out += nlTick(0, NL.axisY - 7, NL.axisY + 9, 'rgba(255,255,255,0.55)', 1.5);
      out += nlText(nlPos(0), NL.baseY, 'middle', fs, 'rgba(255,255,255,0.75)', 700, '0');
    }

    // Границы диапазона. Их подписи тоже по центру деления, как у остальных:
    // так соседнее число не приходится выбрасывать из-за мнимого наложения
    [RANGE_MIN, RANGE_MAX].forEach(v => {
      out += nlText(nlPos(v), NL.baseY, 'middle', fs, 'rgba(255,255,255,0.5)', 400, formatNum(v));
    });

    // Раунд кончился — число больше не тайна. Словами его и так называют, но на
    // прямой видно то, чего в словах нет: насколько мимо прошли догадки и с
    // какой стороны. Ради этого прямая и нужна
    const revealed = roundOver();

    // Прошлые догадки — полыми кружками, текущая — залитым. После раскрытия
    // залитая точка снимается: ярким на прямой остаётся только ответ
    (revealed ? visible : rings).forEach(h => {
      out += '<circle cx="' + nlPos(h.guess) + '%" cy="' + NL.axisY + '" r="2.5" fill="none" ' +
             'stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />';
    });

    // Новый ход или нет — видно по ключу. Двигаем точку только на новом ходе:
    // так глаз сам замечает, в какую сторону игрок сдвинулся и насколько
    const animKey = history.length + '|' + (last ? last.guess : '-') + '|' + revealed +
                    '|' + RANGE_MIN + '|' + RANGE_MAX;
    const fresh = animKey !== nlAnim.key && !nlCalm();
    let dotX = null;

    if (last && !revealed) {
      const color = isHit(last) ? BULLSEYE_TIER.color : last.meta.color;
      const p = nlPos(last.guess);
      dotX = p;
      // Ехать есть откуда только со второго хода: первому не от чего отталкиваться
      const from = (fresh && nlAnim.x !== null) ? nlAnim.x : null;
      const move = (from === null) ? '' : nlSlide('cx', from, p);
      out += '<circle cx="' + p + '%" cy="' + NL.axisY + '" r="5" fill="#0f1430" stroke="' + color +
             '" stroke-width="2.5">' + (move || (fresh ? nlFade() : '')) + '</circle>';
      // у самого края подпись разворачиваем внутрь, иначе она уезжает за карточку
      const anchor = p < 12 ? 'start' : (p > 88 ? 'end' : 'middle');
      const label = nlText(p, 12, anchor, fs + 3, color, 700, formatNum(last.guess));
      // Подпись едет вместе со своей точкой, иначе число отрывается от неё
      out += (from === null) ? label
                             : label.replace('</text>', nlSlide('x', from, p) + '</text>');
    }

    if (revealed) {
      const p = nlPos(secret);
      const color = BULLSEYE_TIER.color;
      out += nlTick(secret, NL.axisY - 10, NL.axisY + 10, color, 2);
      out += '<circle cx="' + p + '%" cy="' + NL.axisY + '" r="5" fill="' + color +
             '" stroke="#0f1430" stroke-width="1.5">' + (fresh ? nlFade() : '') + '</circle>';
      const anchor = p < 12 ? 'start' : (p > 88 ? 'end' : 'middle');
      out += nlText(p, 12, anchor, fs + 3, color, 700, formatNum(secret));
    }

    if (animKey !== nlAnim.key) nlAnim = { key: animKey, x: dotX };

    svg.innerHTML = out;
    nlPlay(svg);
  }

  function setScaleOpen(open) {
    const box = document.getElementById('scaleBox');

  function initScaleBox() {
    const box = document.getElementById('scaleBox');
    if (!box) return;
    // toggle у <details> приходит отложенно, поэтому свой щелчок от щелчка игрока
    // отличаем не флагом (он успеет сброситься), а совпадением с выставленным
    box.addEventListener('toggle', () => {
      const auto = scaleAutoValue;
      scaleAutoValue = null;
      if (auto !== null && box.open === auto) return;
      scaleWanted = box.open;
      try { localStorage.setItem('hc_scale_open', scaleWanted ? '1' : '0'); } catch (e) {}
    });
    setScaleOpen(scaleWanted);

  function playTone(freq, seconds, delay) {
    if (!soundOn) return;
    try {
      // Контекст создаём при первом касании: iOS не даёт звучать без действия игрока
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const start = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + seconds);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + seconds + 0.02);
    } catch (e) {}
  }

  function buzz(pattern) {
    if (!soundOn) return;

      localStorage.setItem('hc_run_pin', pin);
      afterAuth();
    } catch (e) {
      runAuthError(L.run.errNoConn);
    } finally {
      btn.disabled = false;
    }
  }

  async function runLogin() {
    const L = t();
    const { username, pin } = runAuthReadForm();
    if (!username || !pin) return runAuthError(L.run.errFill);
    if (!sb) return runAuthError(L.run.errNoConn);
    const btn = document.getElementById('runAuthSubmitBtn');
    btn.disabled = true;
    try {
      const { data, error } = await sb.rpc('login_student', { p_username: username, p_pin: pin });
      if (error) return runAuthError(runAuthErrorText(error.message));
      if (data !== true) return runAuthError(L.run.errBadLogin);
      localStorage.setItem('hc_run_user', username);
      localStorage.setItem('hc_run_pin', pin);
      afterAuth();
    } catch (e) {
      runAuthError(L.run.errNoConn);
    } finally {
      btn.disabled = false;
    }
  }

  // Подсказку к PIN ученик пишет сам, и она не секрет — иначе от неё не было бы толку
  async function showPinHint() {
    const L = t();
    const username = (document.getElementById('runUsername').value || '').trim();
    if (!username) return runAuthError(L.run.errFill);
    if (!sb) return runAuthError(L.run.errNoConn);
    try {
      const { data, error } = await sb.rpc('get_pin_hint', { p_username: username });
      if (error) return runAuthError(runAuthErrorText(error.message));
      runAuthError(data ? L.run.hintIs + data : L.run.noHint);
    } catch (e) {
      runAuthError(L.run.errNoConn);
    }
  }

  // Свой собственный PIN на своём же устройстве: он и так лежит в браузере,
  // так что показать его владельцу — это не раскрытие, а напоминание
  function revealOwnPin() {
    const auth = runAuth();
    if (!auth) return;
    document.getElementById('tShowPin').textContent = t().run.yourPin + auth.pin;
  }

  async function openRunHub(message) {
    const auth = runAuth();
    if (!auth) return showScreen('authChoice');
    renderGreeting(auth.username);
    document.getElementById('runHubMessage').innerHTML = message || '';
    renderUnfinished();
    await renderRunLeaderboard();
    showScreen('runHub');
  }

  function renderGreeting(name) {
    const html = name
      ? t().run.greeting.replace('{name}', '<strong>' + escapeHtml(name) + '</strong>')
      : '';
    document.querySelectorAll('.run-greeting').forEach(el => {
      el.classList.toggle('hidden', !name);
      if (name) el.innerHTML = html;
    });
  }

  // Личный рекорд знаем из двух бесплатных источников: ответа сервера при отправке
  // результата и собственной строки в общем топе. Отдельный запрос ради него не нужен.
  //
  // Ключ — с именем ученика. На одном телефоне играют по очереди: с общим ключом
  // следующий вошедший видел чужой рекорд как свой
  function runBestKey() {
    const auth = runAuth();
    return auth ? 'hc_run_best_' + auth.username.toLowerCase() : null;
  }

  function runBest() {
    const key = runBestKey();
    if (!key) return 0;
    const v = parseInt(localStorage.getItem(key));
    return isNaN(v) ? 0 : v;
  }

  function rememberRunBest(value) {
    const key = runBestKey();
    if (!key) return;
    if (typeof value === 'number' && value > runBest()) {
      try { localStorage.setItem(key, String(value)); } catch (e) {}
    }
  }

  // 'week' — топ за последние 7 дней, 'all' — за всё время.
  // Дневной по умолчанию: вечный топ застывает, недельный к пятнице уже решён,
  // а сегодняшний догоняем за один вечер — ради этого и возвращаются
  let leaderboardScope = 'day';
  const LB_RPC = { day: 'run_leaderboard_daily', week: 'run_leaderboard_weekly', all: 'run_leaderboard' };

  function setLeaderboardScope(scope) {
    leaderboardScope = scope;
    renderRunLeaderboard();
  }

  async function renderRunLeaderboard() {
    const el = document.getElementById('runLeaderboardList');
    if (!sb || !el) return;
    const L = t();
    const auth = runAuth();
    document.getElementById('tRunTopDay').classList.toggle('active', leaderboardScope === 'day');
    document.getElementById('tRunTopWeek').classList.toggle('active', leaderboardScope === 'week');
    document.getElementById('tRunTopAll').classList.toggle('active', leaderboardScope === 'all');
    el.innerHTML = '';
    try {
      let { data, error } = await sb.rpc(LB_RPC[leaderboardScope]);
      // пока миграция со срезом не применена — показываем общий топ, а не пустоту
      if (error && leaderboardScope !== 'all') {
        ({ data, error } = await sb.rpc(LB_RPC.all));
      }
      if (error) return;
      if (!data || !data.length) {
        el.innerHTML = '<div class="lb-empty">' + L.run.noScores + '</div>';
        return;
      }
      el.innerHTML = data.map((r, i) => {
        const isMe = auth && String(r.username).toLowerCase() === auth.username.toLowerCase();
        if (isMe && leaderboardScope === 'all') rememberRunBest(r.best_run_score);
        const style = isMe ? ' style="color:#fbbf24;font-weight:700"' : '';
        return '<div class="lb-row"' + style + '><span>' + (i + 1) + '. ' + escapeHtml(r.username) +
               '</span><span>' + formatNum(r.best_run_score) + '</span></div>';
      }).join('');
    } catch (e) {}
  }

  // ================= ОНЛАЙН: ДРУЗЬЯ =================
  // Список опрашивается, пока экран открыт: входящая заявка должна появиться
  // сама, без перезахода. Раз в десять секунд — заметить успеваешь, а нагрузка
  // остаётся крошечной: два запроса в минуту на одного открытого игрока
  const FRIENDS_POLL_MS = 10000;
  let friendsTimer = null;
  let friendsBusy = false;

  function openOnline() {
    const auth = runAuth();
    if (!auth) { authReturn = 'online'; return showScreen('authChoice'); }
    renderGreeting(auth.username);
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('friendSearch').value = '';
    setNote('searchNote', '');
    setNote('friendsNote', '');
    setNote('gamesNote', '');
    closeChallenge();
    applyTranslations();
    showScreen('online');
    startFriendsPoll();
    loadFriends();
    loadMatches();
  }

  function startFriendsPoll() {
    stopFriendsPoll();
    friendsTimer = setInterval(() => {
      if (screen !== 'online') return stopFriendsPoll();
      loadFriends(true);
      loadMatches(true);
    }, FRIENDS_POLL_MS);
  }

  function stopFriendsPoll() {
    if (friendsTimer) { clearInterval(friendsTimer); friendsTimer = null; }
  }

  function setNote(id, text, bad) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || '';
    el.classList.toggle('hidden', !text);
    el.classList.toggle('bad', !!bad);
  }

  // Сервер отвечает кодом, игрок должен прочитать человеческую фразу
  function friendErrorText(message) {
    const L = t();
    const m = String(message || '');
    // Сеть отвалилась: supabase-js бросает «Failed to fetch» и подобное, и это
    // не ошибка сервера, а её отсутствие — игрок должен прочитать про связь
    if (m.indexOf('no_conn') >= 0) return L.run.errNoConn;
    if (/fetch|network|offline|Load failed/i.test(m)) return L.run.errNoConn;
    if (m.indexOf('auth_failed') >= 0) return L.online.errAuth;
    if (m.indexOf('locked_out') >= 0) return L.run.errLocked;
    if (m.indexOf('query_too_short') >= 0) return L.online.errShort;
    if (m.indexOf('no_such_student') >= 0) return L.online.errNoStudent;
    if (m.indexOf('cannot_friend_self') >= 0) return L.online.errSelf;
    if (m.indexOf('recently_declined') >= 0) return L.online.errDeclined;
    if (m.indexOf('too_many_requests') >= 0) return L.online.errTooMany;
    if (m.indexOf('no_such_request') >= 0) return L.online.errNoRequest;
    return L.run.errServer + m;
  }

  // Имя и PIN подставляются сами: руками их не передаёт ни один вызов
  async function friendRpc(name, args) {
    const auth = runAuth();
    if (!auth || !sb) throw new Error('no_conn');
    const { data, error } = await sb.rpc(name,
      Object.assign({ p_username: auth.username, p_pin: auth.pin }, args || {}));
    if (error) throw new Error(error.message);
    return data;
  }

  // Входящие заявки первыми: это единственное, что требует действия
  const FRIEND_ORDER = { incoming: 0, friend: 1, outgoing: 2 };

  function friendRow(name, relation) {
    const L = t().online;
    const row = document.createElement('div');
    row.className = 'friend-row';
    row.dataset.name = name;
    row.dataset.relation = relation || 'none';

    const who = document.createElement('span');
    who.className = 'fr-name';
    who.textContent = name;
    row.appendChild(who);

    const button = (label, cls, fn) => {
      const b = document.createElement('button');
      b.className = 'fr-btn' + (cls ? ' ' + cls : '');
      b.textContent = label;
      b.onclick = fn;
      row.appendChild(b);
    };

    if (relation === 'incoming') {
      button(L.accept, 'yes', () => respondFriend(name, true));
      button(L.decline, 'no', () => respondFriend(name, false));
    } else if (relation === 'friend') {
      button(L.challenge, 'yes', () => openChallenge(name));
      button(L.remove, '', () => removeFriend(name));
    } else if (relation === 'outgoing') {
      const wait = document.createElement('span');
      wait.className = 'fr-wait';
      wait.textContent = L.waiting;
      row.appendChild(wait);
    } else if (relation !== 'declined') {
      button(L.add, '', () => addFriend(name));
    }
    return row;
  }

  function renderFriends(rows) {
    const box = document.getElementById('friendsList');
    box.innerHTML = '';
    rows.slice()
      .sort((a, b) => (FRIEND_ORDER[a.relation] - FRIEND_ORDER[b.relation]) ||
                      String(a.username).localeCompare(String(b.username)))
      .forEach(r => box.appendChild(friendRow(r.username, r.relation)));
  }

  // quiet — это опрос по таймеру: молча, иначе на экране будет мигать ошибка
  // связи каждые десять секунд
  async function loadFriends(quiet) {
    if (friendsBusy) return;
    friendsBusy = true;
    try {
      const rows = (await friendRpc('list_friends')) || [];
      renderFriends(rows);
      setNote('friendsNote', rows.length ? '' : t().online.noFriends);
    } catch (e) {
      if (!quiet) setNote('friendsNote', friendErrorText(e.message), true);
    } finally {
      friendsBusy = false;
    }
  }

  // Игры и заявки на игру живут рядом с друзьями и обновляются тем же опросом
  function matchRow(m) {
    const L = t().online;
    const row = document.createElement('div');
    row.className = 'friend-row';
    row.dataset.id = m.id;
    row.dataset.state = m.status === 'invited' ? (m.seat === 1 ? 'incoming' : 'outgoing') : 'active';

    const who = document.createElement('span');
    who.className = 'fr-name';
    who.textContent = m.other;
    row.appendChild(who);

    const button = (label, cls, fn) => {
      const b = document.createElement('button');
      b.className = 'fr-btn' + (cls ? ' ' + cls : '');
      b.textContent = label;
      b.onclick = fn;
      row.appendChild(b);
    };
    const note = text => {
      const el = document.createElement('span');
      el.className = 'fr-wait';
      el.textContent = text;
      row.appendChild(el);
    };

    if (m.status === 'invited' && m.seat === 1) {
      button(L.accept, 'yes', () => answerChallenge(m.id, true));
      button(L.decline, 'no', () => answerChallenge(m.id, false));
    } else if (m.status === 'invited') {
      note(L.waiting);
      button(L.cancelGame, '', () => dropMatch(m.id));
    } else {
      note(m.my_turn ? L.yourTurn : L.theirTurn);
      button(L.play, m.my_turn ? 'yes' : '', () => openMatch(m.id));
    }
    return row;
  }

  async function loadMatches(quiet) {
    try {
      const rows = (await friendRpc('list_matches')) || [];
      const box = document.getElementById('gamesList');
      box.innerHTML = '';
      rows.forEach(m => box.appendChild(matchRow(m)));
      setNote('gamesNote', rows.length ? '' : t().online.noGames);
    } catch (e) {
      if (!quiet) setNote('gamesNote', onlineMatchError(e.message), true);
    }
  }

  function openChallenge(name) {
    const box = document.getElementById('challengeBox');
    box.dataset.name = name;
    document.getElementById('challengeTitle').textContent =
      t().online.chTitle.replace('{name}', name);
    box.classList.remove('hidden');
  }

  function closeChallenge() {
    document.getElementById('challengeBox').classList.add('hidden');
  }

  async function sendChallenge() {
    const box = document.getElementById('challengeBox');
    const name = box.dataset.name;
    try {
      await friendRpc('challenge_friend', {
        p_to: name,
        p_range: parseInt(document.getElementById('chRange').value),
        p_frost: document.getElementById('chFrost').checked,
        p_wins: parseInt(document.getElementById('chWins').value)
      });
      closeChallenge();
      await loadMatches();
      setNote('gamesNote', t().online.sentGame.replace('{name}', name));
    } catch (e) {
      setNote('gamesNote', onlineMatchError(e.message), true);
    }
  }

  async function answerChallenge(id, accept) {
    try {
      const status = await friendRpc('respond_challenge', { p_match_id: id, p_accept: !!accept });
      await loadMatches();
      if (status === 'active') openMatch(id);
    } catch (e) {
      setNote('gamesNote', onlineMatchError(e.message), true);
    }
  }

  async function dropMatch(id) {
    try {
      await friendRpc('leave_match', { p_match_id: id });
      await loadMatches();
    } catch (e) {
      setNote('gamesNote', onlineMatchError(e.message), true);
    }
  }

  async function searchStudents() {
    const q = (document.getElementById('friendSearch').value || '').trim();
    const box = document.getElementById('searchResults');
    box.innerHTML = '';
    if (q.length < 2) return setNote('searchNote', t().online.errShort, true);
    setNote('searchNote', t().online.searching);
    try {
      const rows = (await friendRpc('find_students', { p_query: q })) || [];
      rows.forEach(r => box.appendChild(friendRow(r.username, r.relation)));
      setNote('searchNote', rows.length ? '' : t().online.nobody);
    } catch (e) {
      setNote('searchNote', friendErrorText(e.message), true);
    }
  }

  async function addFriend(name) {
    try {
      await friendRpc('send_friend_request', { p_to: name });
      await searchStudents();
      setNote('searchNote', t().online.sent.replace('{name}', name));
      loadFriends(true);
    } catch (e) {
      setNote('searchNote', friendErrorText(e.message), true);
    }
  }

  async function respondFriend(name, accept) {
    try {
      await friendRpc('respond_friend_request', { p_from: name, p_accept: !!accept });
      await loadFriends();
    } catch (e) {
      setNote('friendsNote', friendErrorText(e.message), true);
    }
  }

  async function removeFriend(name) {
    try {
      await friendRpc('remove_friend', { p_other: name });
      await loadFriends();
    } catch (e) {
      setNote('friendsNote', friendErrorText(e.message), true);
    }
  }

  // ================= ОНЛАЙН: МАТЧ =================
  // Играется он тем же экраном и той же отрисовкой, что дуэль за одним
  // телефоном: mode остаётся 'duel', а online хранит то, чего у местной игры
  // нет — номер матча и своё место за доской. Ветвится только ввод: ход, жетон
  // и следующий раунд уходят на сервер, а не считаются здесь
  const MATCH_POLL_MS = 2000;
  let online = null;
  let matchTimer = null;
  let matchBusy = false;

  function onlineMatchError(message) {
    const L = t();
    const m = String(message || '');
    if (m.indexOf('not_your_turn') >= 0) return L.online.errNotYourTurn;
    if (m.indexOf('round_over') >= 0) return L.online.errRoundOver;
    if (m.indexOf('out_of_range') >= 0) return L.online.errOutOfRange;
    if (m.indexOf('no_tokens') >= 0) return L.online.errNoTokens;
    if (m.indexOf('not_first_move') >= 0) return L.online.errFirstMove;
    if (m.indexOf('match_already_live') >= 0) return L.online.errLive;
    if (m.indexOf('not_a_friend') >= 0) return L.online.errNotFriend;
    if (m.indexOf('invite_closed') >= 0) return L.online.errInviteGone;
    if (m.indexOf('no_such_match') >= 0) return L.online.errNoMatch;
    if (m.indexOf('not_playing') >= 0) return L.online.errNotPlaying;
    return friendErrorText(m);
  }

  // Состояние с сервера — единственный источник правды: всё, что рисуется,
  // берётся отсюда, и ничего не досчитывается на месте
  function applyMatchState(st) {
    if (!st) return;
    online.seat = st.seat;
    online.status = st.status;
    mode = 'duel';
    RANGE_MIN = st.rangeMin;
    RANGE_MAX = st.rangeMax;
    frostMode = !!st.frost;
    FEEDBACK_META = buildFeedbackMeta(maxDistance() + 1);

    D.names = st.names.slice();
    D.winsNeeded = st.winsNeeded;
    D.wins = st.wins.slice();
    D.round = st.round;
    D.cur = st.cur;
    D.tokens = st.tokens.slice();
    D.armed = !!st.armed;
    D.roundOver = !!st.roundOver;
    D.roundWinner = st.roundWinner;
    D.matchOver = !!st.matchOver;
    // Помех в онлайне пока нет, но отрисовка их спрашивает
    D.fog = [false, false];
    D.blind = [false, false];
    D.autoLava = [false, false];
    D.skip = [false, false];
    D.shortMemory = [false, false];
    D.nearBonus = false;
    D.lastBonus = null;
    D.bonuses = [];

    // Расстояния сервер не присылает: пояс — это всё, что известно
    history = (st.moves || []).map(mv => ({
      guess: mv.guess, distance: null, meta: FEEDBACK_META[mv.tier], p: mv.seat
    }));
    secret = (st.secret === null || st.secret === undefined) ? 0 : st.secret;
    applyRangeToInputs();
    renderAll();
  }

  async function refreshMatch(quiet) {
    if (!online || matchBusy) return;
    matchBusy = true;
    try {
      const st = await friendRpc('match_state', { p_match_id: online.id });
      applyMatchState(st);
      if (!quiet) setMatchNote('');
    } catch (e) {
      if (!quiet) setMatchNote(onlineMatchError(e.message));
    } finally {
      matchBusy = false;
    }
  }

  // Строка связи живёт в той же полоске, что и бонусы: отдельного места для
  // неё на экране нет, а во время онлайн-матча бонусов всё равно не бывает
  function setMatchNote(text) {
    const box = document.getElementById('matchNote');
    if (!box) return;
    box.textContent = text ? '\u26a0\ufe0f ' + text : '';
    box.classList.toggle('hidden', !text);
  }

  function startMatchPoll() {
    stopMatchPoll();
    matchTimer = setInterval(() => {
      if (online && screen === 'game') refreshMatch(true); else stopMatchPoll();
    }, MATCH_POLL_MS);
  }

  function stopMatchPoll() {
    if (matchTimer) { clearInterval(matchTimer); matchTimer = null; }
  }

  async function openMatch(id) {
    online = { id: id, seat: 0, status: 'active' };
    stopFriendsPoll();
    try {
      const st = await friendRpc('match_state', { p_match_id: id });
      applyMatchState(st);
    } catch (e) {
      online = null;
      setNote('friendsNote', onlineMatchError(e.message), true);
      return;
    }
    applyTranslations();
    showScreen('game');
    renderAll();
    startMatchPoll();
  }

  async function onlineGuess() {
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < RANGE_MIN || guess > RANGE_MAX) return;
    if (D.cur !== online.seat) return setMatchNote(t().online.errNotYourTurn);
    input.value = '';
    try {
      await friendRpc('match_guess', { p_match_id: online.id, p_guess: guess });
      await refreshMatch();
    } catch (e) {
      setMatchNote(onlineMatchError(e.message));
      await refreshMatch(true);
    }
  }

  async function onlineToken() {
    try {
      await friendRpc('use_match_token', { p_match_id: online.id, p_arm: !D.armed });
      await refreshMatch();
    } catch (e) {
      setMatchNote(onlineMatchError(e.message));
    }
  }

  async function onlineNextRound() {
    try {
      await friendRpc('next_match_round', { p_match_id: online.id });
      await refreshMatch();
    } catch (e) {
      setMatchNote(onlineMatchError(e.message));
      await refreshMatch(true);
    }
  }

  // Уход с экрана матч не закрывает: к начатой игре можно вернуться
  function backToOnline() {
    stopMatchPoll();
    setMatchNote('');
    online = null;
    mode = null;
    setMatchNote('');
    openOnline();
  }

  // ================= ПАУЗА И СОХРАНЁННАЯ ИГРА =================
  // Состояние пишется после каждого хода, поэтому закрытая вкладка, севший телефон
  // или случайный выход не стоят игроку результата: игра ждёт его на том же месте.
  const RUN_STATE_KEY = 'hc_run_state';

  function saveRunState() {
    if (!RUN) return;
    try {
      localStorage.setItem(RUN_STATE_KEY, JSON.stringify({
        round: RUN.round,
        totalScore: RUN.totalScore,
        range: RANGE_MAX,
        rangeMin: RANGE_MIN,
        allowed: MAX_GUESSES,
        secret: secret,
        history: history.map(h => ({ guess: h.guess, distance: h.distance })),
        user: (runAuth() || {}).username || ''
      }));
    } catch (e) {}
  }

  function loadRunState() {
    try {
      const raw = localStorage.getItem(RUN_STATE_KEY);
      if (!raw) return null;
      const st = JSON.parse(raw);
      if (!st || typeof st.round !== 'number' || typeof st.secret !== 'number') return null;
      // Игра принадлежит тому, кто её начал. Регистр не учитываем: сервер пускает
      // «аню» в аккаунт «Ани», и незаконченная игра должна найтись так же
      const auth = runAuth();
      if (st.user && auth &&
          String(st.user).toLowerCase() !== auth.username.toLowerCase()) return null;
      return st;
    } catch (e) { return null; }
  }

  function clearRunState() {
    try { localStorage.removeItem(RUN_STATE_KEY); } catch (e) {}
  }

  // Восстанавливаем прерванную игру ровно в том виде, в каком её оставили
  function applyRunState(st) {
    RUN = { round: st.round, totalScore: st.totalScore, locked: false };
    mode = 'run';
    RANGE_MAX = st.range;
    // игры, сохранённые до появления «мороза и жары», нижней границы не знают
    RANGE_MIN = (typeof st.rangeMin === 'number') ? st.rangeMin : 1;
    MAX_GUESSES = st.allowed;
    FEEDBACK_META = buildFeedbackMeta(maxDistance() + 1);
    secret = st.secret;
    history = (st.history || []).map(h => ({
      guess: h.guess, distance: h.distance, meta: getFeedback(h.distance), p: null
    }));
    gameOver = false;
    gameOverType = null;
    document.getElementById('guessInput').value = '';
    applyRangeToInputs();
  }

  function resumeSavedRun() {
    const st = loadRunState();
    if (!st) { renderUnfinished(); return; }
    applyRunState(st);
    applyTranslations();
    showScreen('game');
  }

  // «Завершить» из хаба: доигрывать не хочется, но результат должен засчитаться
  function finishSavedRun() {
    const st = loadRunState();
    if (!st) { renderUnfinished(); return; }
    applyRunState(st);
    clearRunState();
    endRun();
  }

  function renderUnfinished() {
    const L = t();
    const st = loadRunState();
    const box = document.getElementById('unfinishedBox');
    box.classList.toggle('hidden', !st);
    // пока игра не закончена, новую не предлагаем — иначе она молча потеряется
    document.getElementById('tRunStart').classList.toggle('hidden', !!st);
    if (!st) return;
    document.getElementById('unfinishedInfo').textContent =
      L.run.unfinishedInfo.replace('{round}', st.round).replace('{score}', formatNum(st.totalScore));
  }

  function openPause() {
    saveRunState();
    document.getElementById('pauseModal').classList.remove('hidden');
  }

  function closePause() {
    document.getElementById('pauseModal').classList.add('hidden');
  }

  function pauseAndLeave() {
    closePause();
    saveRunState();
    RUN = null;
    mode = null;
    applyTranslations();
    openRunHub();
  }

  function giveUpRun() {
    closePause();
    clearRunState();
    endRun();
  }

  // Поделиться результатом: системное окно «Поделиться» там, где оно есть
  // (в Safari на iPhone работает), иначе просто копируем в буфер
  async function shareRunResult(score, rounds) {
    const L = t();
    const link = location.origin + location.pathname;
    const text = L.run.shareText
      .replace('{score}', withPlural(score, L.run.pointForms))
      .replace('{rounds}', withPlural(rounds, L.run.roundForms));
    const btn = document.getElementById('shareBtn');
    try {
      if (navigator.share) {
        await navigator.share({ text: text, url: link });
        return;
      }
      await navigator.clipboard.writeText(text + ' ' + link);
      if (btn) {
        btn.textContent = L.run.shareCopied;
        setTimeout(() => { if (btn) btn.textContent = L.run.share; }, 2000);
      }
    } catch (e) {
      // отказ игрока в системном окне — не ошибка, молчим
    }
  }

  // ================= ЗАБЕГ: сама игра =================
  let RUN = null;

  // Диапазон округляется до круглого числа: «от 1 до 250» читается и держится в голове,
  // «от 1 до 234» — нет. Шаг округления растёт вместе с числом.
  function roundRangeValue(v) {
    const step = v < 100 ? 10 : v < 500 ? 50 : v < 1000 ? 100 : v < 5000 ? 500 : 1000;
    return Math.max(10, Math.round(v / step) * step);
  }

  // Диапазон растёт до потолка и дальше не увеличивается: «угадай число до полумиллиона»
  // формально проходимо, но играть в это на телефоне невозможно
  function runRangeForRound(n) {
    const grown = RUN_CONFIG.start_range * Math.pow(RUN_CONFIG.growth, n - 1);
    return roundRangeValue(Math.min(grown, RUN_CONFIG.range_cap));
  }

  // Сложность после потолка идёт от точности: с каждым раундом на попытку меньше.
  // Без этого игра не заканчивается — по градуснику с девятью поясами игрок получает
  // за ход около трёх бит, а попыток выдаётся из расчёта одного бита за ход, то есть вдвое больше нужного.
  function runAttemptsForRound(n, range) {
    const buffer = Math.max(0, RUN_CONFIG.buffer_start - (n - 1) * RUN_CONFIG.buffer_shrink);
    const squeeze = Math.max(0, n - RUN_CONFIG.squeeze_start);
    // потолок: попыток всегда заметно меньше, чем чисел в диапазоне,
    // иначе на маленьких диапазонах раунд проходится тупым перебором
    const cap = Math.max(2, Math.ceil(range * 0.6));
    const allowed = Math.min(minAttempts(range) + buffer, cap) - squeeze;
    return Math.max(RUN_CONFIG.min_attempts, allowed);
  }

  // Режим на рейтинг играется на том же экране, что и одиночная игра:
  // термометр, история попыток и шкала берутся оттуда как есть
  function startRun() {
    RUN = { round: 1, totalScore: 0, locked: false };
    mode = 'run';
    startRunRound();
    applyTranslations();
    showScreen('game');
  }

  function startRunRound() {
    if (!RUN) return;
    applyBounds(runRangeForRound(RUN.round));
    MAX_GUESSES = runAttemptsForRound(RUN.round, rangeCount());
    secret = RANGE_MIN + Math.floor(Math.random() * rangeCount());
    history = [];
    gameOver = false;
    gameOverType = null;
    RUN.locked = false;
    document.getElementById('guessInput').value = '';
    applyRangeToInputs();
    applyTranslations();
    saveRunState();
  }

  function runGuess() {
    // locked — пауза между раундами: иначе можно ввести уже угаданное число ещё раз и получить очки повторно
    if (!RUN || RUN.locked) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < RANGE_MIN || guess > RANGE_MAX) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: null });
    input.value = '';
    soundForGuess(meta);

    if (distance === 0) {
      const roundPoints = Math.round(100 * RUN.round * (minAttempts(rangeCount()) / history.length));
      RUN.totalScore += roundPoints;
      RUN.locked = true;
      RUN.round++;
      renderAll();
      saveRunState();
      const L = t();
      document.getElementById('feedbackLabel').textContent =
        L.labels[8] + '  +' + withPlural(roundPoints, L.run.pointForms);
      setTimeout(startRunRound, 900);
    } else if (history.length >= MAX_GUESSES) {
      gameOver = true;
      soundGameOver();
      renderAll();
      endRun();
    } else {
      renderAll();
      saveRunState();
    }
  }

  async function endRun() {
    const L = t();
    clearRunState();
    const finalScore = RUN.totalScore;
    const roundsSurvived = RUN.round - 1;
    const secretWas = secret;
    RUN = null;
    let resultHtml = '<div class="rr-title">' + L.run.over + '</div>' +
      '<p>' + L.run.secretWas + '<strong>' + secretWas + '</strong></p>' +
      '<p>' + L.run.roundsDone + '<strong>' + roundsSurvived + '</strong></p>' +
      '<p>' + L.run.finalScore + '<strong>' + finalScore + '</strong></p>';
    const auth = runAuth();
    if (auth && sb) {
      try {
        const { data, error } = await sb.rpc('submit_run_score', {
          p_username: auth.username, p_pin: auth.pin, p_score: finalScore, p_rounds: roundsSurvived
        });
        if (error) {
          resultHtml += '<p class="rr-error">' + L.run.errNoSave + escapeHtml(runAuthErrorText(error.message)) + '</p>';
        } else if (data && data.length) {
          rememberRunBest(data[0].best_score);
          if (data[0].is_best) resultHtml += '<p class="rr-best">' + L.run.newBest + '</p>';
        }
      } catch (e) {
        resultHtml += '<p class="rr-error">' + L.run.errNoSave + L.run.errNoConn + '</p>';
      }
    }
    resultHtml = '<div class="run-result">' + resultHtml +
      '<button class="btn-ghost" id="shareBtn" onclick="shareRunResult(' +
      finalScore + ',' + roundsSurvived + ')">' + L.run.share + '</button>' +
      '</div>';
    mode = null;
    openRunHub(resultHtml);
  }

  // ================= ИНИЦИАЛИЗАЦИЯ =================
  document.getElementById('guessInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleGuess(); });
  [['guessInput', 'guessSign'], ['finalInput', 'finalSign']].forEach(([id, signId]) => {
    document.getElementById(id).addEventListener('input', e => {
      filterNumberInput(e.target);
      renderSignBtn(id, signId);
    });
  });
  document.getElementById('finalInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitFinal(); });
  document.getElementById('runPin').addEventListener('keydown', e => { if (e.key === 'Enter') runAuthSubmit(); });

  // Офлайн: страница открывается и играется без сети после первого захода
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // Общий ключ рекорда остался от прежней версии, и чей он — уже не узнать.
  // Приписать его текущему аккаунту нельзя: именно так и появлялся чужой рекорд.
  // Убираем; свой вернётся с сервера после первой же доигранной партии
  try { localStorage.removeItem('hc_run_best'); } catch (e) {}

  // Подписи на прямой расставляются по ширине экрана, поэтому поворот телефона
  // или смена размера окна требуют пересчёта
  window.addEventListener('resize', () => { if (screen === 'game') renderNumberLine(); });

  initScaleBox();
  document.getElementById('langSwitcher').value = currentLang;
  document.getElementById('winsNeeded').value = '3';
  applyTranslations();
  showScreen('mode');

  checkRemoteConfig();
  setInterval(checkRemoteConfig, 60000);
</script>
</body>
</html>
