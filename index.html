<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10142c" />

  <title id="docTitle">Hot or Cold</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-180.png" />

  <meta name="apple-mobile-web-app-title" content="Hot or Cold" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p0: #6366f1;
      --p1: #fbbf24;
      /* Градусник и точка на прямой показывают один и тот же ход, поэтому едут
         одинаково долго. Отсюда же длительность берёт и анимация в SVG,
         см. moveDur() — чтобы значение было ровно одно на всю игру */
      --move-dur: 0.9s;
    }

    html {
      height: 100%;
    }

    /* Фон живёт на html и прибит к экрану: на body его высота считалась от экрана,
       а не от всей страницы, и ниже первого экрана вместо градиента шла плоская
       тёмная заливка — при длинной истории попыток был виден шов */
    html {
      min-height: 100%;
      background-color: #0b1220;
      background-image: linear-gradient(160deg, #10142c 0%, #1a2142 45%, #0b1220 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
    }

    body {
      min-height: 100%;
      background: none;
      overscroll-behavior: none;
      display: flex;
      justify-content: center;
      align-items: center;
      align-items: safe center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: calc(12px + env(safe-area-inset-top))
               calc(12px + env(safe-area-inset-right))
               calc(12px + env(safe-area-inset-bottom))
               calc(12px + env(safe-area-inset-left));
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 24px 20px;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
      transition: max-width 0.2s;
    }
    .card.wide { max-width: 1100px; }

    /* В потоке, а не абсолютом: в игре шапка сжимается, строка статуса поднимается
       вверх и раньше уезжала прямо под переключатель языка */
    .top-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }
    .account-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 130px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .own-best { color: rgba(255, 255, 255, 0.45); font-weight: 600; }
    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 13px;
      line-height: 1.2;
      cursor: pointer;
      font-family: inherit;
    }
    .account-chip .chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 24, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-card {
      width: 100%;
      max-width: 320px;
      background: #1b1e3d;
      /* окно живёт за пределами .card, свой цвет текста ему нужен явно —
         иначе достаётся чёрный по умолчанию от body */
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px 18px 18px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .modal-card .modal-text {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .lang-switcher {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      font-weight: 500;
      z-index: 5;
    }
    .lang-switcher:focus { border-color: rgba(255,255,255,0.4); }

    /* Название живёт в той же строке, что имя, звук и язык: отдельной шапкой
       оно занимало ещё один-два этажа, а сверху экрана и так мало места.
       margin-right: auto прижимает его влево, кнопки остаются справа */
    .header {
      display: flex; align-items: center; gap: 8px;
      margin-right: auto; min-width: 0;
    }
    .header .emoji { font-size: clamp(22px, 6vw, 28px); line-height: 1; transition: font-size 0.15s; }
    .header h1 {
      font-size: clamp(17px, 4.5vw, 22px); font-weight: 700;
      letter-spacing: -0.5px; white-space: nowrap; transition: font-size 0.15s;
    }
    .header.compact .emoji { font-size: 20px; }
    .header.compact h1 { font-size: 15px; opacity: 0.7; }

    /* На телефоне в строке тесно: длинное имя выдавливало бы название на второй
       этаж, поэтому имя обрезаем раньше. Целиком оно видно по нажатию на чип */
    @media (max-width: 460px) {
      .account-chip .chip-name { display: none; }
      .account-chip { padding: 4px 7px; }
    }

    .row { display: flex; gap: 8px; width: 100%; }

    /* Цифровая клавиатура телефона минуса не показывает — своя кнопка.
       Она же и понятнее ребёнку, чем поиск знака среди символов */
    .sign-btn {
      flex: 0 0 auto;
      /* 44 пикселя — нижняя граница удобного нажатия пальцем, а на узком
         телефоне каждый лишний отнимается у самого поля ввода */
      min-width: 44px;
      padding: 0 6px;
      /* Высоту не задаём отступами, а растягиваем по строке: иначе кнопка
         оказывается выше поля ввода и вся страница подрастает */
      align-self: stretch;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-family: inherit;
      font-size: 21px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .sign-btn.on {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(99, 102, 241, 0.75);
    }

    input[type=number], input[type=text], select.field {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
      outline: none;
      -moz-appearance: textfield;
      caret-color: #fff;
      font-family: inherit;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    select.field option { background: #1e1b4b; color: #fff; }

    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-block { width: 100%; }

    .btn-yellow {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #fbbf24;
      color: #1c1917;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-yellow:hover { background: #f59e0b; }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.16); }

    .btn-reset {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-family: inherit;
    }

    /* ---------- Стартовый экран ---------- */
    .mode-list { display: flex; flex-direction: column; gap: 12px; }
    .mode-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }
    .mode-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.3); }
    .mode-btn .m-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .mode-btn .m-sub { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
    .mode-btn.duel { border-left: 3px solid var(--p1); }
    .mode-btn.solo { border-left: 3px solid var(--p0); }
    .mode-btn.run { border-left: 3px solid #4ade80; }
    .mode-btn.online { border-left: 3px solid #38bdf8; }

    /* ---------- Онлайн: друзья ---------- */
    .friend-list { margin-bottom: 4px; }
    .friend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }
    .friend-row:last-child { border-bottom: none; }
    /* Имя забирает всё свободное место и обрезается само: кнопки справа должны
       стоять на одном месте, каким бы длинным ни было имя */
    .friend-row .fr-name {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .friend-row .fr-wait { font-size: 12px; color: rgba(255, 255, 255, 0.4); }
    .fr-btn {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .fr-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
    .fr-btn:disabled { opacity: 0.45; cursor: default; }
    .fr-btn.yes { background: rgba(74, 222, 128, 0.18); border-color: rgba(74, 222, 128, 0.5); color: #4ade80; }
    .fr-btn.no { background: rgba(248, 113, 113, 0.14); border-color: rgba(248, 113, 113, 0.4); color: #f87171; }
    .fr-block { margin-top: 22px; }
    .fr-note {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      padding: 8px 2px;
    }
    .fr-note.bad { color: #f87171; }

    /* ---------- Настройка дуэли ---------- */
    .setup-field { margin-bottom: 20px; }
    /* Поле, под которым стоит своя галочка: она должна держаться за него,
       а не висеть ровно посередине между двумя полями */
    .setup-field.tight { margin-bottom: 8px; }
    .setup-field label {
      display: block;
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .setup-row { display: flex; gap: 8px; margin-top: 4px; }

    /* ---------- Игровое поле ---------- */
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "p0 p1" "center center";
      gap: 12px;
      align-items: start;
    }
    .board.solo { grid-template-columns: 1fr; grid-template-areas: "center"; }
    .board .pc0 { grid-area: p0; }
    .board .pc1 { grid-area: p1; }
    .board .center { grid-area: center; min-width: 0; }

    @media (min-width: 860px) {
      .board.duel {
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-areas: "p0 center p1";
        gap: 20px;
        align-items: start;
      }
      .thermo-wrap { margin: 10px 0 22px; }
      .thermo-tube {
        width: 24px;
        height: 140px;
        border-radius: 12px 12px 0 0;
      }
      .thermo-tube::before { left: 4px; width: 4px; top: 6px; bottom: 6px; }
      .thermo-bulb { width: 54px; height: 54px; margin-top: -6px; }
      .thermo-bulb::after { top: 11px; left: 14px; width: 13px; height: 8px; }
    }

    .pcard {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .pcard.active {
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    .pcard .p-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
      color: #fff;
      word-break: break-word;
    }
    .pcard .p-name .p-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 7px currentColor;
    }
    .pcard .p-pips { font-size: 13px; letter-spacing: 2px; margin-bottom: 10px; opacity: 0.65; transition: opacity 0.2s; }
    .pcard.active .p-pips { opacity: 1; }
    .pcard .p-wins-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .token-btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .token-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
    .token-btn:disabled { opacity: 0.28; cursor: default; }
    .token-btn.armed { background: rgba(74, 222, 128, 0.2); border-color: #4ade80; color: #86efac; }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .info-bar .confirmed { font-size: 13px; color: rgba(255, 255, 255, 0.6); }
    .info-bar .attempts { font-size: 13px; font-weight: 600; color: #a5f3fc; }
    .info-bar .attempts.low { color: #f87171; }

    .bar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }

    /* Градусник и прямую можно убрать: на маленьком экране лишние 150 пикселей
       иногда дороже красоты. Включённое состояние подсвечено, выключенное бледное */
    .mini-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 13px;
      line-height: 1.3;
      cursor: pointer;
      font-family: inherit;
      opacity: 0.4;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s;
    }
    .mini-toggle.on {
      opacity: 1;
      background: rgba(99, 102, 241, 0.22);
      border-color: rgba(99, 102, 241, 0.6);
    }

    .turn-banner {
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid transparent;
    }

    .confirmed strong { color: #fde68a; font-weight: 700; }

    .thermo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 6px 0 18px;
    }
    .thermo-tube {
      position: relative;
      width: 18px;
      height: 104px;
      border-radius: 9px 9px 0 0;
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.32);
      border-bottom: none;
      overflow: hidden;
      z-index: 1;
    }
    .thermo-tube::before {
      /* стеклянный блик слева по всей трубке */
      content: "";
      position: absolute;
      top: 4px; bottom: 4px; left: 3px;
      width: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,0.28);
      z-index: 3;
      pointer-events: none;
    }
    .thermo-fill {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      height: 8%;
      background: #93C5FD;
      transition: height var(--move-dur) cubic-bezier(.4,0,.2,1),
                  background-color var(--move-dur) ease;
      z-index: 1;
    }
    .thermo-fill::after {
      /* мениск — светлая полоска на поверхности ртути */
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.45);
    }
    .thermo-bulb {
      position: relative;
      width: 40px;
      height: 40px;
      margin-top: -5px;
      border-radius: 50%;
      background: #93C5FD;
      border: 2px solid rgba(255,255,255,0.32);
      box-shadow: 0 0 18px 2px rgba(147,197,253,0.35);
      transition: background-color var(--move-dur) ease, box-shadow var(--move-dur) ease;
      z-index: 2;
    }
    .thermo-bulb::after {
      /* блик-отражение на стекле колбы */
      content: "";
      position: absolute;
      top: 8px; left: 10px;
      width: 9px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      transform: rotate(-25deg);
    }
    .thermo-bulb.pulse { animation: thermoPulse 0.8s ease 2; }
    @keyframes thermoPulse {
      0%, 100% { box-shadow: 0 0 18px 2px rgba(255,255,255,0.4); }
      50% { box-shadow: 0 0 0 14px rgba(255,255,255,0); }
    }

    /* Подсказка и пояс расстояний разведены по краям: «Тепло · 51–100» одной
       строкой посередине читалось как одно слово с непонятным хвостом */
    .feedback-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: center;
      animation: pop 0.3s ease;
    }
    .feedback-panel.with-band { justify-content: space-between; }
    .feedback-panel .fb-label { font-size: clamp(20px, 6vw, 26px); font-weight: 600; }
    .feedback-panel .fb-band {
      font-size: clamp(15px, 4.4vw, 20px);
      font-weight: 700;
      opacity: 0.75;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feedback-panel { animation: none; }
      .pcard.active { transform: none; }
      .thermo-fill, .thermo-bulb { transition: none; }
      .thermo-bulb.pulse { animation: none; }
      /* Движение точки по прямой выключается в самом SVG — см. nlCalm() */
    }

    /* Компактная раскладка одиночной игры на телефоне — чтобы всё помещалось
       на экран без прокрутки. На широких экранах (≥860px) не действует. */
    @media (max-width: 859px) {
      .card.solo-game .info-bar { margin-bottom: 10px; }

      .card.solo-game .thermo-wrap { margin: 0 0 2px; }

      .card.solo-game .numline { margin-bottom: 4px; }

      /* Рамку вокруг подсказки на телефоне оставляем — она же и есть главный
         сигнал «горячо/холодно». Экономим высоту за счёт отступов, а не фона */
      .card.solo-game .feedback-panel {
        padding: 7px 12px;
        margin-bottom: 4px;
        border-radius: 12px;
        animation: none;
      }
      .card.solo-game .feedback-panel .fb-label { font-size: 16px; }
      .card.solo-game .feedback-panel .fb-band { font-size: 14px; }

      .card.solo-game .guess-section { margin-bottom: 10px; }
      .card.solo-game .guess-section p { margin-bottom: 5px; }

      /* Ходов теперь всегда четыре, и окно под них не растёт — но строки
         поплотнее, чтобы в те же пиксели их помещалось больше */
      .card.solo-game .history-list { max-height: 96px; gap: 4px; }
      .card.solo-game .history-item { padding: 6px 12px; }
      .card.solo-game .history-item .h-guess { font-size: 15px; }
    }

    /* Числовая прямая: где стоит догадка и в каких двух участках может быть ответ.
       Проценты внутри SVG считаются от его ширины, поэтому пересчитывать
       координаты при смене размера экрана не нужно */
    .numline {
      margin: 0 0 8px;
      padding: 0 4px;
    }
    .numline svg { display: block; overflow: visible; }

    /* После партии под прямой сразу начинается история: без этого отступа
       подписи делений слипаются с её заголовком. Во время игры между ними
       стоит поле ввода, и лишнее место там ни к чему */
    .board.over .numline { margin-bottom: 16px; }

    /* Прямая заняла место, которого на невысоком экране нет. Забираем его у
       градусника: «где именно» теперь показывает прямая, а ему остаётся
       «насколько горячо». Условие по высоте, а не по ширине — широкий, но
       низкий ноутбук стеснён так же, как телефон */
    @media (max-height: 900px) {
      .card.solo-game .thermo-wrap { margin-top: 0; }
      .card.solo-game .thermo-tube { height: 62px; }
      .card.solo-game .thermo-bulb { width: 36px; height: 36px; }
      .card.solo-game .thermo-bulb::after { top: 8px; left: 10px; width: 9px; height: 6px; }
    }

    /* Широкому, но низкому экрану телефонные правила не достаются, а место
       ему нужно так же — подрезаем отступ под градусником отдельно */
    @media (max-height: 900px) and (min-width: 860px) {
      .card.solo-game .thermo-wrap { margin-bottom: 8px; }
    }

    /* Строка бонуса: либо «рядом», либо что именно сработало. Появляется
       только когда есть что сказать — в остальное время её просто нет */
    .bonus-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 8px;
      padding: 7px 12px;
      border-radius: 12px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.45);
      font-size: 14px;
      color: #fbbf24;
    }
    .match-note {
      margin: 0 0 8px;
      padding: 7px 12px;
      border-radius: 12px;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.45);
      font-size: 13px;
      color: #f87171;
    }
    .bonus-line .b-name { font-weight: 700; }
    .bonus-line .b-desc { font-size: 13px; color: rgba(255, 255, 255, 0.6); }
    /* Пустая строка помех не должна занимать место: без бонусов её просто нет */
    .p-effects { margin-top: 6px; font-size: 15px; letter-spacing: 3px; }
    .p-effects:empty { display: none; }
    .history-item .h-masked { opacity: 0.45; }

    /* Панель отнятого хода живёт на месте поля ввода и выглядит так же
       заметно: этот ход — событие, а не пауза */
    .forced-turn {
      background: rgba(251, 146, 60, 0.12);
      border: 1px solid rgba(251, 146, 60, 0.5);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
    }
    .forced-turn p {
      margin: 0 0 12px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.4;
    }

    .final-box {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid #fbbf24;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .final-box p {
      text-align: center;
      font-size: 14px;
      color: #fde68a;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .result-box {
      border-radius: 14px;
      padding: 18px 14px;
      margin-bottom: 16px;
      text-align: center;
      line-height: 1.4;
    }
    .result-win { background: rgba(22, 163, 74, 0.16); border: 1px solid #16a34a; color: #86efac; }
    .result-lose { background: rgba(239, 68, 68, 0.16); border: 1px solid #ef4444; color: #fca5a5; }
    .result-round { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
    .result-box .r-icon { font-size: 32px; line-height: 1; margin-bottom: 6px; }
    .result-box .r-title { font-size: 18px; font-weight: 800; }
    .result-box .r-score {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 14px; flex-wrap: wrap;
    }
    .result-box .r-chip {
      padding: 6px 14px; border-radius: 999px; border: 1.5px solid;
      font-weight: 700; font-size: 13px; background: rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    .result-box .r-vs { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 700; }
    .result-box .r-secret { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.45); }
    .result-box .r-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }

    .guess-section { margin-bottom: 16px; }
    .guess-section p { margin-bottom: 8px; font-size: 14px; color: rgba(255, 255, 255, 0.65); font-weight: 500; }

    .history-section { margin-bottom: 16px; }
    .history-title {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .history-list.tall { max-height: 340px; }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      gap: 10px;
    }
    .history-item .h-num { color: rgba(255, 255, 255, 0.4); font-size: 12px; flex-shrink: 0; }
    .history-item .h-who { font-size: 12px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .h-guess { font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .history-item .h-label { font-size: 13px; font-weight: 600; text-align: right; word-break: break-word; }

    .legend { margin-top: 14px; }
    #scaleBox { margin-bottom: 8px; }
    .legend-body { margin-top: 10px; }

    .legend-bar { display: none; }

    .legend-grid {
      display: grid;
      /* Верхнюю границу подняли: при крупном шрифте «Очень холодно 501–1000»
         в 210 пикселей уже не помещалось и переносилось на вторую строку */
      grid-template-columns: repeat(auto-fit, minmax(150px, 260px));
      justify-content: center;
      /* Строки стоят плотнее: шрифт вырос, и без этого шкала перестала помещаться */
      gap: 3px 18px;
    }
    .legend-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
    .legend-item .l-label { font-weight: 600; }
    .legend-item .l-range { color: rgba(255, 255, 255, 0.5); font-variant-numeric: tabular-nums; }

    @media (min-width: 860px) {
      .legend-bar {
        display: flex;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 12px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }
      .legend-bar span { flex: 1; }

      /* Восемь колонок в ряд раскладывались по ширине окна, а живут они внутри
         карточки вдвое уже: на планшете подписи налезали друг на друга и
         обрезались. Список остаётся списком, просто в две колонки */
      .legend-grid { grid-template-columns: repeat(2, 1fr); column-gap: 20px; }
      .legend-item { font-size: 13px; }
    }

    .instruction-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .instruction-box summary {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      outline: none;
    }
    .instruction-box p {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.4;
      white-space: pre-line;
    }

    .hidden { display: none !important; }

    :focus-visible { outline: 2px solid #a5f3fc; outline-offset: 2px; }

    #updateBanner {
      cursor: pointer;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }
    .lb-wrap { margin-top: 14px; }
    .lb-list { margin-top: 8px; }
    .lb-title {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
    }
    .lb-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ---------- Хаб режима на рейтинг ---------- */
    .run-result {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 16px 14px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.7;
    }
    .run-result .rr-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .run-result p { margin: 0; font-size: 14px; }
    .run-result .rr-best { margin-top: 10px; font-size: 15px; font-weight: 700; color: #fbbf24; }
    .run-result .rr-error { margin-top: 10px; font-size: 13px; color: #f87171; }
    .run-result #shareBtn { margin-top: 14px; }

    /* На телефоне в верхней строке имени места нет — там и так тесно. А знать,
       под кем ты играешь, нужно именно здесь: с этого экрана игра и начинается */
    .run-greeting {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
      margin: 0 0 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .run-greeting strong { color: rgba(255, 255, 255, 0.85); }
    #screenRunHub .lb-wrap { margin-top: 28px; }
    #screenRunHub .lb-list { margin-top: 10px; }
    #screenRunHub .lb-row { padding: 9px 4px; font-size: 14px; }
    #screenRunHub .lb-row:last-child { border-bottom: none; }
    .run-hub-actions {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .run-hub-actions .btn-ghost { flex: 1; }
    /* Переключатель «мороз и жара». Вся строка — часть label, чтобы по подписи
       можно было попасть пальцем, а не только по самой галочке */
    .frost-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      padding: 2px 0;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      user-select: none;
    }
    /* Системный чекбокс на тёмном фоне — белый квадрат, самое яркое пятно на
       экране. Рисуем свой: погашенный в покое, синий с галочкой во включённом */
    .frost-row input {
      appearance: none;
      -webkit-appearance: none;
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      margin: 0;
      position: relative;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .frost-row input:checked { background: #6366f1; border-color: #6366f1; }
    .frost-row input:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .lb-empty {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      padding: 10px 2px;
    }
    .lb-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lb-head .lb-title { margin-bottom: 0; }
    .lb-tabs { display: flex; gap: 4px; }
    .lb-tab {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .lb-tab.active {
      background: rgba(74, 222, 128, 0.15);
      border-color: #4ade80;
      color: #4ade80;
    }
  </style>
</head>
<body>
<div class="card" id="card">
  <div id="updateBanner" class="hidden"></div>
  <div class="top-controls">
    <div class="header">
      <div class="emoji">🌡️</div>
      <h1 id="tTitle">Hot or Cold</h1>
    </div>
    <button class="account-chip hidden" id="accountChip" onclick="openLogoutModal()">
      <span>👤</span><span class="chip-name" id="accountChipName"></span>
    </button>
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()" aria-label="Звук"></button>
    <select class="lang-switcher" id="langSwitcher" onchange="changeLanguage()">
      <option value="en">🇺🇸 EN</option>
      <option value="ru">🇷🇺 RU</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="de">🇩🇪 DE</option>
    </select>
  </div>

  <!-- ЭКРАН 1: выбор режима -->
  <div id="screenMode">
    <div class="mode-list">
      <button class="mode-btn solo" onclick="openSetup('solo')">
        <div class="m-title" id="tModeSolo">Single player</div>
      </button>
      <button class="mode-btn duel" onclick="openSetup('duel')">
        <div class="m-title" id="tModeDuel">Play with a friend</div>
      </button>
      <button class="mode-btn run" onclick="openRunEntry()">
        <div class="m-title" id="tModeRun"></div>
      </button>
      <button class="mode-btn online" onclick="openOnlineEntry()">
        <div class="m-title" id="tModeOnline"></div>
        <div class="m-sub" id="tModeOnlineSub"></div>
      </button>
    </div>
  </div>

  <!-- ЭКРАН 2: настройка -->
  <div id="screenSetup" class="hidden">
    <div class="setup-field tight">
      <label id="tLblRange">Range</label>
      <select class="field" id="rangeMax" onchange="onRangeChange()"></select>
    </div>

    <label class="frost-row">
      <input type="checkbox" id="frostSetup" onchange="setFrostMode(this.checked)" />
      <span id="tFrostSetup"></span>
    </label>

    <div class="setup-field" id="attemptsField">
      <label id="tLblAttempts">Attempts</label>
      <select class="field" id="attemptsCount"></select>
    </div>

    <div id="duelOnlyFields">
      <label class="frost-row">
        <input type="checkbox" id="bonusSetup" onchange="setBonusMode(this.checked)" />
        <span id="tBonusSetup"></span>
      </label>

      <div class="setup-field hidden" id="bonusCountField">
        <label id="tLblBonusCount">Bonuses</label>
        <select class="field" id="bonusCount" onchange="setBonusCount(this.value)"></select>
      </div>

      <div class="setup-field">
        <label id="tLblP1">Player 1</label>
        <input type="text" id="nameP1" maxlength="14" />
      </div>
      <div class="setup-field">
        <label id="tLblP2">Player 2</label>
        <input type="text" id="nameP2" maxlength="14" />
      </div>
      <div class="setup-field">
        <label id="tLblWins">Play until how many wins</label>
        <select class="field" id="winsNeeded">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </div>
      <div class="setup-field">
        <label id="tLblHandicap">Handicap</label>
        <select class="field" id="handicap"></select>
      </div>
    </div>

    <div class="setup-row">
      <button class="btn-ghost" onclick="showScreen('mode')" id="tBack">Back</button>
      <button class="btn btn-block" onclick="startFromSetup()" id="tStartMatch">Start match</button>
    </div>
  </div>

  <!-- ЭКРАН 3: игра -->
  <div id="screenGame" class="hidden">
    <div class="board" id="board">

      <div class="pcard pc0" id="pcard0">
        <div class="p-name" id="pname0"></div>
        <div class="p-wins-label" id="tWinsLabel0">Wins</div>
        <div class="p-pips" id="ppips0"></div>
        <button class="token-btn" id="ptoken0" onclick="useToken(0)"></button>
        <div class="p-effects" id="peff0"></div>
      </div>

      <div class="pcard pc1" id="pcard1">
        <div class="p-name" id="pname1"></div>
        <div class="p-wins-label" id="tWinsLabel1">Wins</div>
        <div class="p-pips" id="ppips1"></div>
        <button class="token-btn" id="ptoken1" onclick="useToken(1)"></button>
        <div class="p-effects" id="peff1"></div>
      </div>

      <div class="center">

        <div class="info-bar" id="infoBar">
          <span class="confirmed" id="tConfirmed">Number generated ✓</span>
          <span class="attempts" id="attemptsLabel"></span>
          <span class="bar-actions">
            <button class="mini-toggle" id="toggleThermoBtn" onclick="toggleThermo()">🌡️</button>
            <button class="mini-toggle" id="toggleLineBtn" onclick="toggleLine()">📏</button>
            <button class="mini-toggle" id="toggleHintBtn" onclick="toggleHint()">💡</button>
            <button class="btn-reset" onclick="leaveGame()" id="tMenu">Menu</button>
          </span>
        </div>

        <div class="turn-banner hidden" id="turnBanner"></div>

        <!-- Что сказал сервер: отказ в ходе, обрыв связи. Отрисовка доски это
             место не трогает, иначе сообщение пропадало бы на первом же кадре -->
        <div class="match-note hidden" id="matchNote"></div>

        <!-- Итог раунда стоит выше градусника и прямой: когда партия кончилась,
             первое, что нужно увидеть, — чем она кончилась, а не чем мерили -->
        <div class="result-box hidden" id="resultBox"></div>

        <div class="thermo-wrap hidden" id="thermoWrap">
          <div class="thermo-tube"><div class="thermo-fill" id="thermoFill"></div></div>
          <div class="thermo-bulb" id="thermoBulb"></div>
        </div>

        <div class="feedback-panel hidden" id="feedbackPanel">
          <div class="fb-label" id="feedbackLabel"></div>
          <div class="fb-band hidden" id="feedbackBand"></div>
        </div>

        <div class="bonus-line hidden" id="bonusLine"></div>

        <div class="numline hidden" id="numLine"><svg id="numLineSvg" width="100%" height="48"></svg></div>

        <div class="final-box hidden" id="finalBox">
          <p id="tFinalWarning">Attempts used — last chance!</p>
          <div class="row">
            <button class="sign-btn hidden" id="finalSign" onclick="flipSign('finalInput')" aria-label="−">−</button>
            <input type="text" id="finalInput" placeholder="" inputmode="numeric" autocomplete="off" />
            <button class="btn-yellow" onclick="submitFinal()" id="tFinalSubmit">Submit</button>
          </div>
        </div>

        <!-- Ход, отнятый бонусом: вместо поля ввода — кнопка. Нажимает её тот,
             у кого ход отняли, поэтому видно, что произошло и с кем -->
        <div class="forced-turn hidden" id="forcedTurn">
          <p id="forcedText"></p>
          <button class="btn-yellow btn-block" id="forcedBtn" onclick="doForcedTurn()"></button>
        </div>

        <div class="guess-section" id="guessSection">
          <p id="tEnterGuess">Enter a number</p>
          <div class="row">

  // Восемь цветов шкалы — фиксированы, не зависят от диапазона (это исходная,
  // одобренная палитра). Меняются только числовые границы каждого пояса.
  const TIER_COLORS = [
    { color: "#93C5FD", bg: "rgba(147, 197, 253, 0.15)" }, // очень холодно
    { color: "#38BDF8", bg: "rgba(56, 189, 248, 0.15)" },  // холодно
    { color: "#2DD4BF", bg: "rgba(45, 212, 191, 0.15)" },  // прохладно
    { color: "#FBBF24", bg: "rgba(251, 191, 36, 0.15)" },  // тепло
    { color: "#FB923C", bg: "rgba(251, 146, 60, 0.15)" },  // жарко
    { color: "#F87171", bg: "rgba(248, 113, 113, 0.15)" }, // очень горячо
    { color: "#FF5733", bg: "rgba(255, 87, 51, 0.18)" },   // очень-очень горячо
    { color: "#FF4500", bg: "rgba(255, 69, 0, 0.2)" },     // лава
  ];
  const BULLSEYE_TIER = { color: "#4ADE80", bg: "rgba(74, 222, 128, 0.15)" };

  // Верхние границы 8 поясов (от самого холодного к самому горячему) для
  // каждого диапазона. 1000 — эталон, остальные — та же логарифмическая форма,
  // пересчитанная под свой диапазон (см. ответ в чате).
  const RANGE_TIER_UPPER = {
    10:      [9, 7, 6, 5, 4, 3, 2, 1],
    100:     [100, 60, 30, 15, 8, 4, 2, 1],
    1000:    [1000, 500, 200, 100, 50, 20, 10, 3],
  };
  const RANGE_PRESETS = [10, 100, 1000];

  // Горячий конец шкалы не растёт вместе с диапазоном: жарко/горячо/очень горячо/лава
  // всегда означают одни и те же расстояния. Именно по горячим поясам игрок и вычисляет
  // число в конце — если бы они росли пропорционально, «лава» на диапазоне в 10 000
  // значила бы «где-то в пределах 40», и добить раунд стало бы невозможно.
  // Значения взяты из ручной таблицы для 1000 — то есть шкала ведёт себя так же, как там.
  const HOT_TIER_UPPER = [50, 20, 10, 3];

  // Границы поясов округляем: «51–100» читается и запоминается легче, чем «51–106»,
  // а ученику ещё и считать по ним. Шаг растёт вместе с величиной, чтобы округление
  // не перекосило сам пояс: у сотни это десятки, у тысячи — полсотни
  function tierStep(v) {
    return v < 12 ? 1 : v < 30 ? 5 : v < 100 ? 10 : v < 300 ? 25 : v < 1000 ? 50 : v < 3000 ? 100 : 500;
  }

  // Верхнюю границу самого холодного пояса округляем вверх: она должна накрывать
  // и наибольшее возможное расстояние, иначе подпись начнёт врать
  function roundTier(v, up) {
    const step = tierStep(v);
    return Math.max(1, (up ? Math.ceil(v / step) : Math.round(v / step)) * step);
  }

  // Для произвольного диапазона (режим на рейтинг) готовой таблицы поясов нет — считаем её.
  function generateTierUpper(rangeMax) {
    const maxDistance = Math.max(1, rangeMax - 1);

    // Тесный диапазон: горячие пояса в него просто не помещаются, раскладываем
    // логарифмически по всей ширине. Для 10 это даёт ровно ручную таблицу.
    if (maxDistance <= HOT_TIER_UPPER[0]) {
      const U = [];
      for (let i = 0; i < 8; i++) {
        U.push(Math.max(roundTier(maxDistance * Math.pow(0.45, i), i === 0), 8 - i));
      }
      for (let i = 1; i < 8; i++) {
        if (U[i] >= U[i - 1]) U[i] = Math.max(1, U[i - 1] - 1);
      }
      return U;
    }

    // Широкий диапазон: холодные четыре пояса растягиваются от края диапазона
    // до начала горячей зоны, горячие четыре — фиксированы.
    const ratio = Math.pow(HOT_TIER_UPPER[0] / maxDistance, 1 / 4);
    const U = [];
    for (let i = 0; i < 4; i++) U.push(roundTier(maxDistance * Math.pow(ratio, i), i === 0));
    HOT_TIER_UPPER.forEach(v => U.push(v));
    for (let i = 1; i < 8; i++) {
      if (U[i] >= U[i - 1]) U[i] = Math.max(1, U[i - 1] - 1);
    }
    return U;
  }

  function buildFeedbackMeta(rangeMax) {
    const U = RANGE_TIER_UPPER[rangeMax] || generateTierUpper(rangeMax);
    const meta = [];
    for (let i = 0; i < 8; i++) {
      const max = U[i];
      const min = (i === 7) ? 1 : U[i + 1] + 1;
      meta.push({
        min, max, labelIndex: i,
        color: TIER_COLORS[i].color, bg: TIER_COLORS[i].bg,
        rangeSign: (min === max) ? String(min) : (min + '–' + max)
      });
    }
    meta.push({ min: 0, max: 0, labelIndex: 8, rangeSign: "0",
                color: BULLSEYE_TIER.color, bg: BULLSEYE_TIER.bg });
    return meta;
  }

  function minAttempts(rangeMax) {
    return Math.max(1, Math.ceil(Math.log2(rangeMax)));
  }

  // Русский требует трёх форм («1 очко», «2 очка», «5 очков»), остальным хватает двух.
  // Форму выбираем по числу, иначе на экране появляется «133 очков»
  function plural(n, forms) {
    // Во французском единственное число берут и ноль, и единица, в остальных — только единица
    const one = (currentLang === 'fr') ? Math.abs(n) < 2 : Math.abs(n) === 1;
    if (currentLang !== 'ru') return forms[one ? 0 : 1];
    const rest100 = Math.abs(n) % 100, rest10 = rest100 % 10;
    if (rest100 > 10 && rest100 < 20) return forms[2];
    if (rest10 === 1) return forms[0];
    if (rest10 > 1 && rest10 < 5) return forms[1];
    return forms[2];
  }

  function withPlural(n, forms) { return formatNum(n) + ' ' + plural(n, forms); }

  function formatNum(n) {
    try { return n.toLocaleString(currentLang === 'en' ? 'en-US' : currentLang); }
    catch (e) { return String(n); }
  }

  let RANGE_MAX = 1000;
  // Нижняя граница. В обычной игре это 1, в «морозе и жаре» — зеркало верхней.
  // Дальше всё считается от пары границ, поэтому минус не плодит отдельных веток
  let RANGE_MIN = 1;
  let MAX_GUESSES = 10;
  let FEEDBACK_META = buildFeedbackMeta(RANGE_MAX);

  // «Мороз и жара»: число берётся из −N…+N. Половину берём от выбранного
  // диапазона, чтобы чисел осталось столько же и игра не стала длиннее
  let frostMode = localStorage.getItem('hc_frost') === '1';

  // Градусник и числовая прямая показываются по умолчанию; кому тесно на экране —
  // может убрать любую из них, и выбор запомнится
  // Пояс расстояний рядом с подсказкой. Включён по умолчанию и снимается кнопкой
  // прямо во время игры — как градусник и прямая. Тайны в нём нет: те же числа
  // написаны в шкале расстояний внизу экрана, она открыта во всех режимах
  let distanceHint = localStorage.getItem('hc_hint') !== '0';

  let showThermo = localStorage.getItem('hc_show_thermo') !== '0';
  let showLine = localStorage.getItem('hc_show_line') !== '0';

  function renderVizToggles() {
    const L = t();
    [['toggleThermoBtn', showThermo, L.vizThermo], ['toggleLineBtn', showLine, L.vizLine],
     ['toggleHintBtn', distanceHint, L.hintLabel]]
      .forEach(([id, on, title]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.toggle('on', on);
        el.title = title;
        el.setAttribute('aria-label', title);
        el.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
  }

  function toggleThermo() {
    showThermo = !showThermo;
    try { localStorage.setItem('hc_show_thermo', showThermo ? '1' : '0'); } catch (e) {}
    renderAll();
  }

  function toggleLine() {
    showLine = !showLine;
    try { localStorage.setItem('hc_show_line', showLine ? '1' : '0'); } catch (e) {}
    renderAll();
  }

  function toggleHint() {
    distanceHint = !distanceHint;
    try { localStorage.setItem('hc_hint', distanceHint ? '1' : '0'); } catch (e) {}
    renderAll();
  }

  function rangeCount() { return RANGE_MAX - RANGE_MIN + 1; }

  // Сколько последних ходов видно тому, кто сейчас смотрит на экран. Ловушка
  // «короткая память» режет это вдвое — и в списке, и на прямой, иначе прямая
  // показывала бы то, что из истории убрали
  function historyVisible() {
    return (mode === 'duel' && !D.roundOver && D.shortMemory[D.cur])
      ? HISTORY_SHORT : HISTORY_VISIBLE;
  }
  function maxDistance() { return RANGE_MAX - RANGE_MIN; }

  // Сколько чисел получится из выбранного размера диапазона
  function countFor(size) { return frostMode ? Math.floor(size / 2) * 2 + 1 : size; }

  function applyBounds(size) {
    if (frostMode) {
      const half = Math.floor(size / 2);
      RANGE_MIN = -half; RANGE_MAX = half;
    } else {
      RANGE_MIN = 1; RANGE_MAX = size;
    }
    // Пояса зависят от расстояния между догадкой и ответом, а не от границ:
    // равносильный обычный диапазон — это «максимальное расстояние плюс один»
    FEEDBACK_META = buildFeedbackMeta(maxDistance() + 1);
  }

  function boundsLabel(size) {
    const half = Math.floor(size / 2);
    // Минус берём обычный, с клавиатуры: ребёнок увидит ровно то, что ему набирать
    return frostMode ? (formatNum(-half) + '…+' + formatNum(half))
                     : ('1–' + formatNum(size));
  }

  function renderFrostToggles() {
    ['frostSetup', 'frostRun'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.checked = frostMode;
    });
  }

  function setFrostMode(on) {
    frostMode = !!on;
    try { localStorage.setItem('hc_frost', frostMode ? '1' : '0'); } catch (e) {}
    buildRangeOptions();
    renderFrostToggles();
  }
  const P_COLORS = ["#6366f1", "#fbbf24"];

  // Сколько последних ходов остаётся на виду — и в истории, и на прямой.
  // Остальное игрок помнит сам: в этом и смысл
  const HISTORY_VISIBLE = 4;
  const HISTORY_SHORT = 2;

  let currentLang = localStorage.getItem('hc_lang') || 'en';

  // ---------- общее состояние ----------
  let mode = null;          // 'solo' | 'duel'
  let screen = 'mode';      // 'mode' | 'setup' | 'game'
  let secret = 0;
  let history = [];
  let gameOver = false;
  let gameOverType = null;
  let movesUsed = 0;
  let lastWinIsRecord = false;

  // ---------- состояние дуэли ----------
  const D = {
    names: ["", ""],
    winsNeeded: 3,
    handicap: 0,      // 0 нет, 1/2 — 2 жетона игроку 1/2, 3/4 — игрок 1/2 всегда первый
    wins: [0, 0],
    tokens: [0, 0],
    cur: 0,
    starter: 0,
    round: 1,
    armed: false,
    roundOver: false,
    matchOver: false,
    roundWinner: null,

    // Бонусы раунда и наложенные ими помехи. Всё живёт только внутри раунда
    bonuses: [],              // { value, type, taken }
    fog: [false, false],        // не видит ЧУЖИЕ ходы до конца раунда
    blind: [false, false],      // не видит СВОИ ходы до конца раунда
    autoLava: [false, false],   // следующий ход за него сделает случай
    skip: [false, false],       // пропускает свой следующий ход
    shortMemory: [false, false],// видит вдвое меньше ходов до конца раунда
    nearBonus: false,         // последний ход прошёл рядом с бонусом
    lastBonus: null,          // что сработало, для строки под подсказкой
    lastBonusBy: 0            // кто его взял — чтобы назвать игроков поимённо
  };

  // Бонус срабатывает только при точном попадании, а за несколько клеток до него
  // загорается сигнал. Радиус сигнала зависит от диапазона: фиксированные три
  // клетки накрывали почти весь десяток и не значили ничего на тысяче
  function bonusNearRadius() {
    const n = rangeCount();
    return n <= 20 ? 1 : (n <= 200 ? 3 : 5);
  }

  // Полезные бонусы и ловушки. Ловушка бьёт по тому, кто на неё наступил, —
  // из-за этого сигнал «рядом» перестаёт быть приманкой и становится выбором
  const BONUS_GOOD = ['extra', 'fog', 'blind', 'lava'];
  const BONUS_TRAP = ['skip', 'gift', 'memory'];
  const BONUS_TYPES = BONUS_GOOD.concat(BONUS_TRAP);
  const BONUS_TRAP_SHARE = 1 / 3;

  let bonusMode = localStorage.getItem('hc_bonus') === '1';
  let bonusCountChoice = parseInt(localStorage.getItem('hc_bonus_n')) || 0;  // 0 — «как обычно»

  function setBonusMode(on) {
    bonusMode = !!on;
    try { localStorage.setItem('hc_bonus', bonusMode ? '1' : '0'); } catch (e) {}
    renderBonusSetup();
  }

  function setBonusCount(v) {
    bonusCountChoice = parseInt(v) || 0;
    try { localStorage.setItem('hc_bonus_n', String(bonusCountChoice)); } catch (e) {}
  }

  // Сколько бонусов ставить, если игрок не выбирал сам. Растёт медленнее
  // диапазона: на тысяче их должно быть заметно больше, чем на сотне, но не в
  // сто раз. На тесных диапазонах удваивать нельзя — зона «рядом» накроет
  // половину прямой, и сигнал перестанет что-либо значить
  function autoBonusCountFor(n) {
    const base = Math.max(1, Math.ceil(Math.sqrt(n) / 4));
    const roomy = Math.max(1, Math.floor(n * 0.086));
    return Math.max(base, Math.min(base * 2, 12, roomy));
  }

  // Больше, чем чисел без загаданного, на доску не поместится при всём желании
  function bonusCount() {
    const n = rangeCount();
    return Math.max(1, Math.min(bonusCountChoice || autoBonusCountFor(n), n - 1));
  }

  // Бонусы ложатся куда угодно — на любое число, кроме загаданного и кроме
  // уже занятого другим бонусом. Ловушек примерно треть: они должны попадаться,
  // но не решать, кто выиграл раунд
  function placeBonuses() {
    D.bonuses = [];
    if (!bonusMode) return;
    const count = bonusCount();
    const traps = Math.round(count * BONUS_TRAP_SHARE);
    const good = BONUS_GOOD.slice().sort(() => Math.random() - 0.5);
    const trap = BONUS_TRAP.slice().sort(() => Math.random() - 0.5);
    const pool = [];
    for (let i = 0; i < count - traps; i++) pool.push(good[i % good.length]);
    for (let i = 0; i < traps; i++) pool.push(trap[i % trap.length]);
    pool.sort(() => Math.random() - 0.5);
    const used = new Set([secret]);
    for (let guard = 0; guard < 800 && D.bonuses.length < count; guard++) {
      const v = RANGE_MIN + Math.floor(Math.random() * rangeCount());
      if (used.has(v)) continue;
      used.add(v);
      D.bonuses.push({ value: v, type: pool[D.bonuses.length], taken: false });
    }
  }

  function openSetup(m) {

    document.getElementById('duelOnlyFields').classList.toggle('hidden', m !== 'duel');
    document.getElementById('attemptsField').classList.toggle('hidden', m !== 'solo');

  function buildRangeOptions() {
    const sel = document.getElementById('rangeMax');
    if (!sel) return;
    const prev = sel.value;
    sel.innerHTML = '';
    RANGE_PRESETS.forEach(n => {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = boundsLabel(n);
      sel.appendChild(o);
    });
    sel.value = RANGE_PRESETS.includes(parseInt(prev)) ? prev : '1000';
    buildAttemptsOptions();
    buildBonusCountOptions();
  }

  function onRangeChange() {
    buildAttemptsOptions();
    buildBonusCountOptions();
  }

  // Лесенкой, а не полем ввода: настройку открывают дети и родители, вызывать
  // тут клавиатуру незачем — а тем более давать ввести семьсот бонусов на
  // диапазоне из десяти чисел
  function buildBonusCountOptions() {
    const sel = document.getElementById('bonusCount');
    if (!sel) return;
    const rangeSel = document.getElementById('rangeMax');
    const n = countFor(parseInt(rangeSel && rangeSel.value) || 1000);
    const auto = autoBonusCountFor(n);
    const values = [...new Set([1, 2, 3, 6, 12, 25, 50, 100, auto, n - 1])]
      .filter(v => v >= 1 && v <= n - 1)
      .sort((a, b) => a - b);
    sel.innerHTML = '';
    values.forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = (v === auto) ? t().bonusAuto.replace('{n}', v) : String(v);
      sel.appendChild(o);
    });
    sel.value = String(Math.max(1, Math.min(bonusCountChoice || auto, n - 1)));
  }

  function renderBonusSetup() {
    const f = document.getElementById('bonusCountField');
    if (f) f.classList.toggle('hidden', !bonusMode);

  function buildAttemptsOptions() {
    const rangeSel = document.getElementById('rangeMax');
    const rangeMax = parseInt(rangeSel && rangeSel.value) || 1000;
    const min = minAttempts(countFor(rangeMax));
    const sel = document.getElementById('attemptsCount');
    const prev = sel.value;
    const options = [min, min + 1, min + 2, min + 3, min + 5, min + 8, min + 12];
    sel.innerHTML = '';
    options.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
    sel.value = options.includes(parseInt(prev)) ? prev : String(min);
  }

  function applyRangeToInputs() {
    const signed = RANGE_MIN < 0;
    [['guessInput', 'guessSign'], ['finalInput', 'finalSign']].forEach(([id, signId]) => {
      const el = document.getElementById(id);
      el.setAttribute('aria-valuemin', RANGE_MIN);
      el.setAttribute('aria-valuemax', RANGE_MAX);
      // Кнопка минуса нужна только там, где отрицательные числа вообще бывают
      document.getElementById(signId).classList.toggle('hidden', !signed);
      renderSignBtn(id, signId);
    });

  // В поле пускаем только цифры и один минус в начале: клавиатура на компьютере
  // и автозамена на телефоне иначе занесут туда что угодно
  function filterNumberInput(el) {
    const cleaned = el.value.replace(/[^0-9-]/g, '').replace(/(?!^)-/g, '');
    if (cleaned !== el.value) el.value = cleaned;
  }

  function renderSignBtn(id, signId) {
    const el = document.getElementById(id);
    const btn = document.getElementById(signId);
    if (el && btn) btn.classList.toggle('on', String(el.value).trim().charAt(0) === '-');

  // Переставляет знак у набранного числа. Пустое поле просто запоминает минус,
  // чтобы можно было нажать его до цифр — как на бумаге
  function flipSign(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const v = String(el.value).trim();
    el.value = v.charAt(0) === '-' ? v.slice(1) : '-' + v;
    renderSignBtn(id, id === 'guessInput' ? 'guessSign' : 'finalSign');
    el.focus();
  }

  function startFromSetup() {
    applyBounds(parseInt(document.getElementById('rangeMax').value) || 1000);
    if (mode === 'solo') {
      MAX_GUESSES = parseInt(document.getElementById('attemptsCount').value) || minAttempts(rangeCount());
    }
    applyRangeToInputs();
    if (mode === 'duel') startMatch(); else startSolo();
  }

  // ================= ОДИНОЧНАЯ ИГРА =================
  function startSolo() {
    resetSolo();
    applyTranslations();
    showScreen('game');
