  <meta name="apple-mobile-web-app-title" content="Hot or Cold" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p0: #6366f1;
      --p1: #fbbf24;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      background-color: #0b1220;
      background-image: linear-gradient(160deg, #10142c 0%, #1a2142 45%, #0b1220 100%);
      background-repeat: no-repeat;
      background-size: 100% 100%;
      overscroll-behavior: none;
      display: flex;
      justify-content: center;
      align-items: center;
      align-items: safe center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: calc(12px + env(safe-area-inset-top))
               calc(12px + env(safe-area-inset-right))
               calc(12px + env(safe-area-inset-bottom))
               calc(12px + env(safe-area-inset-left));
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 24px 20px;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
      transition: max-width 0.2s;
    }
    .card.wide { max-width: 1100px; }

    /* В потоке, а не абсолютом: в игре шапка сжимается, строка статуса поднимается
       вверх и раньше уезжала прямо под переключатель языка */
    .top-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 8px;
    }
    .account-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 130px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .account-chip .chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 24, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-card {
      width: 100%;
      max-width: 320px;
      background: #1b1e3d;
      /* окно живёт за пределами .card, свой цвет текста ему нужен явно —
         иначе достаётся чёрный по умолчанию от body */
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px 18px 18px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .modal-card .modal-text {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .lang-switcher {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      font-weight: 500;
      z-index: 5;
    }
    .lang-switcher:focus { border-color: rgba(255,255,255,0.4); }

    .header { text-align: center; margin-bottom: 20px; margin-top: 10px; transition: margin 0.15s; }
    .header .emoji { font-size: clamp(30px, 8vw, 40px); margin-bottom: 6px; transition: font-size 0.15s; }
    .header h1 { font-size: clamp(20px, 5vw, 24px); font-weight: 700; letter-spacing: -0.5px; transition: font-size 0.15s; }
    .header.compact {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 12px; margin-top: 0;
    }
    .header.compact .emoji { font-size: 20px; margin-bottom: 0; }
    .header.compact h1 { font-size: 15px; opacity: 0.7; }

    .row { display: flex; gap: 8px; width: 100%; }

    input[type=number], input[type=text], select.field {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
      outline: none;
      -moz-appearance: textfield;
      caret-color: #fff;
      font-family: inherit;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    select.field option { background: #1e1b4b; color: #fff; }

    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-block { width: 100%; }

    .btn-yellow {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #fbbf24;
      color: #1c1917;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-yellow:hover { background: #f59e0b; }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.16); }

    .btn-reset {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-family: inherit;
    }

    /* ---------- Стартовый экран ---------- */
    .mode-list { display: flex; flex-direction: column; gap: 12px; }
    .mode-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }
    .mode-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.3); }
    .mode-btn .m-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .mode-btn .m-sub { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
    .mode-btn.duel { border-left: 3px solid var(--p1); }
    .mode-btn.solo { border-left: 3px solid var(--p0); }
    .mode-btn.run { border-left: 3px solid #4ade80; }

    /* ---------- Настройка дуэли ---------- */
    .setup-field { margin-bottom: 14px; }
    .setup-field label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .setup-row { display: flex; gap: 8px; }

    /* ---------- Игровое поле ---------- */
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "p0 p1" "center center";
      gap: 12px;
      align-items: start;
    }
    .board.solo { grid-template-columns: 1fr; grid-template-areas: "center"; }
    .board .pc0 { grid-area: p0; }
    .board .pc1 { grid-area: p1; }
    .board .center { grid-area: center; min-width: 0; }

    @media (min-width: 860px) {
      .board.duel {
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-areas: "p0 center p1";
        gap: 20px;
        align-items: start;
      }
      .thermo-wrap { margin: 10px 0 22px; }
      .thermo-tube {
        width: 24px;
        height: 140px;
        border-radius: 12px 12px 0 0;
      }
      .thermo-tube::before { left: 4px; width: 4px; top: 6px; bottom: 6px; }
      .thermo-bulb { width: 54px; height: 54px; margin-top: -6px; }
      .thermo-bulb::after { top: 11px; left: 14px; width: 13px; height: 8px; }
    }

    .pcard {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .pcard.active {
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    .pcard .p-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
      color: #fff;
      word-break: break-word;
    }
    .pcard .p-name .p-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 7px currentColor;
    }
    .pcard .p-pips { font-size: 13px; letter-spacing: 2px; margin-bottom: 10px; opacity: 0.65; transition: opacity 0.2s; }
    .pcard.active .p-pips { opacity: 1; }
    .pcard .p-wins-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .token-btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .token-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
    .token-btn:disabled { opacity: 0.28; cursor: default; }
    .token-btn.armed { background: rgba(74, 222, 128, 0.2); border-color: #4ade80; color: #86efac; }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .info-bar .confirmed { font-size: 13px; color: rgba(255, 255, 255, 0.6); }
    .info-bar .attempts { font-size: 13px; font-weight: 600; color: #a5f3fc; }
    .info-bar .attempts.low { color: #f87171; }

    .turn-banner {
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid transparent;
    }

    .confirmed strong { color: #fde68a; font-weight: 700; }

    .thermo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 6px 0 18px;
    }
    .thermo-tube {
      position: relative;
      width: 18px;
      height: 104px;
      border-radius: 9px 9px 0 0;
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.32);
      border-bottom: none;
      overflow: hidden;
      z-index: 1;
    }
    .thermo-tube::before {
      /* стеклянный блик слева по всей трубке */
      content: "";
      position: absolute;
      top: 4px; bottom: 4px; left: 3px;
      width: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,0.28);
      z-index: 3;
      pointer-events: none;
    }
    .thermo-fill {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      height: 8%;
      background: #93C5FD;
      transition: height 0.65s cubic-bezier(.4,0,.2,1), background-color 0.6s ease;
      z-index: 1;
    }
    .thermo-fill::after {
      /* мениск — светлая полоска на поверхности ртути */
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.45);
    }
    .thermo-bulb {
      position: relative;
      width: 40px;
      height: 40px;
      margin-top: -5px;
      border-radius: 50%;
      background: #93C5FD;
      border: 2px solid rgba(255,255,255,0.32);
      box-shadow: 0 0 18px 2px rgba(147,197,253,0.35);
      transition: background-color 0.6s ease, box-shadow 0.6s ease;
      z-index: 2;
    }
    .thermo-bulb::after {
      /* блик-отражение на стекле колбы */
      content: "";
      position: absolute;
      top: 8px; left: 10px;
      width: 9px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      transform: rotate(-25deg);
    }
    .thermo-bulb.pulse { animation: thermoPulse 0.8s ease 2; }
    @keyframes thermoPulse {
      0%, 100% { box-shadow: 0 0 18px 2px rgba(255,255,255,0.4); }
      50% { box-shadow: 0 0 0 14px rgba(255,255,255,0); }
    }

    .feedback-panel {
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: center;
      animation: pop 0.3s ease;
    }
    .feedback-panel .fb-label { font-size: clamp(20px, 6vw, 26px); font-weight: 600; }

    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feedback-panel { animation: none; }
      .pcard.active { transform: none; }
      .thermo-fill, .thermo-bulb { transition: none; }
      .thermo-bulb.pulse { animation: none; }
    }

    /* Компактная раскладка одиночной игры на телефоне — чтобы всё помещалось
       на экран без прокрутки. На широких экранах (≥860px) не действует. */
    @media (max-width: 859px) {
      .card.solo-game .header { display: none; }

      .card.solo-game .info-bar { margin-bottom: 10px; }

      .card.solo-game .thermo-wrap { margin: 0 0 4px; }

      .card.solo-game .feedback-panel {
        background: none !important;
        border: none !important;
        padding: 0 0 8px;
        margin-bottom: 8px;
        animation: none;
      }
      .card.solo-game .feedback-panel .fb-label { font-size: 16px; }

      .card.solo-game .guess-section { margin-bottom: 10px; }
      .card.solo-game .guess-section p { margin-bottom: 5px; }

      .card.solo-game .history-list { max-height: 96px; }

      .card.solo-game .lang-switcher {
        position: static;
        display: block;
        margin: 0 0 10px auto;
      }
    }

    .final-box {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid #fbbf24;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .final-box p {
      text-align: center;
      font-size: 14px;
      color: #fde68a;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .result-box {
      border-radius: 14px;
      padding: 18px 14px;
      margin-bottom: 16px;
      text-align: center;
      line-height: 1.4;
    }
    .result-win { background: rgba(22, 163, 74, 0.16); border: 1px solid #16a34a; color: #86efac; }
    .result-lose { background: rgba(239, 68, 68, 0.16); border: 1px solid #ef4444; color: #fca5a5; }
    .result-round { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
    .result-box .r-icon { font-size: 32px; line-height: 1; margin-bottom: 6px; }
    .result-box .r-title { font-size: 18px; font-weight: 800; }
    .result-box .r-score {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 14px; flex-wrap: wrap;
    }
    .result-box .r-chip {
      padding: 6px 14px; border-radius: 999px; border: 1.5px solid;
      font-weight: 700; font-size: 13px; background: rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    .result-box .r-vs { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 700; }
    .result-box .r-secret { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.45); }
    .result-box .r-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }

    .guess-section { margin-bottom: 16px; }
    .guess-section p { margin-bottom: 8px; font-size: 14px; color: rgba(255, 255, 255, 0.65); font-weight: 500; }

    .history-section { margin-bottom: 16px; }
    .history-title {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .history-list.tall { max-height: 340px; }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      gap: 10px;
    }
    .history-item .h-num { color: rgba(255, 255, 255, 0.4); font-size: 12px; flex-shrink: 0; }
    .history-item .h-who { font-size: 12px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .h-guess { font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .history-item .h-label { font-size: 13px; font-weight: 600; text-align: right; word-break: break-word; }

    .legend { margin-top: 20px; }
    #scaleBox { margin-bottom: 10px; }
    .legend-body { margin-top: 10px; }

    .legend-bar { display: none; }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 210px));
      justify-content: center;
      gap: 8px 18px;
    }
    .legend-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
    .legend-item .l-label { font-weight: 600; }
    .legend-item .l-range { color: rgba(255, 255, 255, 0.4); font-variant-numeric: tabular-nums; }

    @media (min-width: 860px) {
      .legend-bar {
        display: flex;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 16px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }
      .legend-bar span { flex: 1; }

      .legend-grid {
        grid-template-columns: repeat(8, 1fr);
        justify-content: stretch;
        gap: 4px;
      }
      .legend-item {
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        text-align: center;
        gap: 3px;
      }
      .legend-item .l-label { font-size: 11.5px; line-height: 1.25; }
      .legend-item .l-range { font-size: 11px; }
    }

    .instruction-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .instruction-box summary {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      outline: none;
    }
    .instruction-box p {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.4;
      white-space: pre-line;
    }

    .hidden { display: none !important; }

    :focus-visible { outline: 2px solid #a5f3fc; outline-offset: 2px; }

    #updateBanner {
      cursor: pointer;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fbbf24;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }
    .lb-wrap { margin-top: 14px; }
    .lb-list { margin-top: 8px; }
    .lb-title {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
    }
    .lb-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ---------- Хаб режима на рейтинг ---------- */
    .run-result {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 16px 14px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.7;
    }
    .run-result .rr-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .run-result p { margin: 0; font-size: 14px; }
    .run-result .rr-best { margin-top: 10px; font-size: 15px; font-weight: 700; color: #fbbf24; }
    .run-result .rr-error { margin-top: 10px; font-size: 13px; color: #f87171; }

    .run-greeting {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
      margin: 0 0 14px;
    }
    #screenRunHub .lb-wrap { margin-top: 28px; }
    #screenRunHub .lb-list { margin-top: 10px; }
    #screenRunHub .lb-row { padding: 9px 4px; font-size: 14px; }
    #screenRunHub .lb-row:last-child { border-bottom: none; }
    .run-hub-actions {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .run-hub-actions .btn-ghost { flex: 1; }
    .lb-empty {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      padding: 10px 2px;
    }
  </style>
</head>
<body>
<div class="card" id="card">
  <div id="updateBanner" class="hidden"></div>
  <div class="top-controls">
    <button class="account-chip hidden" id="accountChip" onclick="openLogoutModal()">
      <span>👤</span><span class="chip-name" id="accountChipName"></span>
    </button>
    <select class="lang-switcher" id="langSwitcher" onchange="changeLanguage()">
      <option value="en">🇺🇸 EN</option>
      <option value="ru">🇷🇺 RU</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="de">🇩🇪 DE</option>
    </select>
  </div>

  <div class="header">
    <div class="emoji">🌡️</div>
    <h1 id="tTitle">Hot or Cold</h1>
  </div>

  <!-- ЭКРАН 1: выбор режима -->
  <div id="screenMode">
    <div class="mode-list">
      <button class="mode-btn solo" onclick="openSetup('solo')">
        <div class="m-title" id="tModeSolo">Single player</div>
      </button>
      <button class="mode-btn duel" onclick="openSetup('duel')">
        <div class="m-title" id="tModeDuel">Play with a friend</div>
      </button>
      <button class="mode-btn run" onclick="openRunEntry()">
        <div class="m-title" id="tModeRun"></div>
      </button>
    </div>
  </div>

  <!-- ЭКРАН 2: настройка -->
  <div id="screenSetup" class="hidden">
    <div class="setup-field">
      <label id="tLblRange">Range</label>
      <select class="field" id="rangeMax" onchange="buildAttemptsOptions()"></select>
    </div>

    <div class="setup-field" id="attemptsField">
      <label id="tLblAttempts">Attempts</label>
      <select class="field" id="attemptsCount"></select>
    </div>

    <div id="duelOnlyFields">
      <div class="setup-field">
        <label id="tLblP1">Player 1</label>
        <input type="text" id="nameP1" maxlength="14" />
      </div>
      <div class="setup-field">
        <label id="tLblP2">Player 2</label>
        <input type="text" id="nameP2" maxlength="14" />
      </div>
      <div class="setup-field">
        <label id="tLblWins">Play until how many wins</label>
        <select class="field" id="winsNeeded">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </div>
      <div class="setup-field">
        <label id="tLblHandicap">Handicap</label>
        <select class="field" id="handicap"></select>
      </div>
    </div>

    <div class="setup-row">
      <button class="btn-ghost" onclick="showScreen('mode')" id="tBack">Back</button>
      <button class="btn btn-block" onclick="startFromSetup()" id="tStartMatch">Start match</button>
    </div>
  </div>

  <!-- ЭКРАН 3: игра -->

        finalScore: "Endpunktzahl: ",
        newBest: "🏆 Neuer persönlicher Rekord!",
        noScores: "Noch keine Ergebnisse — sei der Erste",
        logoutAsk: "Von {name} abmelden? Das Ergebnis bleibt in der Rangliste — melde dich mit demselben Namen und PIN wieder an.",
        cancel: "Abbrechen",
        insTitle: "Ranglisten-Spiel 📋",
        insBody: "Die Runden laufen nacheinander. Runde geschafft — die nächste hat einen größeren Bereich und weniger Versuche.\n\nEin Fehler und das Spiel endet, das Ergebnis geht in die gemeinsame Rangliste.\n\nPunkte pro Runde: je weiter du kommst und je weniger Versuche du brauchst, desto mehr.\n\nIn der Rangliste zählt nur dein bestes Spiel."
      }
    }
  };

  // Восемь цветов шкалы — фиксированы, не зависят от диапазона (это исходная,
  // одобренная палитра). Меняются только числовые границы каждого пояса.
  const TIER_COLORS = [
    { color: "#93C5FD", bg: "rgba(147, 197, 253, 0.15)" }, // очень холодно
    { color: "#38BDF8", bg: "rgba(56, 189, 248, 0.15)" },  // холодно
    { color: "#2DD4BF", bg: "rgba(45, 212, 191, 0.15)" },  // прохладно
    { color: "#FBBF24", bg: "rgba(251, 191, 36, 0.15)" },  // тепло
    { color: "#FB923C", bg: "rgba(251, 146, 60, 0.15)" },  // жарко
    { color: "#F87171", bg: "rgba(248, 113, 113, 0.15)" }, // очень горячо
    { color: "#FF5733", bg: "rgba(255, 87, 51, 0.18)" },   // очень-очень горячо
    { color: "#FF4500", bg: "rgba(255, 69, 0, 0.2)" },     // лава
  ];
  const BULLSEYE_TIER = { color: "#4ADE80", bg: "rgba(74, 222, 128, 0.15)" };

  // Верхние границы 8 поясов (от самого холодного к самому горячему) для
  // каждого диапазона. 1000 — эталон, остальные — та же логарифмическая форма,
  // пересчитанная под свой диапазон (см. ответ в чате).
  const RANGE_TIER_UPPER = {
    10:      [9, 7, 6, 5, 4, 3, 2, 1],
    100:     [99, 64, 32, 16, 8, 4, 2, 1],
    1000:    [1000, 500, 200, 100, 50, 20, 10, 3],
  };
  const RANGE_PRESETS = [10, 100, 1000];

  // Горячий конец шкалы не растёт вместе с диапазоном: жарко/горячо/очень горячо/лава
  // всегда означают одни и те же расстояния. Именно по горячим поясам игрок и вычисляет
  // число в конце — если бы они росли пропорционально, «лава» на диапазоне в 10 000
  // значила бы «где-то в пределах 40», и добить раунд стало бы невозможно.
  // Значения взяты из ручной таблицы для 1000 — то есть шкала ведёт себя так же, как там.
  const HOT_TIER_UPPER = [50, 20, 10, 3];

  // Для произвольного диапазона (режим на рейтинг) готовой таблицы поясов нет — считаем её.
  function generateTierUpper(rangeMax) {
    const maxDistance = Math.max(1, rangeMax - 1);

    // Тесный диапазон: горячие пояса в него просто не помещаются, раскладываем
    // логарифмически по всей ширине. Для 10 это даёт ровно ручную таблицу.
    if (maxDistance <= HOT_TIER_UPPER[0]) {
      const U = [];
      for (let i = 0; i < 8; i++) {
        U.push(Math.max(Math.round(maxDistance * Math.pow(0.45, i)), 8 - i));
      }
      for (let i = 1; i < 8; i++) {
        if (U[i] >= U[i - 1]) U[i] = Math.max(1, U[i - 1] - 1);
      }
      return U;
    }

    // Широкий диапазон: холодные четыре пояса растягиваются от края диапазона
    // до начала горячей зоны, горячие четыре — фиксированы.
    const ratio = Math.pow(HOT_TIER_UPPER[0] / maxDistance, 1 / 4);
    const U = [];
    for (let i = 0; i < 4; i++) U.push(Math.round(maxDistance * Math.pow(ratio, i)));
    HOT_TIER_UPPER.forEach(v => U.push(v));
    for (let i = 1; i < 8; i++) {
      if (U[i] >= U[i - 1]) U[i] = Math.max(1, U[i - 1] - 1);
    }
    return U;
  }

  function buildFeedbackMeta(rangeMax) {
    const U = RANGE_TIER_UPPER[rangeMax] || generateTierUpper(rangeMax);
    const meta = [];
    for (let i = 0; i < 8; i++) {
      const max = U[i];
      const min = (i === 7) ? 1 : U[i + 1] + 1;
      meta.push({
        min, max, labelIndex: i,
        color: TIER_COLORS[i].color, bg: TIER_COLORS[i].bg,
        rangeSign: (min === max) ? String(min) : (min + '–' + max)
      });
    }
    meta.push({ min: 0, max: 0, labelIndex: 8, rangeSign: "0",
                color: BULLSEYE_TIER.color, bg: BULLSEYE_TIER.bg });
    return meta;
  }

  function minAttempts(rangeMax) {
    return Math.max(1, Math.ceil(Math.log2(rangeMax)));
  }

  function formatNum(n) {
    try { return n.toLocaleString(currentLang === 'en' ? 'en-US' : currentLang); }
    catch (e) { return String(n); }
  }

  let RANGE_MAX = 1000;
  let MAX_GUESSES = 10;
  let FEEDBACK_META = buildFeedbackMeta(RANGE_MAX);
  const P_COLORS = ["#6366f1", "#fbbf24"];

  let currentLang = localStorage.getItem('hc_lang') || 'en';

  // ---------- общее состояние ----------
  let mode = null;          // 'solo' | 'duel'
  let screen = 'mode';      // 'mode' | 'setup' | 'game'
  let secret = 0;
  let history = [];
  let gameOver = false;
  let gameOverType = null;
  let lastWinIsRecord = false;

  // ---------- состояние дуэли ----------
  const D = {
    names: ["", ""],
    winsNeeded: 3,
    handicap: 0,      // 0 нет, 1/2 — 2 жетона игроку 1/2, 3/4 — игрок 1/2 всегда первый
    wins: [0, 0],
    tokens: [0, 0],
    cur: 0,
    starter: 0,
    round: 1,
    armed: false,
    roundOver: false,
    matchOver: false,
    roundWinner: null
  };

  function t() { return i18n[currentLang]; }

  // ================= ЯЗЫК =================
  function changeLanguage() {
    currentLang = document.getElementById('langSwitcher').value;
    localStorage.setItem('hc_lang', currentLang);
    applyTranslations();
  }

  function buildHandicapOptions() {
    const sel = document.getElementById('handicap');
    const prev = sel.value || "0";
    const L = t();
    const opts = [
      L.hcNone,
      L.defP1 + " — " + L.hcTokens,
      L.defP2 + " — " + L.hcTokens,
      L.defP1 + " — " + L.hcFirst,
      L.defP2 + " — " + L.hcFirst
    ];
    sel.innerHTML = '';
    opts.forEach((txt, i) => {
      const o = document.createElement('option');
      o.value = i; o.textContent = txt;
      sel.appendChild(o);
    });
    sel.value = prev;
  }

  function applyTranslations() {
    const L = t();

    document.getElementById('docTitle').textContent = L.docTitle;
    document.title = L.docTitle;
    document.getElementById('tTitle').textContent = L.title;
    document.getElementById('tConfirmed').textContent = L.confirmed;
    document.getElementById('tMenu').textContent = L.menu;
    document.getElementById('tFinalWarning').textContent = L.finalWarning;
    document.getElementById('tFinalSubmit').textContent = L.finalSubmit;
    document.getElementById('tEnterGuess').textContent = L.enterGuess;
    document.getElementById('tSubmitGuess').textContent = L.submitGuess;
    document.getElementById('tHistoryTitle').textContent = L.historyTitle;
    document.getElementById('tLegendTitle').textContent = L.legendTitle;

    document.getElementById('tModeSolo').textContent = L.modeSolo;
    document.getElementById('tModeDuel').textContent = L.modeDuel;

    document.getElementById('tLblP1').textContent = L.lblP1;
    document.getElementById('tLblP2').textContent = L.lblP2;
    document.getElementById('tLblWins').textContent = L.lblWins;
    document.getElementById('tLblHandicap').textContent = L.lblHandicap;
    document.getElementById('tBack').textContent = L.back;
    document.getElementById('tStartMatch').textContent = L.startMatch;
    document.getElementById('tWinsLabel0').textContent = L.winsLabel;
    document.getElementById('tWinsLabel1').textContent = L.winsLabel;

    document.getElementById('nameP1').placeholder = L.defP1;
    document.getElementById('nameP2').placeholder = L.defP2;
    document.getElementById('guessInput').placeholder = L.placeholderTpl.replace('{n}', formatNum(RANGE_MAX));
    document.getElementById('finalInput').placeholder = L.finalInput;

    // экраны режима на рейтинг
    document.getElementById('tModeRun').textContent = L.run.mode;
    document.getElementById('tRunChoiceLogin').textContent = L.run.choiceLogin;
    document.getElementById('tRunChoiceLoginSub').textContent = L.run.choiceLoginSub;
    document.getElementById('tRunChoiceRegister').textContent = L.run.choiceRegister;
    document.getElementById('tRunChoiceRegisterSub').textContent = L.run.choiceRegisterSub;
    document.getElementById('tRunChoiceBack').textContent = L.run.back;
    document.getElementById('tRunAuthBack').textContent = L.run.back;
    document.getElementById('tRunName').textContent = L.run.name;
    document.getElementById('tRunPin').textContent = L.run.pin;
    document.getElementById('runUsername').placeholder = L.run.namePh;
    document.getElementById('tRunStart').textContent = L.run.start;
    document.getElementById('tRunTop').textContent = L.run.top;
    document.getElementById('tRunToMenu').textContent = L.run.toMenu;
    if (mode === 'run') document.getElementById('tMenu').textContent = L.run.abort;
    if (screen === 'auth') {
      document.getElementById('runAuthTitle').textContent =
        runAuthMode === 'register' ? L.run.registerTitle : L.run.loginTitle;
      document.getElementById('runAuthSubmitBtn').textContent =
        runAuthMode === 'register' ? L.run.registerBtn : L.run.loginBtn;
    }

    document.getElementById('tLblRange').textContent = L.lblRange;
    document.getElementById('tLblAttempts').textContent = L.lblAttempts;

    buildHandicapOptions();
    buildRangeOptions();
    buildLegend();
    renderAll();
  }

  // ================= НАВИГАЦИЯ =================
  function showScreen(name) {
    screen = name;
    document.getElementById('screenMode').classList.toggle('hidden', name !== 'mode');
    document.getElementById('screenSetup').classList.toggle('hidden', name !== 'setup');
    document.getElementById('screenGame').classList.toggle('hidden', name !== 'game');
    document.getElementById('screenAuthChoice').classList.toggle('hidden', name !== 'authChoice');
    document.getElementById('screenAuth').classList.toggle('hidden', name !== 'auth');
    document.getElementById('screenRunHub').classList.toggle('hidden', name !== 'runHub');
    document.getElementById('card').classList.toggle('wide', name === 'game' && mode === 'duel');
    document.getElementById('card').classList.toggle('solo-game', name === 'game' && mode !== 'duel');
    document.querySelector('.header').classList.toggle('compact', name === 'game');
    document.querySelector('.legend').classList.toggle('hidden', name !== 'game');
    updateAccountChip();
  }

  function quitToMenu() {
    mode = null;
    D.matchOver = false;
    applyTranslations();
    showScreen('mode');
  }

  // Выход с игрового экрана: в режиме на рейтинг это отказ от текущей игры —
  // возвращаемся в хаб режима, а не в главное меню
  function leaveGame() {
    if (mode === 'run') {
      RUN = null;
      mode = null;
      applyTranslations();
      openRunHub();
      return;
    }
    quitToMenu();
  }

  // ================= ОБЩАЯ НАСТРОЙКА (диапазон/попытки/дуэль) =================
  function openSetup(m) {
    mode = m;
    const L = t();
    document.getElementById('duelOnlyFields').classList.toggle('hidden', m !== 'duel');
    document.getElementById('attemptsField').classList.toggle('hidden', m !== 'solo');
    document.getElementById('tStartMatch').textContent = (m === 'duel') ? L.startMatch : L.startGame;
    buildRangeOptions();
    if (m === 'duel') buildHandicapOptions();
    showScreen('setup');
  }

  function buildRangeOptions() {
    const sel = document.getElementById('rangeMax');
    if (!sel) return;
    const prev = sel.value;
    sel.innerHTML = '';
    RANGE_PRESETS.forEach(n => {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = '1–' + formatNum(n);
      sel.appendChild(o);
    });
    sel.value = RANGE_PRESETS.includes(parseInt(prev)) ? prev : '1000';
    buildAttemptsOptions();
  }

  function buildAttemptsOptions() {
    const rangeSel = document.getElementById('rangeMax');
    const rangeMax = parseInt(rangeSel && rangeSel.value) || 1000;
    const min = minAttempts(rangeMax);
    const sel = document.getElementById('attemptsCount');
    const prev = sel.value;
    const options = [min, min + 1, min + 2, min + 3, min + 5, min + 8, min + 12];
    sel.innerHTML = '';
    options.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
    sel.value = options.includes(parseInt(prev)) ? prev : String(min);
  }

  function applyRangeToInputs() {
    ['guessInput', 'finalInput'].forEach(id => {
      const el = document.getElementById(id);
      el.min = 1; el.max = RANGE_MAX;
    });
  }

  function startFromSetup() {
    RANGE_MAX = parseInt(document.getElementById('rangeMax').value) || 1000;
    if (mode === 'solo') {
      MAX_GUESSES = parseInt(document.getElementById('attemptsCount').value) || minAttempts(RANGE_MAX);
    }
    FEEDBACK_META = buildFeedbackMeta(RANGE_MAX);
    applyRangeToInputs();
    if (mode === 'duel') startMatch(); else startSolo();
  }

  // ================= ОДИНОЧНАЯ ИГРА =================
  function startSolo() {
    resetSolo();
    applyTranslations();
    showScreen('game');
  }

  function resetSolo() {
    secret = Math.floor(Math.random() * RANGE_MAX) + 1;
    history = [];
    gameOver = false;
    gameOverType = null;
    lastWinIsRecord = false;
    document.getElementById('finalInput').value = '';
    document.getElementById('guessInput').value = '';
    renderAll();
  }

  function handleGuess() {
    if (mode === 'duel') return duelGuess();
    if (mode === 'run') return runGuess();
    if (gameOver) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < 1 || guess > RANGE_MAX) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: null });
    input.value = '';

    if (distance === 0) {
      gameOver = true;
      gameOverType = 'win';
      lastWinIsRecord = maybeSaveRecord(RANGE_MAX, history.length);
    } else if (history.length >= MAX_GUESSES) {
      gameOver = true;
      gameOverType = 'lose_waiting';
    }
    renderAll();
  }

  function submitFinal() {
    const input = document.getElementById('finalInput');
    const g = parseInt(input.value);
    if (isNaN(g)) return;
    const win = (g === secret);
    gameOverType = win ? 'win' : 'lose';
    lastWinIsRecord = win ? maybeSaveRecord(RANGE_MAX, history.length + 1) : false;
    renderAll();
  }

  // ================= РЕКОРДЫ (только одиночная игра) =================
  function recordKey(rangeMax) { return 'hc_record_' + rangeMax; }

  function getRecord(rangeMax) {
    try {
      const v = localStorage.getItem(recordKey(rangeMax));
      return v ? parseInt(v) : null;
    } catch (e) { return null; }
  }

  function maybeSaveRecord(rangeMax, guesses) {
    try {
      const cur = getRecord(rangeMax);
      if (cur === null || guesses < cur) {
        localStorage.setItem(recordKey(rangeMax), String(guesses));
        return true;
      }
    } catch (e) {}
    return false;
  }

  // ================= ДУЭЛЬ =================
  function startMatch() {
    const L = t();
    mode = 'duel';
    D.names[0] = (document.getElementById('nameP1').value || '').trim() || L.defP1;
    D.names[1] = (document.getElementById('nameP2').value || '').trim() || L.defP2;
    D.winsNeeded = parseInt(document.getElementById('winsNeeded').value);
    D.handicap = parseInt(document.getElementById('handicap').value);
    D.wins = [0, 0];
    D.round = 1;
    D.matchOver = false;
    D.starter = (D.handicap === 3) ? 0 : (D.handicap === 4 ? 1 : 0);
    startRound();
    applyTranslations();
    showScreen('game');
  }

  function startRound() {
    secret = Math.floor(Math.random() * RANGE_MAX) + 1;
    history = [];
    D.tokens = [1, 1];
    if (D.handicap === 1) D.tokens[0] = 2;
    if (D.handicap === 2) D.tokens[1] = 2;
    D.cur = D.starter;
    D.armed = false;
    D.roundOver = false;
    D.roundWinner = null;
    document.getElementById('guessInput').value = '';
    renderAll();
  }

  function nextRound() {
    D.round++;
    if (D.handicap !== 3 && D.handicap !== 4) D.starter = 1 - D.starter;
    startRound();
  }

  function newMatch() {
    D.wins = [0, 0];
    D.round = 1;
    D.matchOver = false;
    D.starter = (D.handicap === 3) ? 0 : (D.handicap === 4 ? 1 : 0);
    startRound();
  }

  function useToken(p) {
    if (mode !== 'duel' || D.roundOver || D.matchOver) return;
    if (p !== D.cur) return;
    if (D.armed) {
      D.armed = false;
      D.tokens[p]++;
      renderAll();
      return;
    }
    if (D.tokens[p] <= 0) return;
    if (history.length === 0) return;   // нельзя первым ходом раунда
    D.tokens[p]--;
    D.armed = true;
    renderAll();
  }

  function duelGuess() {
    if (D.roundOver || D.matchOver) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < 1 || guess > RANGE_MAX) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: D.cur });
    input.value = '';

    const usedDouble = D.armed;
    D.armed = false;

    if (distance === 0) {
      D.roundOver = true;
      D.roundWinner = D.cur;
      D.wins[D.cur]++;
      if (D.wins[D.cur] >= D.winsNeeded) D.matchOver = true;
    } else if (!usedDouble) {
      D.cur = 1 - D.cur;
    }
    renderAll();
  }

  // ================= РЕНДЕР =================
  function getFeedback(distance) {
    return FEEDBACK_META.find(f => distance >= f.min && distance <= f.max) || FEEDBACK_META[0];
  }
  function getFbText(meta) { return t().labels[meta.labelIndex]; }

  function renderAll() {
    if (screen !== 'game' && mode === null) return;
    const duel = mode === 'duel';
    const board = document.getElementById('board');
    board.classList.toggle('duel', duel);
    board.classList.toggle('solo', !duel);
    document.getElementById('pcard0').classList.toggle('hidden', !duel);
    document.getElementById('pcard1').classList.toggle('hidden', !duel);
    document.getElementById('historyList').classList.toggle('tall', duel);

    renderFeedback();
    renderThermo();
    renderStatus();
    renderResult();
    renderHistory();
    if (duel) renderPlayers();
  }

  function renderFeedback() {
    const panel = document.getElementById('feedbackPanel');
    const last = history[history.length - 1];
    const hide = !last || (mode === 'duel' ? D.roundOver : gameOverType === 'win' || gameOverType === 'lose');
    if (hide) { panel.classList.add('hidden'); return; }
    panel.style.background = last.meta.bg;
    panel.style.border = '1px solid ' + last.meta.color;
    panel.classList.remove('hidden');
    const label = document.getElementById('feedbackLabel');
    label.textContent = getFbText(last.meta);
    label.style.color = last.meta.color;
  }

  function renderThermo() {
    const wrap = document.getElementById('thermoWrap');
    wrap.classList.remove('hidden');

    const fill = document.getElementById('thermoFill');
    const bulb = document.getElementById('thermoBulb');
    const last = history[history.length - 1];

    let pct, color;
    if (!last) {
      pct = 8;
      color = TIER_COLORS[0].color;
    } else if (last.distance === 0) {
      pct = 100;
      color = BULLSEYE_TIER.color;
    } else {
      pct = Math.round(((last.meta.labelIndex + 1) / 9) * 100);
      color = last.meta.color;
    }

    fill.style.height = pct + '%';
    fill.style.background = color;
    bulb.style.background = color;
    bulb.style.boxShadow = '0 0 18px 2px ' + color + '59';

    if (last && last.distance === 0) {
      bulb.classList.remove('pulse');
      void bulb.offsetWidth; // перезапуск анимации при повторной победе
      bulb.classList.add('pulse');
    } else {
      bulb.classList.remove('pulse');
    }
  }

  function renderStatus() {
    const L = t();
    const duel = mode === 'duel';
    const attempts = document.getElementById('attemptsLabel');
    const banner = document.getElementById('turnBanner');
    const confirmed = document.getElementById('tConfirmed');

    if (duel) {
      confirmed.textContent = L.confirmed;
      attempts.textContent = L.roundLabel + D.round;
      attempts.className = 'attempts';
      if (D.roundOver) { banner.classList.add('hidden'); }
      else {
        banner.classList.remove('hidden');
        banner.textContent = L.turnOf + D.names[D.cur] + (D.armed ? '  ' + L.tokenArmed : '');
        banner.style.borderColor = P_COLORS[D.cur];
        banner.style.background = 'rgba(255,255,255,0.06)';
        banner.style.color = P_COLORS[D.cur];
      }
      document.getElementById('finalBox').classList.add('hidden');
      document.getElementById('guessSection').classList.toggle('hidden', D.roundOver);
    } else {
      banner.classList.add('hidden');
      const left = MAX_GUESSES - history.length;
      attempts.textContent = L.attemptsPrefix + left + ' / ' + MAX_GUESSES;
      attempts.className = 'attempts' + (left <= 3 ? ' low' : '');
      document.getElementById('finalBox').classList.toggle('hidden', mode === 'run' || gameOverType !== 'lose_waiting');
      document.getElementById('guessSection').classList.toggle('hidden', gameOver);

      if (mode === 'run') {
        confirmed.innerHTML = L.run.round + '<strong>' + RUN.round + '</strong>&nbsp;&nbsp;' +
                              L.run.score + '<strong>' + RUN.totalScore + '</strong>';
      } else {
        const rec = getRecord(RANGE_MAX);
        confirmed.innerHTML = (rec === null) ? L.confirmed : (L.recordLabel + '<strong>' + rec + '</strong>');
      }
    }
  }

  function renderResult() {
    const box = document.getElementById('resultBox');
    const L = t();
    box.innerHTML = '';

    // В режиме на рейтинг итогов внутри раунда нет: победа сразу ведёт
    // в следующий раунд, проигрыш — на экран с результатом всей игры
    if (mode === 'run') { box.classList.add('hidden'); return; }

    if (mode === 'duel') {
      if (!D.roundOver) { box.classList.add('hidden'); return; }
      const w = D.roundWinner;
      box.className = 'result-box ' + (D.matchOver ? 'result-win' : 'result-round');

      const icon = document.createElement('div');
      icon.className = 'r-icon';
      icon.textContent = D.matchOver ? '🏆' : '🎯';

      const title = document.createElement('div');
      title.className = 'r-title';
      title.style.color = D.matchOver ? P_COLORS[w] : '#fff';
      title.textContent = D.names[w] + (D.matchOver ? L.matchWin : L.roundWin);

      const score = document.createElement('div');
      score.className = 'r-score';
      score.innerHTML =
        '<span class="r-chip" style="color:' + P_COLORS[0] + ';border-color:' + P_COLORS[0] + '">' +
          escapeHtml(D.names[0]) + ' ' + D.wins[0] + '</span>' +
        '<span class="r-vs">:</span>' +
        '<span class="r-chip" style="color:' + P_COLORS[1] + ';border-color:' + P_COLORS[1] + '">' +
          D.wins[1] + ' ' + escapeHtml(D.names[1]) + '</span>';

      const secretLine = document.createElement('div');
      secretLine.className = 'r-secret';
      secretLine.textContent = L.secretWas + secret;

      const actions = document.createElement('div');
      actions.className = 'r-actions';
      if (D.matchOver) {
        actions.innerHTML = '<button class="btn" onclick="newMatch()">' + L.newMatch + '</button>' +
                            '<button class="btn-ghost" onclick="quitToMenu()">' + L.toMenu + '</button>';
      } else {
        actions.innerHTML = '<button class="btn" onclick="nextRound()">' + L.nextRound + '</button>';
      }
      box.appendChild(icon); box.appendChild(title); box.appendChild(score);
      box.appendChild(secretLine); box.appendChild(actions);
      box.classList.remove('hidden');
      return;
    }

    if (gameOverType === 'win' || gameOverType === 'lose') {
      box.className = 'result-box ' + (gameOverType === 'win' ? 'result-win' : 'result-lose');
      const title = document.createElement('div');
      title.className = 'r-title';
      title.textContent = gameOverType === 'win' ? L.resultWin : (L.resultLose + secret);
      box.appendChild(title);

      if (gameOverType === 'win' && lastWinIsRecord) {
        const rec = document.createElement('div');
        rec.className = 'r-secret';
        rec.textContent = L.newRecord;
        box.appendChild(rec);
      }

      const actions = document.createElement('div');
      actions.className = 'r-actions';
      actions.innerHTML = '<button class="btn" onclick="resetSolo()">' + L.newGame + '</button>' +
                          '<button class="btn-ghost" onclick="quitToMenu()">' + L.toMenu + '</button>';
      box.appendChild(actions);

      if (gameOverType === 'win' && sb) {
        const attemptsUsed = history.length;
        const savedNick = localStorage.getItem('hc_nick') || '';
        const lbWrap = document.createElement('div');
        lbWrap.className = 'lb-wrap';
        lbWrap.innerHTML =
          '<div class="row">' +
            '<input type="text" id="lbNick" maxlength="20" placeholder="Ваше имя" value="' + escapeHtml(savedNick) + '" />' +
            '<button class="btn-yellow" id="lbSubmitBtn">В топ 🏆</button>' +
          '</div>' +
          '<div id="lbList" class="lb-list"></div>';
        box.appendChild(lbWrap);
        renderLeaderboard(RANGE_MAX, document.getElementById('lbList'));
        document.getElementById('lbSubmitBtn').onclick = async () => {
          const nick = (document.getElementById('lbNick').value || '').trim().slice(0, 20) || 'Игрок';
          localStorage.setItem('hc_nick', nick);
          const btn = document.getElementById('lbSubmitBtn');
          btn.disabled = true;
          const res = await submitScore(nick, attemptsUsed, RANGE_MAX);
          btn.disabled = false;
          const list = document.getElementById('lbList');
          if (!res.ok) {
            list.innerHTML = '<div class="lb-title" style="color:#f87171">Не удалось отправить: ' + escapeHtml(res.error || '') + '</div>';
            return;
          }
          renderLeaderboard(RANGE_MAX, list);
        };
      }

      box.classList.remove('hidden');
    } else {
      box.classList.add('hidden');
    }
  }

  function renderPlayers() {
    const L = t();
    for (let p = 0; p < 2; p++) {
      const card = document.getElementById('pcard' + p);
      card.style.borderColor = P_COLORS[p];
      card.classList.toggle('active', D.cur === p && !D.roundOver);

      const nameEl = document.getElementById('pname' + p);
      nameEl.innerHTML = '<span class="p-dot" style="background:' + P_COLORS[p] + ';color:' + P_COLORS[p] + '"></span>' + escapeHtml(D.names[p]);

      let pips = '';
      for (let i = 0; i < D.winsNeeded; i++) pips += (i < D.wins[p] ? '●' : '○');
      const pipsEl = document.getElementById('ppips' + p);
      pipsEl.textContent = pips;
      pipsEl.style.color = P_COLORS[p];

      const btn = document.getElementById('ptoken' + p);
      const isArmedByMe = D.armed && D.cur === p;
      const canArm = !D.armed && D.tokens[p] > 0 && history.length > 0;
      const canUse = !D.roundOver && !D.matchOver && D.cur === p && (isArmedByMe || canArm);
      btn.disabled = !canUse;
      btn.classList.toggle('armed', isArmedByMe);
      const count = D.tokens[p] > 1 ? ' ×' + D.tokens[p] : '';
      btn.textContent = (D.armed && D.cur === p) ? L.tokenArmed
                        : (D.tokens[p] === 0 ? L.tokenSpent : L.tokenBtn + count);
    }
  }

  function renderHistory() {
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');
    if (history.length === 0) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');
    list.innerHTML = '';

    [...history].reverse().forEach((h, i) => {
      const realIndex = history.length - i;
      const item = document.createElement('div');
      item.className = 'history-item';
      const accent = (h.p === null || h.p === undefined) ? h.meta.color : P_COLORS[h.p];
      item.style.borderLeft = '3px solid ' + accent;
      const who = (h.p === null || h.p === undefined)
        ? ''
        : '<span class="h-who" style="color:' + P_COLORS[h.p] + '">' + escapeHtml(D.names[h.p]) + '</span>';
      item.innerHTML =
        '<span class="h-num">#' + realIndex + '</span>' + who +
        '<span class="h-guess">' + h.guess + '</span>' +
        '<span class="h-label" style="color:' + h.meta.color + '">' + getFbText(h.meta) + '</span>';
      list.appendChild(item);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function buildLegend() {
    const grid = document.getElementById('legendGrid');
    const bar = document.getElementById('legendBar');
    grid.innerHTML = '';
    bar.innerHTML = '';
    const labels = t().labels;
    FEEDBACK_META.slice(0, 8).forEach(meta => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = '<span class="l-label" style="color:' + meta.color + '">' + labels[meta.labelIndex] +
                       '</span><span class="l-range">' + meta.rangeSign + '</span>';
      grid.appendChild(item);

      const seg = document.createElement('span');
      seg.style.background = meta.color;
      bar.appendChild(seg);
    });
  }

  function syncRulesOpen() {
    document.getElementById('scaleBox').open = window.innerWidth >= 860;
  }

  // ================= SUPABASE: обновления и таблица рекордов =================
  const SUPABASE_URL = "https://fzakcsvyceqsnowvkxfu.supabase.co";
  const SUPABASE_KEY = "sb_publishable_F-68zKeUGcA9i3bgqKtr6w_TElrOvg5";
  const APP_VERSION = "1"; // повышайте вручную в Supabase (game_config.app_version) после каждого реального обновления кода

  let sb = null;
  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) {}

  // Параметры сложности «Забега» — можно менять в Supabase (game_config.run_config), без деплоя
  let RUN_CONFIG = { start_range: 10, growth: 1.6, buffer_start: 6, buffer_shrink: 1 };

  async function checkRemoteConfig() {
    if (!sb) return;
    try {
      const { data, error } = await sb.from('game_config').select('app_version, announcement, run_config').eq('id', 1).single();
      if (error || !data) return;
      if (data.run_config && typeof data.run_config === 'object') {
        RUN_CONFIG = Object.assign({}, RUN_CONFIG, data.run_config);
      }
      const banner = document.getElementById('updateBanner');
      if (data.app_version && String(data.app_version) !== APP_VERSION) {
        banner.textContent = '🔄 Доступна новая версия игры — нажмите, чтобы обновить';
        banner.onclick = () => location.reload();
        banner.classList.remove('hidden');
      } else if (data.announcement && localStorage.getItem('hc_ann_seen') !== data.announcement) {
        banner.textContent = data.announcement;
        banner.onclick = () => {
          localStorage.setItem('hc_ann_seen', data.announcement);
          banner.classList.add('hidden');
        };
        banner.classList.remove('hidden');
      }
    } catch (e) {}
  }

  async function submitScore(nickname, attempts, rangeMax) {
    if (!sb) return { ok: false, error: 'Supabase client not initialized' };
    try {
      const { error } = await sb.from('scores').insert({ nickname, attempts, range_max: rangeMax });
      if (error) return { ok: false, error: error.message };
      return { ok: true };
    } catch (e) {
      return { ok: false, error: String(e && e.message ? e.message : e) };
    }
  }

  async function renderLeaderboard(rangeMax, containerEl) {
    if (!sb || !containerEl) return;
    containerEl.innerHTML = '';
    try {
      const { data, error } = await sb.from('scores').select('nickname, attempts')
        .eq('range_max', rangeMax)
        .order('attempts', { ascending: true })
        .order('created_at', { ascending: true })
        .limit(10);
      if (error || !data || !data.length) return;
      containerEl.innerHTML =
        '<div class="lb-title">🏆 Топ по диапазону 1–' + formatNum(rangeMax) + '</div>' +
        data.map((r, i) => '<div class="lb-row"><span>' + (i + 1) + '. ' + escapeHtml(r.nickname) +
          '</span><span>' + r.attempts + '</span></div>').join('');
    } catch (e) {}
  }

  // ================= ЗАБЕГ: аккаунт (имя + PIN, без email/пароля) =================
  function runAuth() {
    const u = localStorage.getItem('hc_run_user');
    const p = localStorage.getItem('hc_run_pin');
    return (u && p) ? { username: u, pin: p } : null;
  }

  function runLogout() {
    localStorage.removeItem('hc_run_user');
    localStorage.removeItem('hc_run_pin');
  }

  // Чип с именем ученика живёт рядом с переключателем языка и показывается
  // только в хабе режима на рейтинг — во время самой игры он лишний и легко нажать случайно
  function updateAccountChip() {
    const chip = document.getElementById('accountChip');
    const auth = runAuth();
    const show = !!auth && screen === 'runHub';
    chip.classList.toggle('hidden', !show);
    if (show) document.getElementById('accountChipName').textContent = auth.username;
  }

  function openLogoutModal() {
    const auth = runAuth();
    if (!auth) return;
    const L = t();
    document.getElementById('tLogoutAsk').textContent = L.run.logoutAsk.replace('{name}', auth.username);
    document.getElementById('tLogoutCancel').textContent = L.run.cancel;
    document.getElementById('tLogoutConfirm').textContent = L.run.logout;
    document.getElementById('logoutModal').classList.remove('hidden');
  }

  function closeLogoutModal() {
    document.getElementById('logoutModal').classList.add('hidden');
  }

  function confirmLogout() {
    closeLogoutModal();
    runLogout();
    showScreen('mode');
  }

  let runAuthMode = 'login';

  function openRunEntry() {
    if (runAuth()) openRunHub(); else showScreen('authChoice');
  }

  // Открывает форму заново: поля чистые, ошибок нет
  function showRunAuth(authMode) {
    const L = t();
    runAuthMode = authMode;
    document.getElementById('runUsername').value = '';
    document.getElementById('runPin').value = '';
    document.getElementById('runAuthTitle').textContent =
      authMode === 'register' ? L.run.registerTitle : L.run.loginTitle;
    document.getElementById('runAuthSubmitBtn').textContent =
      authMode === 'register' ? L.run.registerBtn : L.run.loginBtn;
    runAuthError('');
    showScreen('auth');
  }

  // Показывает/прячет ошибку, НЕ трогая введённые поля
  function runAuthError(msg) {
    const err = document.getElementById('runAuthError');
    if (msg) { err.textContent = msg; err.classList.remove('hidden'); }
    else { err.textContent = ''; err.classList.add('hidden'); }
  }

  function runAuthSubmit() {
    return runAuthMode === 'register' ? runRegister() : runLogin();
  }

  function runAuthReadForm() {
    return {
      username: (document.getElementById('runUsername').value || '').trim(),
      pin: (document.getElementById('runPin').value || '').trim()
    };
  }

  function runAuthErrorText(message) {
    const L = t();
    const m = String(message || '');
    if (m.indexOf('invalid_username') >= 0) return L.run.errName;
    if (m.indexOf('invalid_pin') >= 0) return L.run.errPin;
    return L.run.errServer + m;
  }

  async function runRegister() {
    const L = t();
    const { username, pin } = runAuthReadForm();
    if (username.length < 2 || username.length > 20) return runAuthError(L.run.errName);
    if (!/^[0-9]{4}$/.test(pin)) return runAuthError(L.run.errPin);
    if (!sb) return runAuthError(L.run.errNoConn);
    const btn = document.getElementById('runAuthSubmitBtn');
    btn.disabled = true;
    try {
      const { data, error } = await sb.rpc('register_student', { p_username: username, p_pin: pin });
      if (error) return runAuthError(runAuthErrorText(error.message));
      if (data === false) return runAuthError(L.run.errTaken);
      localStorage.setItem('hc_run_user', username);
      localStorage.setItem('hc_run_pin', pin);
      openRunHub();
    } catch (e) {
      runAuthError(L.run.errNoConn);
    } finally {
      btn.disabled = false;
    }
  }

  async function runLogin() {
    const L = t();
    const { username, pin } = runAuthReadForm();
    if (!username || !pin) return runAuthError(L.run.errFill);
    if (!sb) return runAuthError(L.run.errNoConn);
    const btn = document.getElementById('runAuthSubmitBtn');
    btn.disabled = true;
    try {
      const { data, error } = await sb.rpc('login_student', { p_username: username, p_pin: pin });
      if (error) return runAuthError(runAuthErrorText(error.message));
      if (data !== true) return runAuthError(L.run.errBadLogin);
      localStorage.setItem('hc_run_user', username);
      localStorage.setItem('hc_run_pin', pin);
      openRunHub();
    } catch (e) {
      runAuthError(L.run.errNoConn);
    } finally {
      btn.disabled = false;
    }
  }

  async function openRunHub(message) {
    const auth = runAuth();
    if (!auth) return showScreen('authChoice');
    document.getElementById('runHubMessage').innerHTML = message || '';
    await renderRunLeaderboard();
    showScreen('runHub');
  }

  async function renderRunLeaderboard() {
    const el = document.getElementById('runLeaderboardList');
    if (!sb || !el) return;
    const L = t();
    const auth = runAuth();
    el.innerHTML = '';
    try {
      const { data, error } = await sb.rpc('run_leaderboard');
      if (error) return;
      if (!data || !data.length) {
        el.innerHTML = '<div class="lb-empty">' + L.run.noScores + '</div>';
        return;
      }
      el.innerHTML = data.map((r, i) => {
        const isMe = auth && String(r.username).toLowerCase() === auth.username.toLowerCase();
        const style = isMe ? ' style="color:#fbbf24;font-weight:700"' : '';
        return '<div class="lb-row"' + style + '><span>' + (i + 1) + '. ' + escapeHtml(r.username) +
               '</span><span>' + formatNum(r.best_run_score) + '</span></div>';
      }).join('');
    } catch (e) {}
  }

  // ================= ЗАБЕГ: сама игра =================
  let RUN = null;

  function runRangeForRound(n) {
    return Math.max(2, Math.round(RUN_CONFIG.start_range * Math.pow(RUN_CONFIG.growth, n - 1)));
  }

  function runAttemptsForRound(n, range) {
    const buffer = Math.max(0, RUN_CONFIG.buffer_start - (n - 1) * RUN_CONFIG.buffer_shrink);
    // потолок: попыток всегда заметно меньше, чем чисел в диапазоне,
    // иначе на маленьких диапазонах раунд проходится тупым перебором
    const cap = Math.max(2, Math.ceil(range * 0.6));
    return Math.min(minAttempts(range) + buffer, cap);
  }

  // Режим на рейтинг играется на том же экране, что и одиночная игра:
  // термометр, история попыток и шкала берутся оттуда как есть
  function startRun() {
    RUN = { round: 1, totalScore: 0, locked: false };
    mode = 'run';
    startRunRound();
    applyTranslations();
    showScreen('game');
  }

  function startRunRound() {
    if (!RUN) return;
    RANGE_MAX = runRangeForRound(RUN.round);
    MAX_GUESSES = runAttemptsForRound(RUN.round, RANGE_MAX);
    FEEDBACK_META = buildFeedbackMeta(RANGE_MAX);
    secret = Math.floor(Math.random() * RANGE_MAX) + 1;
    history = [];
    gameOver = false;
    gameOverType = null;
    RUN.locked = false;
    document.getElementById('guessInput').value = '';
    applyRangeToInputs();
    applyTranslations();
  }

  function runGuess() {
    // locked — пауза между раундами: иначе можно ввести уже угаданное число ещё раз и получить очки повторно
    if (!RUN || RUN.locked) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < 1 || guess > RANGE_MAX) return;

    const distance = Math.abs(guess - secret);
    history.push({ guess, distance, meta: getFeedback(distance), p: null });
    input.value = '';

    if (distance === 0) {
      const roundPoints = Math.round(100 * RUN.round * (minAttempts(RANGE_MAX) / history.length));
      RUN.totalScore += roundPoints;
      RUN.locked = true;
      RUN.round++;
      renderAll();
      const L = t();
      document.getElementById('feedbackLabel').textContent =
        L.labels[8] + '  +' + roundPoints + L.run.plus;
      setTimeout(startRunRound, 900);
    } else if (history.length >= MAX_GUESSES) {
      gameOver = true;
      renderAll();
      endRun();
    } else {
      renderAll();
    }
  }

  async function endRun() {
    const L = t();
    const finalScore = RUN.totalScore;
    const roundsSurvived = RUN.round - 1;
    const secretWas = secret;
    RUN = null;
    let resultHtml = '<div class="rr-title">' + L.run.over + '</div>' +
      '<p>' + L.run.secretWas + '<strong>' + secretWas + '</strong></p>' +
      '<p>' + L.run.roundsDone + '<strong>' + roundsSurvived + '</strong></p>' +
      '<p>' + L.run.finalScore + '<strong>' + finalScore + '</strong></p>';
    const auth = runAuth();
    if (auth && sb) {
      try {
        const { data, error } = await sb.rpc('submit_run_score', {
          p_username: auth.username, p_pin: auth.pin, p_score: finalScore, p_rounds: roundsSurvived
        });
        if (error) {
          resultHtml += '<p class="rr-error">' + L.run.errNoSave + escapeHtml(error.message) + '</p>';
        } else if (data && data.length && data[0].is_best) {
          resultHtml += '<p class="rr-best">' + L.run.newBest + '</p>';
        }
      } catch (e) {
        resultHtml += '<p class="rr-error">' + L.run.errNoSave + L.run.errNoConn + '</p>';
      }
    }
    resultHtml = '<div class="run-result">' + resultHtml + '</div>';
    mode = null;
    openRunHub(resultHtml);
  }

  // ================= ИНИЦИАЛИЗАЦИЯ =================
  document.getElementById('guessInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleGuess(); });
  document.getElementById('finalInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitFinal(); });
  document.getElementById('runPin').addEventListener('keydown', e => { if (e.key === 'Enter') runAuthSubmit(); });
  window.addEventListener('resize', syncRulesOpen);

  document.getElementById('langSwitcher').value = currentLang;
  document.getElementById('winsNeeded').value = '3';
  applyTranslations();
  showScreen('mode');
  syncRulesOpen();

  checkRemoteConfig();
  setInterval(checkRemoteConfig, 60000);
</script>
</body>
</html>
