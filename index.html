<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10142c" />

  <title id="docTitle">Hot or Cold</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-180.png" />

  <meta name="apple-mobile-web-app-title" content="Hot or Cold" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="card" id="card">
  <div id="updateBanner" class="hidden"></div>
  <div class="top-controls">
    <div class="header">
      <div class="emoji">🌡️</div>
      <h1 id="tTitle">Hot or Cold</h1>
    </div>
    <!-- Друзья, звук и профиль. Раньше профиль был силуэтом 👤 рядом с 👥 —
         два одинаковых синих человечка, различимых только по памяти. Теперь
         профиль — кружок с первой буквой имени, а язык, который меняют раз в
         жизни, уехал внутрь профиля. Звук остался: его выключают на ходу -->
    <button class="icon-btn hidden" id="friendsBtn" onclick="openFriendsEntry()">👥<span
      class="hdr-badge hidden" id="friendsBadge"></span></button>
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()" aria-label="Звук"></button>
    <button class="avatar-btn hidden" id="accountChip" onclick="openLogoutModal()"><span
      id="accountChipName"></span></button>
  </div>

  <!-- ЭКРАН 1: выбор режима -->
  <div id="screenMode">
    <div class="mode-list">
      <!-- У каждого режима значок и строка «что это». Без неё «Игра с другом»
           и «Друзья» в шапке читались как одно и то же, а «Испытание» (раньше —
           «Игра на рейтинг»)
           и «Игра онлайн» — как два входа в рейтинг -->
      <!-- Два блока по тому, нужен ли интернет: тренировка и игра вдвоём
           целиком работают без сети (их кеширует service worker), испытание
           и игра онлайн без сети не откроются — там вход и общая таблица -->
      <!-- Обучение для новичка: три коротких урока. Пока не пройдены первые
           два, онлайн закрыт — как в Hearthstone, где сначала учебные бои -->
      <button class="mode-btn tut hidden" id="tutCard" onclick="startNextLesson()">
        <span class="m-icon">🎓</span>
        <span class="m-text">
          <span class="m-title" id="tTutTitle"></span>
          <span class="m-sub" id="tTutSub"></span>
        </span>
      </button>
      <div class="mode-group" id="tGroupOffline"></div>
      <button class="mode-btn solo" onclick="openSetup('solo')">
        <span class="m-icon">🎯</span>
        <span class="m-text">
          <span class="m-title" id="tModeSolo">Single player</span>
        </span>
      </button>
      <button class="mode-btn duel" onclick="openSetup('duel')">
        <span class="m-icon">🤝</span>
        <span class="m-text">
          <span class="m-title" id="tModeDuel">Play with a friend</span>
        </span>
      </button>
      <button class="mode-btn bot" onclick="openSetup('duel', true)">
        <span class="m-icon">🤖</span>
        <span class="m-text">
          <span class="m-title" id="tModeBot">Play the bot</span>
        </span>
      </button>
      <div class="mode-group" id="tGroupOnline"></div>
      <button class="mode-btn run" onclick="openRunEntry()">
        <span class="m-icon">🏆</span>
        <span class="m-text">
          <span class="m-title" id="tModeRun"></span>
          <span class="m-sub hidden" id="tRunLock"></span>
        </span>
      </button>
      <button class="mode-btn online" onclick="openOnlineEntry()">
        <span class="m-icon">🌐</span>
        <span class="m-text">
          <span class="m-title" id="tModeOnline"></span>
          <span class="m-sub hidden" id="tOnlineLock"></span>
        </span>
      </button>
      <!-- Задания дня: засчитывает база по онлайн-партиям и Испытанию, поэтому
           карточка — в блоке «нужен интернет» и только у вошедшего -->
      <div class="quest-card hidden" id="questCard">
        <div class="qc-head"><span id="qcTitle"></span><span class="qc-streak" id="qcStreak"></span></div>
        <div id="qcList"></div>
        <div class="qc-foot" id="qcFoot"></div>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 2: настройка -->
  <div id="screenSetup" class="hidden">
    <div class="screen-title" id="tSetupScreen"></div>
    <div class="setup-field tight">
      <label id="tLblRange">Range</label>
      <select class="field" id="rangeMax" onchange="onRangeChange()"></select>
    </div>

    <label class="frost-row">
      <input type="checkbox" id="frostSetup" onchange="setFrostMode(this.checked)" />
      <span class="fr-text"><span id="tFrostSetup"></span><small class="row-hint" id="tFrostHint"></small></span>
    </label>

    <div class="setup-field" id="attemptsField">
      <label id="tLblAttempts">Attempts</label>
      <select class="field" id="attemptsCount"></select>
    </div>

    <div id="duelOnlyFields">
      <div class="setup-field hidden" id="botPickField">
        <label id="tLblBot">Opponent</label>
        <div class="bot-pick" id="botPick"></div>
      </div>

      <label class="frost-row">
        <input type="checkbox" id="bonusSetup" onchange="setBonusMode(this.checked)" />
        <span class="fr-text"><span id="tBonusSetup"></span><small class="row-hint" id="tBonusHint"></small></span>
      </label>

      <div class="setup-field hidden" id="bonusCountField">
        <label id="tLblBonusCount">Bonuses</label>
        <select class="field" id="bonusCount" onchange="setBonusCount(this.value)"></select>
      </div>

      <!-- Имена рядом, а не столбиком: форма дуэли не влезала в экран -->
      <div class="setup-pair" id="namesPair">
        <div class="setup-field">
          <label id="tLblP1">Player 1</label>
          <input type="text" id="nameP1" maxlength="14" oninput="buildHandicapOptions()" />
        </div>
        <div class="setup-field">
          <label id="tLblP2">Player 2</label>
          <input type="text" id="nameP2" maxlength="14" oninput="buildHandicapOptions()" />
        </div>
      </div>
      <div class="setup-pair">
      <div class="setup-field">
        <label id="tLblWins">Play until how many wins</label>
        <select class="field" id="winsNeeded">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </div>
      <div class="setup-field" id="handicapField">
        <label id="tLblHandicap">Handicap</label>
        <select class="field" id="handicap"></select>
      </div>
      </div>
    </div>

    <div class="setup-row">
      <button class="btn-ghost" onclick="showScreen('mode')" id="tBack">Back</button>
      <button class="btn btn-block" onclick="startFromSetup()" id="tStartMatch">Start match</button>
    </div>
  </div>

  <!-- ЭКРАН 3: игра -->
  <div id="screenGame" class="hidden">
    <div class="board" id="board">

      <div class="pcard pc0" id="pcard0">
        <div class="p-name" id="pname0"></div>
        <div class="p-wins-label" id="tWinsLabel0">Wins</div>
        <div class="p-pips" id="ppips0"></div>
        <button class="token-btn" id="ptoken0" onclick="useToken(0)"></button>
        <div class="p-effects" id="peff0"></div>
      </div>

      <div class="pcard pc1" id="pcard1">
        <div class="p-name" id="pname1"></div>
        <div class="p-wins-label" id="tWinsLabel1">Wins</div>
        <div class="p-pips" id="ppips1"></div>
        <button class="token-btn" id="ptoken1" onclick="useToken(1)"></button>
        <div class="p-effects" id="peff1"></div>
      </div>

      <div class="center">

        <div class="info-bar" id="infoBar">
          <span class="confirmed" id="tConfirmed"></span>
          <span class="attempts" id="attemptsLabel"></span>
          <span class="bar-actions">
            <button class="mini-toggle" id="toggleThermoBtn" onclick="toggleThermo()">🌡️</button>
            <button class="mini-toggle" id="toggleLineBtn" onclick="toggleLine()">📏</button>
            <button class="mini-toggle" id="toggleHintBtn" onclick="toggleHint()">💡</button>
            <button class="mini-toggle hidden" id="sayBtn" onclick="toggleSayPad()">💬</button>
            <button class="btn-reset" onclick="leaveGame()" id="tMenu">Menu</button>
          </span>
          <!-- Что сделала кнопка-значок. Показывается при первом нажатии на
               каждую: без подписи 🌡️ 📏 💡 непонятны, а место под слова нет -->
          <div class="bar-tip hidden" id="barTip" role="status"></div>
        </div>

        <!-- Подсказка учителя во время урока -->
        <div class="coach hidden" id="coach" role="status"></div>

        <div class="turn-banner hidden" id="turnBanner"></div>

        <!-- Обратный отсчёт хода. Тикает своим таймером: состояние приходит раз
             в две секунды, и без него секунды прыгали бы через одну -->
        <div class="turn-clock hidden" id="turnClock"></div>

        <!-- Что сказал сервер: отказ в ходе, обрыв связи. Отрисовка доски это
             место не трогает, иначе сообщение пропадало бы на первом же кадре -->
        <div class="match-note hidden" id="matchNote"></div>

        <!-- Что сказал соперник. Живёт несколько секунд и гаснет: это реплика,
             а не переписка, перечитывать её незачем -->
        <div class="say-bubble hidden" id="sayBubble"></div>

        <!-- Готовые фразы. Открываются кнопкой в строке статуса и занимают
             место только когда открыты -->
        <div class="say-pad hidden" id="sayPad"></div>

        <!-- Итог раунда стоит выше градусника и прямой: когда партия кончилась,
             первое, что нужно увидеть, — чем она кончилась, а не чем мерили -->
        <div class="result-box hidden" id="resultBox"></div>

        <div class="thermo-wrap hidden" id="thermoWrap">
          <div class="thermo-tube"><div class="thermo-fill" id="thermoFill"></div></div>
          <div class="thermo-bulb" id="thermoBulb"></div>
        </div>

        <div class="feedback-panel hidden" id="feedbackPanel">
          <div class="fb-label" id="feedbackLabel"></div>
          <div class="fb-band hidden" id="feedbackBand"></div>
        </div>

        <div class="bonus-line hidden" id="bonusLine"></div>

        <div class="numline hidden" id="numLine"><svg id="numLineSvg" width="100%" height="48"></svg></div>

        <div class="final-box hidden" id="finalBox">
          <p id="tFinalWarning">Attempts used — last chance!</p>
          <div class="row">
            <button class="sign-btn hidden" id="finalSign" onclick="flipSign('finalInput')" aria-label="−">−</button>
            <input type="text" id="finalInput" placeholder="" inputmode="numeric" autocomplete="off" />
            <button class="btn-yellow" onclick="submitFinal()" id="tFinalSubmit">Submit</button>
          </div>
        </div>

        <!-- Ход, отнятый бонусом: вместо поля ввода — кнопка. Нажимает её тот,
             у кого ход отняли, поэтому видно, что произошло и с кем -->
        <div class="forced-turn hidden" id="forcedTurn">
          <p id="forcedText"></p>
          <button class="btn-yellow btn-block" id="forcedBtn" onclick="doForcedTurn()"></button>
          <p class="forced-hint hidden" id="forcedHint"></p>
        </div>

        <div class="guess-section" id="guessSection">
          <div class="row">
            <button class="sign-btn hidden" id="guessSign" onclick="flipSign('guessInput')" aria-label="−">−</button>
            <input type="text" id="guessInput" placeholder="" inputmode="numeric" autocomplete="off" />
            <button class="btn" onclick="handleGuess()" id="tSubmitGuess">Check</button>
          </div>
        </div>

        <div class="history-section hidden" id="historySection">
          <div class="history-title" id="tHistoryTitle">Guess History</div>
          <div class="history-list" id="historyList"></div>
        </div>

      </div>
    </div>

    <div class="legend">
      <details class="instruction-box" id="scaleBox" open>
        <summary id="tLegendTitle">Distance Scale</summary>
        <div class="legend-body">
          <div class="legend-bar" id="legendBar"></div>
          <div class="legend-grid" id="legendGrid"></div>
        </div>
      </details>
    </div>
  </div>

  <!-- ЭКРАН: выбор вход/регистрация -->
  <div id="screenAuthChoice" class="hidden">
    <div class="mode-list">
      <button class="mode-btn solo stack" onclick="showRunAuth('login')">
        <div class="m-title" id="tRunChoiceLogin"></div>
        <div class="m-sub" id="tRunChoiceLoginSub"></div>
      </button>
      <button class="mode-btn run stack" onclick="showRunAuth('register')">
        <div class="m-title" id="tRunChoiceRegister"></div>
        <div class="m-sub" id="tRunChoiceRegisterSub"></div>
      </button>
    </div>
    <button class="btn-ghost btn-block" style="margin-top:12px" id="tRunChoiceBack" onclick="showScreen('mode')"></button>
  </div>

  <!-- ЭКРАН: форма входа или регистрации -->
  <div id="screenAuth" class="hidden">
    <div class="lb-title" id="runAuthTitle" style="font-size:15px;margin-bottom:10px"></div>
    <div class="setup-field">
      <label id="tRunName"></label>
      <input type="text" id="runUsername" maxlength="20" />
    </div>
    <div class="setup-field">
      <label id="tRunPin"></label>
      <input type="text" id="runPin" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="123456" />
    </div>
    <div class="setup-field hidden" id="hintField">
      <label id="tRunHint"></label>
      <input type="text" id="runHint" maxlength="60" />
    </div>
    <button class="btn-ghost btn-block hidden" id="tRunForgot" style="margin-bottom:10px" onclick="showPinHint()"></button>
    <div id="runAuthError" class="lb-title hidden" style="color:#f87171"></div>
    <div class="setup-row">
      <button class="btn-ghost" id="tRunAuthBack" onclick="showScreen('authChoice')"></button>
      <button class="btn btn-block" id="runAuthSubmitBtn" onclick="runAuthSubmit()"></button>
    </div>
  </div>

  <!-- ЭКРАН: онлайн. Сейчас это друзья; вызовы на игру встанут сюда же -->
  <!-- Рейтинг. Сверху вниз — ровно в том порядке, в каком решают: во что
       играть, сколько у меня очков, играть. Всё прочее — ниже и только когда
       есть что показать -->
  <div id="screenOnline" class="hidden">
    <div class="screen-title" id="tOnlineScreen"></div>
    <div class="run-greeting hidden" id="onlineGreeting"></div>

    <div id="olRanked">
      <div class="rk-modes" id="rkModes"></div>
      <div class="rk-hero">
        <div class="rk-elo" id="rkElo"></div>
        <div class="rk-stars hidden" id="rkStars"></div>
        <div class="rk-elo-sub" id="rkEloSub"></div>
        <div class="rk-elo-sub hidden" id="rkApprentice"></div>
      </div>
      <div class="fr-note hidden" id="rkNote"></div>
      <button class="btn btn-block" id="tRkPlay" onclick="startRanked()"></button>
      <div class="rk-wait hidden" id="rkWaitBox">
        <div class="rk-wait-text" id="rkWaitText"></div>
        <div class="rk-wait-sub" id="rkWaitSub"></div>
        <button class="btn-ghost btn-block" id="tRkCancel" onclick="cancelRanked()"></button>
      </div>
      <!-- Идущие рейтинговые игры. Пусто — блока нет: «игра не идёт» и так
           видно по тому, что вы не в игре -->
      <div class="fr-block hidden" id="rkGamesBox">
        <div class="lb-title" id="tRkGames"></div>
        <div id="rkGamesList" class="friend-list"></div>
      </div>
      <div class="rk-top">
        <div class="lb-title" id="tRkTop"></div>
        <div id="rkTopList" class="lb-list"></div>
      </div>
    </div>

    <div class="run-hub-actions">
      <button class="btn-ghost btn-block" id="tOnlineBack" onclick="quitToMenu()">Menu</button>
    </div>
  </div>

  <!-- ЭКРАН: друзья. Отдельно от рейтинга — это разные занятия -->
  <div id="screenFriends" class="hidden">
    <div class="screen-title" id="tFriendsScreen"></div>
    <div id="olFriends">
    <!-- Один список: у каждого друга под именем — что с ним сейчас (ваш ход,
         зовёт играть, новые сообщения). Игра с другом — прямо в его строке,
         отдельного списка игр нет. Порядок — по срочности: заявки в друзья,
         потом те, кто ждёт от вас действия, потом остальные -->
    <div class="fr-note hidden" id="gamesNote"></div>
    <div class="fr-block hidden" id="challengeBox">
      <div class="lb-title" id="challengeTitle"></div>
      <div class="setup-field tight">
        <label id="tChRange">Range</label>
        <select class="field" id="chRange" onchange="renderChallengeBonuses()"></select>
      </div>
      <label class="frost-row">
        <input type="checkbox" id="chFrost" onchange="buildChallengeRanges()" />
        <span id="tChFrost"></span>
      </label>
      <label class="frost-row">
        <input type="checkbox" id="chBonuses" onchange="renderChallengeBonuses()" />
        <span id="tChBonuses"></span>
      </label>
      <div class="setup-field hidden" id="chBonusCountField">
        <label id="tChBonusCount">Bonuses on the board</label>
        <select class="field" id="chBonusCount"></select>
      </div>
      <div class="setup-field">
        <label id="tChWins">Play until how many wins</label>
        <select class="field" id="chWins">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="9">9</option>
        </select>
      </div>
      <div class="row">
        <button class="btn-ghost" id="tChCancel" onclick="closeChallenge()">Cancel</button>
        <button class="btn btn-block" id="tChSend" onclick="sendChallenge()">Send</button>
      </div>
    </div>

    <div class="fr-block first">
      <div class="lb-title hidden" id="tFriendsTitle">Friends</div>
      <div class="fr-note hidden" id="friendsNote"></div>
      <div id="friendsList" class="friend-list"></div>
    </div>

    <!-- Игры с теми, кто уже не в друзьях. Обычно пусто — тогда блока нет -->
    <div class="fr-block hidden" id="gamesBox">
      <div class="lb-title" id="tGamesTitle">Games</div>
      <div id="gamesList" class="friend-list"></div>
    </div>

    <button class="btn-ghost btn-block" id="tInviteBtn" style="margin-bottom:10px" onclick="openInvite()"></button>

    <!-- Поиск свёрнут: он нужен изредка, а список «недавно играли» занимал
         пол-экрана каждый раз. Новичку без друзей раскрыт — больше ему тут
         делать нечего -->
    <details class="fr-block fold" id="findBox">
      <summary class="fold-head" id="tLblFindFriend">Find a player</summary>
      <div class="fold-body">
        <div class="row">
          <input type="text" id="friendSearch" maxlength="20" autocomplete="off" />
          <button class="btn" id="tFindBtn" onclick="searchStudents()">Find</button>
        </div>
        <div class="fr-note hidden" id="searchNote"></div>
        <div id="searchResults" class="friend-list"></div>
      </div>
    </details>
    </div>

    <div class="run-hub-actions">
      <button class="btn-ghost btn-block" id="tFriendsBack" onclick="quitToMenu()">Menu</button>
    </div>
  </div>

  <!-- ЭКРАН: переписка с одним другом. Текст готовыми фразами — по той же
       причине, что и в матче: читают на разных языках -->
  <div id="screenChat" class="hidden">
    <div class="screen-title chat-head"><span class="avatar" id="chatFace"></span><span id="chatWho"></span>
      <button class="fr-btn more chat-more" id="chatMore" onclick="openFriendSheet(chatWith, true)">⋯</button></div>
    <div class="fr-note hidden" id="chatNote"></div>
    <div id="chatList" class="chat-list"></div>
    <!-- Вне игры пишут текстом; четыре готовые фразы — для тех, кто печатает
         медленно. Грубые слова база заменяет на *** сама -->
    <div id="chatPad" class="chat-pad"></div>
    <div class="chat-compose">
      <input type="text" id="chatText" maxlength="200" autocomplete="off" enterkeyhint="send"
             oninput="renderChatLeft()" onkeydown="if (event.key === 'Enter') { event.preventDefault(); sendChatText(); }" />
      <button class="btn" id="tChatSend" onclick="sendChatText()">➤</button>
    </div>
    <div class="chat-left hidden" id="chatLeft"></div>

    <div class="fr-block">
      <div class="lb-title" id="tChatInvite"></div>
      <button class="btn btn-block" id="tChatFriendly" onclick="challengeFromChat()"></button>
      <div class="chat-modes-label" id="tChatRanked"></div>
      <div class="rk-modes" id="chatModes"></div>
    </div>

    <div class="run-hub-actions">
      <button class="btn-ghost btn-block" id="tChatBack" onclick="openFriends()">Back</button>
    </div>
  </div>

  <!-- ЭКРАН: хаб режима на рейтинг (старт/результат/топ) -->
  <div id="screenRunHub" class="hidden">
    <div class="screen-title" id="tRunScreen"></div>
    <div class="run-greeting hidden" id="runGreeting"></div>
    <div id="runHubMessage"></div>
    <div class="fr-note hidden" id="runNote"></div>
    <div class="run-result hidden" id="unfinishedBox">
      <div class="rr-title" id="tUnfinished"></div>
      <p id="unfinishedInfo"></p>
      <button class="btn btn-block" style="margin-top:14px" id="tUnfinishedResume" onclick="resumeSavedRun()"></button>
      <button class="btn-ghost btn-block" style="margin-top:8px" id="tUnfinishedFinish" onclick="finishSavedRun()"></button>
    </div>
    <label class="frost-row">
      <input type="checkbox" id="frostRun" onchange="setFrostMode(this.checked)" />
      <span class="fr-text"><span id="tFrostRun"></span><small class="row-hint" id="tFrostRunHint"></small></span>
    </label>
    <button class="btn btn-block" id="tRunStart" onclick="startRun()"></button>
    <div class="lb-wrap">
      <div class="lb-head">
        <div class="lb-title" id="tRunTop"></div>
        <div class="lb-tabs">
          <button class="lb-tab" id="tRunTopDay" onclick="setLeaderboardScope('day')"></button>
          <button class="lb-tab" id="tRunTopWeek" onclick="setLeaderboardScope('week')"></button>
          <button class="lb-tab" id="tRunTopAll" onclick="setLeaderboardScope('all')"></button>
        </div>
      </div>
      <div id="runLeaderboardList" class="lb-list"></div>
    </div>
    <div class="run-hub-actions">
      <button class="btn-ghost btn-block" id="tRunToMenu" onclick="showScreen('mode')"></button>
    </div>
  </div>
</div>

<!-- Пауза в игре на рейтинг -->
<!-- Разбор партии: точность, сводка по оценкам и каждый ход с лучшим вариантом -->
<div class="modal-backdrop hidden" id="reviewModal" onclick="if (event.target === this) closeReview()">
  <div class="modal-card review-card">
    <div class="rv-title" id="tReviewTitle"></div>
    <div class="rv-acc"><span class="rv-acc-num" id="rvAcc"></span><span class="rv-acc-label" id="tRvAcc"></span></div>
    <div class="rv-sum" id="rvSum"></div>
    <div class="rv-list" id="rvList"></div>
    <button class="btn btn-block" id="tReviewClose" onclick="closeReview()"></button>
  </div>
</div>

<div class="modal-backdrop hidden" id="pauseModal">
  <div class="modal-card">
    <div class="modal-text" id="tPauseTitle"></div>
    <button class="btn btn-block" id="tPauseResume" onclick="closePause()"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="tPauseExit" onclick="pauseAndLeave()"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="tPauseGiveUp" onclick="giveUpRun()"></button>
  </div>
</div>

<!-- Выход из рейтинговой игры: спрашиваем, потому что это поражение -->
<div class="modal-backdrop hidden" id="resignModal">
  <div class="modal-card">
    <div class="modal-text" id="tResignTitle"></div>
    <button class="btn btn-block" id="tResignStay" onclick="closeResign()"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="tResignGo" onclick="resignMatch()"></button>
  </div>
</div>

<!-- Выход из начатой партии без интернета: она нигде не хранится, и случайное
     нажатие на ☰ не должно стирать её молча -->
<div class="modal-backdrop hidden" id="quitModal">
  <div class="modal-card">
    <div class="modal-text" id="tQuitAsk"></div>
    <button class="btn btn-block" id="tQuitStay" onclick="closeQuit()"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="tQuitGo" onclick="closeQuit(); quitToMenu()"></button>
  </div>
</div>

<!-- Аккаунт: имя, свой PIN и выход -->
<!-- Профиль. Раньше это было окно выхода: вопрос «Выйти из аккаунта?» висел,
     хотя человек ничего не нажимал, — открыл посмотреть PIN, а его спрашивают,
     не уйти ли. Теперь вопрос появляется только после «Выйти».
     Без аккаунта то же окно — настройки: язык и вход -->
<div class="modal-backdrop hidden" id="logoutModal" onclick="if (event.target === this) closeLogoutModal()">
  <div class="modal-card profile-card">
    <div class="pf-avatar" id="pfAvatar" onclick="if (this.classList.contains('editable')) toggleAvatarPicker()"></div>
    <div class="pf-name" id="accountName"></div>
    <div class="pf-sub" id="tAccountTitle"></div>
    <!-- Лига и значки прошлых сезонов: одна строка под именем -->
    <div class="pf-league hidden" id="pfLeague"></div>
    <div class="pf-streak hidden" id="pfStreak"></div>

    <div id="pfAccount">
      <!-- Своя иконка вместо буквы. Прячется, пока сервер не умеет профиль
           (миграция не применена): обещать нечего. Сетка свёрнута: кто не
           меняет иконку, тому 25 кружков только мешают дойти до остального -->
      <div class="hidden" id="pfAvatarBox">
        <button class="btn-ghost btn-block" id="tAvatarStart" onclick="toggleAvatarPicker()"></button>
        <div class="av-grid hidden" id="avGrid"></div>
        <div class="fr-note hidden" id="avNote"></div>
      </div>

      <!-- Достижения: открытые — в цвете, остальные — серые, с тем, как открыть -->
      <details class="fold pf-fold hidden" id="pfAchFold" style="margin-bottom:8px">
        <summary class="fold-head" id="tAchHead"></summary>
        <div class="fold-body"><div class="ach-grid" id="pfAchGrid"></div></div>
      </details>

      <button class="btn-ghost btn-block" id="tShowPin" onclick="revealOwnPin()"></button>
      <button class="btn-ghost btn-block hidden" id="tPushToggle" style="margin-top:8px"
              onclick="togglePush()"></button>
      <div class="fr-note hidden" id="pushNote"></div>

      <div class="hidden" id="pfEdit">
        <!-- Имя и PIN меняют редко: под одной строкой. «Показать PIN» — выше,
             на виду: его дети забывают чаще всего -->
        <div class="fr-note hidden" id="pfPinShort" style="margin-bottom:8px"></div>
        <details class="fold pf-fold" id="pfEditFold">
        <summary class="fold-head" id="tNamePinHead">Name and PIN</summary>
        <div class="fold-body">
        <button class="btn-ghost btn-block" id="tRenameStart"
                onclick="openRename(true)"></button>
        <div class="pf-form hidden" id="renameBox">
          <input type="text" id="renameInput" maxlength="20" autocomplete="off" />
          <div class="setup-row">
            <button class="btn-ghost btn-block" id="tRenameCancel" onclick="openRename(false)"></button>
            <button class="btn btn-block" id="tRenameSave" onclick="saveRename()"></button>
          </div>
        </div>
        <div class="fr-note hidden" id="renameNote"></div>

        <button class="btn-ghost btn-block" id="tPinStart" style="margin-top:8px"
                onclick="openPinChange(true)"></button>
        <div class="pf-form hidden" id="pinBox">
          <input type="password" id="pinOld" inputmode="numeric" maxlength="6" autocomplete="off" />
          <input type="password" id="pinNew" inputmode="numeric" maxlength="6" autocomplete="off" />
          <input type="text" id="pinHintNew" maxlength="60" autocomplete="off" />
          <div class="setup-row">
            <button class="btn-ghost btn-block" id="tPinCancel" onclick="openPinChange(false)"></button>
            <button class="btn btn-block" id="tPinSave" onclick="savePin()"></button>
          </div>
        </div>
        <div class="fr-note hidden" id="pinNote"></div>
        </div>
        </details>
        <!-- Кого заблокировал — здесь же и разблокировать. Список грузится,
             только когда его раскрыли: заходят сюда редко -->
        <details class="fold pf-fold" id="pfBlockedFold" ontoggle="if (this.open) loadBlocked()">
        <summary class="fold-head" id="tBlockedHead"></summary>
        <div class="fold-body" id="pfBlockedList"></div>
        </details>
      </div>
    </div>

    <label class="pf-row">
      <span id="tLangLabel"></span>
      <select class="lang-switcher" id="langSwitcher" onchange="changeLanguage()">
        <option value="en">🇺🇸 English</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
    </label>

    <button class="btn-ghost btn-block hidden" id="tSignIn" style="margin-top:14px"
            onclick="signInFromProfile()"></button>
    <button class="btn-ghost btn-block" id="tTutReplay" style="margin-top:8px"
            onclick="closeLogoutModal(); startLesson(1)"></button>

    <div id="pfLogout">
      <button class="btn-ghost btn-block" id="tLogoutStart" style="margin-top:14px"
              onclick="askLogout(true)"></button>
      <div class="pf-confirm hidden" id="logoutConfirmBox">
        <div class="modal-text" id="tLogoutAsk"></div>
        <div class="setup-row">
          <button class="btn-ghost btn-block" id="tLogoutCancel" onclick="askLogout(false)"></button>
          <button class="btn btn-block" id="tLogoutConfirm" onclick="confirmLogout()"></button>
        </div>
      </div>
    </div>

    <button class="btn btn-block" id="tProfileDone" style="margin-top:14px"
            onclick="closeLogoutModal()"></button>
    <button class="link-danger danger" id="tDeleteAccount" onclick="openDeleteModal()"></button>
  </div>
</div>

<!-- Удаление аккаунта: отдельное окно, потому что это навсегда -->
<!-- Пригласить друга: QR-код и ссылка. Кто откроет — сразу друг -->
<div class="modal-backdrop hidden" id="inviteModal" onclick="if (event.target === this) closeInvite()">
  <div class="modal-card">
    <div class="modal-text" id="invTitle" style="font-weight:800"></div>
    <div class="inv-qr" id="invQr"></div>
    <div class="inv-link" id="invLink"></div>
    <div class="modal-text inv-hint" id="invHint"></div>
    <div class="fr-note hidden" id="invNote"></div>
    <button class="btn btn-block" style="margin-top:10px" id="invShare" onclick="shareInvite()"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="invCopy" onclick="copyInvite()"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="invDone" onclick="closeInvite()"></button>
  </div>
</div>

<!-- Открыли ссылку-приглашение -->
<div class="modal-backdrop hidden" id="inviteInModal">
  <div class="modal-card">
    <div class="modal-text" id="inTitle" style="font-weight:800"></div>
    <div class="fr-note hidden" id="inNote"></div>
    <button class="btn btn-block" style="margin-top:14px" id="inAdd" onclick="acceptPendingInvite()"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="inLater" onclick="dropPendingInvite()"></button>
  </div>
</div>

<!-- Игра вдвоём на одном телефоне при помехах: между ходами экран закрыт,
     чтобы второй игрок не увидел то, что от него спрятано -->
<div class="modal-backdrop curtain hidden" id="curtain">
  <div class="modal-card">
    <div class="ct-text" id="ctText"></div>
    <div class="modal-text ct-why" id="ctWhy"></div>
    <button class="btn btn-block" style="margin-top:14px" id="ctGo" onclick="liftCurtain()"></button>
  </div>
</div>

<!-- Онлайн закрыт, пока не пройдены два урока. Можно пропустить -->
<div class="modal-backdrop hidden" id="gateModal" onclick="if (event.target === this) closeGate()">
  <div class="modal-card">
    <div class="modal-text" id="gateText"></div>
    <button class="btn btn-block" style="margin-top:14px" id="gateGo" onclick="closeGate(); startNextLesson()"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="gateSkip" onclick="skipTutorial()"></button>
  </div>
</div>

<!-- Бонус встретился впервые: карточка, что он делает. Восемь видов бонусов
     не вываливаются на новичка разом — каждый объясняется, когда появился -->
<div class="modal-backdrop hidden" id="bonusCard">
  <div class="modal-card bonus-card">
    <div class="bc-icon" id="bcIcon"></div>
    <div class="bc-title" id="bcTitle"></div>
    <div class="modal-text" id="bcDesc"></div>
    <button class="btn btn-block" style="margin-top:14px" id="bcOk" onclick="closeBonusCard()"></button>
  </div>
</div>

<!-- Друг: всё, что с ним можно сделать, кроме игры -->
<div class="modal-backdrop hidden" id="friendSheet" onclick="if (event.target === this) closeFriendSheet()">
  <div class="modal-card">
    <div class="modal-text" id="fsName"></div>
    <button class="btn-ghost btn-block" id="fsWrite" onclick="friendSheetDo('write')"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="fsAch" onclick="friendSheetDo('ach')"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="fsRemove" onclick="friendSheetDo('remove')"></button>
    <button class="btn-ghost btn-block" style="margin-top:8px" id="fsReport" onclick="friendSheetDo('report')"></button>
    <button class="btn-ghost btn-block danger" style="margin-top:8px" id="fsBlock" onclick="friendSheetDo('block')"></button>
    <button class="btn btn-block" style="margin-top:14px" id="fsCancel" onclick="closeFriendSheet()"></button>
  </div>
</div>

<!-- Достижения друга -->
<div class="modal-backdrop hidden" id="achModal" onclick="if (event.target === this) closeFriendAch()">
  <div class="modal-card">
    <div class="modal-text" id="achTitle"></div>
    <div class="ach-grid" id="achGrid"></div>
    <div class="fr-note hidden" id="achNote"></div>
    <button class="btn btn-block" style="margin-top:14px" id="achClose" onclick="closeFriendAch()"></button>
  </div>
</div>

<!-- Итоги сезона: показываются один раз, при первом входе в новом сезоне -->
<div class="modal-backdrop hidden" id="seasonModal">
  <div class="modal-card season-card">
    <div class="modal-text" id="ssTitle"></div>
    <div class="ss-league" id="ssLeague"></div>
    <div class="ss-line" id="ssBest"></div>
    <div class="ss-line" id="ssGames"></div>
    <div class="ss-line" id="ssNow"></div>
    <div class="ss-line muted" id="ssBadge"></div>
    <button class="btn btn-block" style="margin-top:14px" id="ssGo" onclick="closeSeasonSummary()"></button>
  </div>
</div>

<!-- Жалоба: причина и, если хочется, пара слов. Переписку база приложит сама -->
<div class="modal-backdrop hidden" id="reportModal">
  <div class="modal-card">
    <div class="modal-text" id="rpTitle"></div>
    <div class="rp-reasons" id="rpReasons"></div>
    <textarea class="field rp-note" id="rpNote" maxlength="300" rows="3"></textarea>
    <div class="fr-note hidden" id="rpMsg"></div>
    <div class="setup-row" style="margin-top:12px">
      <button class="btn-ghost btn-block" id="rpCancel" onclick="closeReport()"></button>
      <button class="btn btn-block" id="rpSend" onclick="sendReport()"></button>
    </div>
  </div>
</div>

<!-- Блокировка: сначала вопрос — её не видно заблокированному, и по ошибке
     человек мог бы потерять друга, не поняв, что случилось -->
<div class="modal-backdrop hidden" id="blockModal">
  <div class="modal-card">
    <div class="modal-text" id="blAsk"></div>
    <div class="fr-note hidden" id="blMsg"></div>
    <button class="btn btn-block" style="margin-top:14px" id="blCancel" onclick="closeBlock()"></button>
    <button class="btn-ghost btn-block danger" style="margin-top:8px" id="blGo" onclick="confirmBlock()"></button>
  </div>
</div>

<div class="modal-backdrop hidden" id="deleteModal">
  <div class="modal-card">
    <div class="modal-text" id="tDeleteAsk"></div>
    <div class="fr-note hidden" id="deleteNote"></div>
    <button class="btn btn-block" style="margin-top:14px" id="tDeleteCancel"
            onclick="closeDeleteModal()"></button>
    <button class="btn-ghost btn-block danger" style="margin-top:8px" id="tDeleteGo"
            onclick="confirmDelete()"></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/i18n.js"></script>
<script src="js/game.js"></script>
<script src="js/online.js"></script>
<script src="js/main.js"></script>
</body>
</html>
