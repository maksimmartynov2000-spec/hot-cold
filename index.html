<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title id="docTitle">Hot or Cold</title>

  <!-- ИКОНКИ: вставьте сюда две строки из старого файла:
       <link rel="apple-touch-icon" href="data:image/png;base64,...">
       <link rel="icon" type="image/png" href="data:image/png;base64,..."> -->

  <meta name="apple-mobile-web-app-title" content="Hot or Cold" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p0: #6366f1;
      --p1: #fbbf24;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e3a5f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 12px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 24px 20px;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
      transition: max-width 0.2s;
    }
    .card.wide { max-width: 1100px; }

    .lang-switcher {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      font-weight: 500;
      z-index: 5;
    }
    .lang-switcher:focus { border-color: rgba(255,255,255,0.4); }

    .header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
    .header .emoji { font-size: clamp(30px, 8vw, 40px); margin-bottom: 6px; }
    .header h1 { font-size: clamp(20px, 5vw, 24px); font-weight: 700; letter-spacing: -0.5px; }

    .row { display: flex; gap: 8px; width: 100%; }

    input[type=number], input[type=text], select.field {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
      outline: none;
      -moz-appearance: textfield;
      caret-color: #fff;
      font-family: inherit;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    select.field option { background: #1e1b4b; color: #fff; }

    .btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-block { width: 100%; }

    .btn-yellow {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: #fbbf24;
      color: #1c1917;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-yellow:hover { background: #f59e0b; }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.16); }

    .btn-reset {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-family: inherit;
    }

    /* ---------- Стартовый экран ---------- */
    .mode-list { display: flex; flex-direction: column; gap: 12px; }
    .mode-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }
    .mode-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.3); }
    .mode-btn .m-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .mode-btn .m-sub { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
    .mode-btn.duel { border-left: 3px solid var(--p1); }
    .mode-btn.solo { border-left: 3px solid var(--p0); }

    /* ---------- Настройка дуэли ---------- */
    .setup-field { margin-bottom: 14px; }
    .setup-field label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .setup-row { display: flex; gap: 8px; }

    /* ---------- Игровое поле ---------- */
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "p0 p1" "center center";
      gap: 12px;
      align-items: start;
    }
    .board.solo { grid-template-columns: 1fr; grid-template-areas: "center"; }
    .board .pc0 { grid-area: p0; }
    .board .pc1 { grid-area: p1; }
    .board .center { grid-area: center; min-width: 0; }

    @media (min-width: 860px) {
      .board.duel {
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-areas: "p0 center p1";
        gap: 20px;
        align-items: start;
      }
    }

    .pcard {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      opacity: 0.45;
      transition: opacity 0.2s, transform 0.2s, background 0.2s, border-color 0.2s;
    }
    .pcard.active { opacity: 1; transform: scale(1.02); }
    .pcard .p-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .pcard .p-pips { font-size: 13px; letter-spacing: 2px; margin-bottom: 10px; }
    .pcard .p-wins-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .token-btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .token-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
    .token-btn:disabled { opacity: 0.28; cursor: default; }
    .token-btn.armed { background: rgba(74, 222, 128, 0.2); border-color: #4ade80; color: #86efac; }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .info-bar .confirmed { font-size: 13px; color: rgba(255, 255, 255, 0.6); }
    .info-bar .attempts { font-size: 13px; font-weight: 600; color: #a5f3fc; }
    .info-bar .attempts.low { color: #f87171; }

    .turn-banner {
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid transparent;
    }

    .feedback-panel {
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: center;
      animation: pop 0.3s ease;
    }
    .feedback-panel .fb-label { font-size: clamp(20px, 6vw, 26px); font-weight: 600; }

    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feedback-panel { animation: none; }
      .pcard.active { transform: none; }
    }

    .final-box {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid #fbbf24;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .final-box p {
      text-align: center;
      font-size: 14px;
      color: #fde68a;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .result-box {
      border-radius: 14px;
      padding: 16px 14px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }
    .result-win { background: rgba(22, 163, 74, 0.2); border: 1px solid #16a34a; color: #86efac; }
    .result-lose { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
    .result-round { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
    .result-box .r-sub { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.6); margin-top: 6px; }
    .result-box .r-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }

    .guess-section { margin-bottom: 16px; }
    .guess-section p { margin-bottom: 8px; font-size: 14px; color: rgba(255, 255, 255, 0.65); font-weight: 500; }

    .history-section { margin-bottom: 16px; }
    .history-title {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .history-list.tall { max-height: 340px; }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      gap: 10px;
    }
    .history-item .h-num { color: rgba(255, 255, 255, 0.4); font-size: 12px; flex-shrink: 0; }
    .history-item .h-who { font-size: 12px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .h-guess { font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .history-item .h-label { font-size: 13px; font-weight: 600; text-align: right; word-break: break-word; }

    .legend { margin-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 14px; }
    .legend-title { font-size: 12px; color: rgba(255, 255, 255, 0.35); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 6px 12px;
      margin-bottom: 16px;
    }
    .legend-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .legend-item .l-label { font-weight: 600; }
    .legend-item .l-range { color: rgba(255, 255, 255, 0.4); font-variant-numeric: tabular-nums; }

    .instruction-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .instruction-box summary {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      outline: none;
    }
    .instruction-box p {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.4;
      white-space: pre-line;
    }

    .hidden { display: none !important; }

    :focus-visible { outline: 2px solid #a5f3fc; outline-offset: 2px; }
  </style>
</head>
<body>
<div class="card" id="card">
  <select class="lang-switcher" id="langSwitcher" onchange="changeLanguage()">
    <option value="en">🇺🇸 EN</option>
    <option value="ru">🇷🇺 RU</option>
    <option value="fr">🇫🇷 FR</option>
    <option value="de">🇩🇪 DE</option>
  </select>

  <div class="header">
    <div class="emoji">🌡️</div>
    <h1 id="tTitle">Hot or Cold</h1>
  </div>

  <!-- ЭКРАН 1: выбор режима -->
  <div id="screenMode">
    <div class="mode-list">
      <button class="mode-btn solo" onclick="chooseSolo()">
        <div class="m-title" id="tModeSolo">Single player</div>
      </button>
      <button class="mode-btn duel" onclick="showScreen('setup')">
        <div class="m-title" id="tModeDuel">Play with a friend</div>
      </button>
    </div>
  </div>

  <!-- ЭКРАН 2: настройка дуэли -->
  <div id="screenSetup" class="hidden">
    <div class="setup-field">
      <label id="tLblP1">Player 1</label>
      <input type="text" id="nameP1" maxlength="14" />
    </div>
    <div class="setup-field">
      <label id="tLblP2">Player 2</label>
      <input type="text" id="nameP2" maxlength="14" />
    </div>
    <div class="setup-field">
      <label id="tLblWins">Play until how many wins</label>
      <select class="field" id="winsNeeded">
        <option value="1">1</option>
        <option value="3" selected>3</option>
        <option value="5">5</option>
        <option value="7">7</option>
        <option value="9">9</option>
      </select>
    </div>
    <div class="setup-field">
      <label id="tLblHandicap">Handicap</label>
      <select class="field" id="handicap"></select>
    </div>
    <div class="setup-row">
      <button class="btn-ghost" onclick="showScreen('mode')" id="tBack">Back</button>
      <button class="btn btn-block" onclick="startMatch()" id="tStartMatch">Start match</button>
    </div>
  </div>

  <!-- ЭКРАН 3: игра -->
  <div id="screenGame" class="hidden">
    <div class="board" id="board">

      <div class="pcard pc0" id="pcard0">
        <div class="p-name" id="pname0"></div>
        <div class="p-wins-label" id="tWinsLabel0">Wins</div>
        <div class="p-pips" id="ppips0"></div>
        <button class="token-btn" id="ptoken0" onclick="useToken(0)"></button>
      </div>

      <div class="pcard pc1" id="pcard1">
        <div class="p-name" id="pname1"></div>
        <div class="p-wins-label" id="tWinsLabel1">Wins</div>
        <div class="p-pips" id="ppips1"></div>
        <button class="token-btn" id="ptoken1" onclick="useToken(1)"></button>
      </div>

      <div class="center">

        <div class="info-bar" id="infoBar">
          <span class="confirmed" id="tConfirmed">Number generated ✓</span>
          <span class="attempts" id="attemptsLabel"></span>
          <button class="btn-reset" onclick="quitToMenu()" id="tMenu">Menu</button>
        </div>

        <div class="turn-banner hidden" id="turnBanner"></div>

        <div class="feedback-panel hidden" id="feedbackPanel">
          <div class="fb-label" id="feedbackLabel"></div>
        </div>

        <div class="final-box hidden" id="finalBox">
          <p id="tFinalWarning">Attempts used — last chance!</p>
          <div class="row">
            <input type="number" id="finalInput" min="1" max="1000" placeholder="" pattern="[0-9]*" inputmode="numeric" />
            <button class="btn-yellow" onclick="submitFinal()" id="tFinalSubmit">Submit</button>
          </div>
        </div>

        <div class="result-box hidden" id="resultBox"></div>

        <div class="guess-section" id="guessSection">
          <p id="tEnterGuess">Enter a number</p>
          <div class="row">
            <input type="number" id="guessInput" min="1" max="1000" placeholder="" pattern="[0-9]*" inputmode="numeric" />
            <button class="btn" onclick="handleGuess()" id="tSubmitGuess">Check</button>
          </div>
        </div>

        <div class="history-section hidden" id="historySection">
          <div class="history-title" id="tHistoryTitle">Guess History</div>
          <div class="history-list" id="historyList"></div>
        </div>

      </div>
    </div>

    <div class="legend">
      <div class="legend-title" id="tLegendTitle">Distance Scale</div>
      <div class="legend-grid" id="legendGrid"></div>

      <details class="instruction-box" id="rulesBox">
        <summary id="tInsTitle">Rules 📋</summary>
        <p id="tInsBody">Loading...</p>
      </details>
    </div>
  </div>
</div>

<script>
  const i18n = {
    en: {
      title: "Hot or Cold", docTitle: "Hot or Cold",
      confirmed: "Number generated ✓", attemptsPrefix: "Attempts: ", newGame: "New Game", menu: "Menu",
      enterGuess: "Enter a number", placeholder: "Number 1–1000...", submitGuess: "Check",
      finalWarning: "Attempts used — last chance!", finalSubmit: "Submit", finalInput: "Final answer...",
      resultWin: "🎉 Victory! Number is guessed!", resultLose: "❌ Wrong. The secret number was: ",
      historyTitle: "Guess History", legendTitle: "Distance Scale",
      insTitle: "How to play? 📋",
      insBody: "Guess the secret number (from 1 to 1000) in 10 attempts.\n\nThe thermometer tracks the distance (difference) between your guess and the secret number.\n\nExample: the secret number is 350, you enter 900 — the distance is 550 steps. The thermometer will show: 🧊 Very cold.\n\nThe smaller this distance, the higher the thermometer temperature.\n\nGood luck!",
      labels: ["🧊 Very cold", "❄️ Cold", "🌬️ Chilly", "🌤️ Warm", "☀️ Hot", "🔥 Very hot", "💥 Burning", "🌋 Lava", "🎯 Bullseye!"],

      modeSolo: "Single player",
      modeDuel: "Play with a friend",
      lblP1: "Player 1", lblP2: "Player 2", defP1: "Player 1", defP2: "Player 2",
      lblWins: "Play until how many wins", lblHandicap: "Head start",
      hcNone: "None", hcTokens: "2 tokens", hcFirst: "always goes first",
      back: "Back", startMatch: "Start match",
      winsLabel: "Wins", tokenBtn: "⚡ Double move", tokenArmed: "⚡ Double move active", tokenSpent: "⚡ Token spent",
      turnOf: "Turn: ", roundLabel: "Round ",
      roundWin: " wins the round!", matchWin: " wins the match!",
      secretWas: "The number was: ", nextRound: "Next round", newMatch: "New match", toMenu: "Menu",
      insDuelTitle: "Duel rules 📋",
      insDuelBody: "One number for both players, from 1 to 1000.\n\nTake turns. Guesses are unlimited, both of you see every move.\n\nFirst to name the number wins the round.\n\n⚡ — two guesses in a row. One per round, not on the first move. Unused, it expires.\n\nThe next round starts with the other player."
    },
    ru: {
      title: "Горячо — Холодно", docTitle: "Горячо — Холодно",
      confirmed: "Число загадано ✓", attemptsPrefix: "Попыток: ", newGame: "Новая игра", menu: "Меню",
      enterGuess: "Введите число", placeholder: "Число от 1 до 1000...", submitGuess: "Проверить",
      finalWarning: "Попытки закончились — последний шанс!", finalSubmit: "Ответ", finalInput: "Финальный ответ...",
      resultWin: "🎉 Победа! Число угадано!", resultLose: "❌ Неверно. Загаданное число было: ",
      historyTitle: "История попыток", legendTitle: "Шкала расстояний",
      insTitle: "Как играть? 📋",
      insBody: "Отгадайте секретное число (от 1 до 1000) за 10 попыток.\n\nГрадусник измеряет расстояние (разницу) между вашим вариантом и секретным числом.\n\nНапример: секретное число 350, вы вводите 900 — расстояние 550 шагов. Градусник покажет: 🧊 Очень холодно.\n\nЧем меньше это расстояние, тем выше температура градусника.\n\nУдачи!",
      labels: ["🧊 Очень холодно", "❄️ Холодно", "🌬️ Прохладно", "🌤️ Тепло", "☀️ Жарко", "🔥 Горячо", "💥 Очень горячо", "🌋 Лава", "🎯 В точку!"],

      modeSolo: "Одиночная игра",
      modeDuel: "Игра с другом",
      lblP1: "Игрок 1", lblP2: "Игрок 2", defP1: "Игрок 1", defP2: "Игрок 2",
      lblWins: "Играем до скольки побед", lblHandicap: "Фора",
      hcNone: "Нет", hcTokens: "2 жетона", hcFirst: "всегда ходит первым",
      back: "Назад", startMatch: "Начать матч",
      winsLabel: "Побед", tokenBtn: "⚡ Двойной ход", tokenArmed: "⚡ Двойной ход активен", tokenSpent: "⚡ Жетон потрачен",
      turnOf: "Ходит: ", roundLabel: "Забег ",
      roundWin: " выигрывает забег!", matchWin: " выигрывает матч!",
      secretWas: "Загаданное число: ", nextRound: "Следующий забег", newMatch: "Новый матч", toMenu: "В меню",
      insDuelTitle: "Правила дуэли 📋",
      insDuelBody: "Число одно на двоих, от 1 до 1000.\n\nХодите по очереди. Попыток сколько угодно, все ходы видны обоим.\n\nКто первым назовёт число — выигрывает забег.\n\n⚡ — две попытки подряд. Одна на забег, кроме первого хода. Не потратили — сгорает.\n\nСледующий забег начинает другой игрок."
    },
    fr: {
      title: "Chaud ou Froid", docTitle: "Chaud ou Froid",
      confirmed: "Nombre généré ✓", attemptsPrefix: "Essais: ", newGame: "Nouvelle partie", menu: "Menu",
      enterGuess: "Entrez un nombre", placeholder: "Nombre 1–1000...", submitGuess: "Vérifier",
      finalWarning: "Tentatives épuisées — dernière chance !", finalSubmit: "Valider", finalInput: "Réponse finale...",
      resultWin: "🎉 Victoire ! Le nombre a été deviné !", resultLose: "❌ Incorrect. Le nombre secret était : ",
      historyTitle: "Historique des tentatives", legendTitle: "Échelle de distance",
      insTitle: "Comment jouer ? 📋",
      insBody: "Devinez le nombre secret (de 1 à 1000) en 10 tentatives.\n\nLe thermomètre mesure la distance (la différence) entre votre proposition et le nombre secret.\n\nExemple : le nombre secret est 350, vous entrez 900 — la distance est de 550 pas. Le thermomètre affichera : 🧊 Très froid.\n\nPlus cette distance est petite, plus la température du thermomètre est élevée.\n\nBonne chance !",
      labels: ["🧊 Très froid", "❄️ Froid", "🌬️ Frais", "🌤️ Tiède", "☀️ Chaud", "🔥 Très chaud", "💥 Brûlant", "🌋 Lave", "🎯 Dans le mille !"],

      modeSolo: "Partie solo",
      modeDuel: "Jouer à deux",
      lblP1: "Joueur 1", lblP2: "Joueur 2", defP1: "Joueur 1", defP2: "Joueur 2",
      lblWins: "Jusqu'à combien de victoires", lblHandicap: "Avantage",
      hcNone: "Aucun", hcTokens: "2 jetons", hcFirst: "commence toujours",
      back: "Retour", startMatch: "Commencer le match",
      winsLabel: "Victoires", tokenBtn: "⚡ Double tour", tokenArmed: "⚡ Double tour activé", tokenSpent: "⚡ Jeton utilisé",
      turnOf: "Au tour de : ", roundLabel: "Manche ",
      roundWin: " remporte la manche !", matchWin: " remporte le match !",
      secretWas: "Le nombre était : ", nextRound: "Manche suivante", newMatch: "Nouveau match", toMenu: "Menu",
      insDuelTitle: "Règles du duel 📋",
      insDuelBody: "Un seul nombre pour les deux joueurs, de 1 à 1000.\n\nChacun son tour. Tentatives illimitées, tout est visible par les deux.\n\nLe premier qui nomme le nombre remporte la manche.\n\n⚡ — deux tentatives d'affilée. Un par manche, sauf au premier coup. Non utilisé, il est perdu.\n\nLa manche suivante commence par l'autre joueur."
    },
    de: {
      title: "Heiß oder Kalt", docTitle: "Heiß oder Kalt",
      confirmed: "Zahl generiert ✓", attemptsPrefix: "Versuche: ", newGame: "Neues Spiel", menu: "Menü",
      enterGuess: "Gib eine Zahl ein", placeholder: "Zahl 1–1000...", submitGuess: "Prüfen",
      finalWarning: "Versuche aufgebraucht — letzte Chance!", finalSubmit: "Bestätigen", finalInput: "Letzte Antwort...",
      resultWin: "🎉 Gewonnen! Die Zahl wurde erraten!", resultLose: "❌ Falsch. Die Geheimzahl war: ",
      historyTitle: "Rateverlauf", legendTitle: "Entfernungsskala",
      insTitle: "Spielanleitung 📋",
      insBody: "Errate die Geheimzahl (von 1 bis 1000) in 10 Versuchen.\n\nDas Thermometer misst den Abstand (die Differenz) zwischen deinem Tipp und der Geheimzahl.\n\nBeispiel: Die Geheimzahl ist 350, du gibst 900 ein — der Abstand beträgt 550 Schritte. Das Thermometer zeigt: 🧊 Sehr kalt.\n\nJe kleiner dieser Abstand ist, desto höher ist die Temperatur.\n\nViel Glück!",
      labels: ["🧊 Sehr kalt", "❄️ Kalt", "🌬️ Kühl", "🌤️ Warm", "☀️ Heiß", "🔥 Sehr heiß", "💥 Glühend", "🌋 Lava", "🎯 Volltreffer!"],

      modeSolo: "Einzelspiel",
      modeDuel: "Zu zweit spielen",
      lblP1: "Spieler 1", lblP2: "Spieler 2", defP1: "Spieler 1", defP2: "Spieler 2",
      lblWins: "Bis wie viele Siege", lblHandicap: "Vorsprung",
      hcNone: "Keins", hcTokens: "2 Marken", hcFirst: "beginnt immer",
      back: "Zurück", startMatch: "Match starten",
      winsLabel: "Siege", tokenBtn: "⚡ Doppelzug", tokenArmed: "⚡ Doppelzug aktiv", tokenSpent: "⚡ Marke verbraucht",
      turnOf: "Am Zug: ", roundLabel: "Runde ",
      roundWin: " gewinnt die Runde!", matchWin: " gewinnt das Match!",
      secretWas: "Die Zahl war: ", nextRound: "Nächste Runde", newMatch: "Neues Match", toMenu: "Menü",
      insDuelTitle: "Duell-Regeln 📋",
      insDuelBody: "Der Computer wählt eine Zahl von 1 bis 1000 — dieselbe für beide Spieler.\n\nDie Spieler sind abwechselnd am Zug, die Versuche sind unbegrenzt. Alle Tipps sind für beide sichtbar.\n\nWer zuerst die genaue Zahl nennt, gewinnt die Runde.\n\nJeder Spieler hat eine ⚡ Marke pro Runde: sie gibt einen zweiten Tipp direkt hintereinander. Nicht im ersten Zug einer Runde nutzbar. Eine nicht genutzte Marke verfällt am Rundenende.\n\nIn der nächsten Runde beginnt der andere Spieler."
    }
  };

  const FEEDBACK_META = [
    { min: 501, max: 1000, color: "#93C5FD", bg: "rgba(147, 197, 253, 0.15)", labelIndex: 0, rangeSign: "501–1000" },
    { min: 201, max: 500,  color: "#38BDF8", bg: "rgba(56, 189, 248, 0.15)",  labelIndex: 1, rangeSign: "201–500" },
    { min: 101, max: 200,  color: "#2DD4BF", bg: "rgba(45, 212, 191, 0.15)",  labelIndex: 2, rangeSign: "101–200" },
    { min: 51,  max: 100,  color: "#FBBF24", bg: "rgba(251, 191, 36, 0.15)",  labelIndex: 3, rangeSign: "51–100" },
    { min: 21,  max: 50,   color: "#FB923C", bg: "rgba(251, 146, 60, 0.15)",  labelIndex: 4, rangeSign: "21–50" },
    { min: 11,  max: 20,   color: "#F87171", bg: "rgba(248, 113, 113, 0.15)", labelIndex: 5, rangeSign: "11–20" },
    { min: 4,   max: 10,   color: "#FF5733", bg: "rgba(255, 87, 51, 0.18)",   labelIndex: 6, rangeSign: "4–10" },
    { min: 1,   max: 3,    color: "#FF4500", bg: "rgba(255, 69, 0, 0.2)",     labelIndex: 7, rangeSign: "1–3" },
    { min: 0,   max: 0,    color: "#4ADE80", bg: "rgba(74, 222, 128, 0.15)",  labelIndex: 8, rangeSign: "0" },
  ];

  const MAX_GUESSES = 10;
  const P_COLORS = ["#6366f1", "#fbbf24"];

  let currentLang = localStorage.getItem('hc_lang') || 'en';

  // ---------- общее состояние ----------
  let mode = null;          // 'solo' | 'duel'
  let screen = 'mode';      // 'mode' | 'setup' | 'game'
  let secret = 0;
  let history = [];
  let gameOver = false;
  let gameOverType = null;

  // ---------- состояние дуэли ----------
  const D = {
    names: ["", ""],
    winsNeeded: 3,
    handicap: 0,      // 0 нет, 1/2 — 2 жетона игроку 1/2, 3/4 — игрок 1/2 всегда первый
    wins: [0, 0],
    tokens: [0, 0],
    cur: 0,
    starter: 0,
    round: 1,
    armed: false,
    roundOver: false,
    matchOver: false,
    roundWinner: null
  };

  function t() { return i18n[currentLang]; }

  // ================= ЯЗЫК =================
  function changeLanguage() {
    currentLang = document.getElementById('langSwitcher').value;
    localStorage.setItem('hc_lang', currentLang);
    applyTranslations();
  }

  function buildHandicapOptions() {
    const sel = document.getElementById('handicap');
    const prev = sel.value || "0";
    const L = t();
    const opts = [
      L.hcNone,
      L.defP1 + " — " + L.hcTokens,
      L.defP2 + " — " + L.hcTokens,
      L.defP1 + " — " + L.hcFirst,
      L.defP2 + " — " + L.hcFirst
    ];
    sel.innerHTML = '';
    opts.forEach((txt, i) => {
      const o = document.createElement('option');
      o.value = i; o.textContent = txt;
      sel.appendChild(o);
    });
    sel.value = prev;
  }

  function applyTranslations() {
    const L = t();

    document.getElementById('docTitle').textContent = L.docTitle;
    document.title = L.docTitle;
    document.getElementById('tTitle').textContent = L.title;
    document.getElementById('tConfirmed').textContent = L.confirmed;
    document.getElementById('tMenu').textContent = L.menu;
    document.getElementById('tFinalWarning').textContent = L.finalWarning;
    document.getElementById('tFinalSubmit').textContent = L.finalSubmit;
    document.getElementById('tEnterGuess').textContent = L.enterGuess;
    document.getElementById('tSubmitGuess').textContent = L.submitGuess;
    document.getElementById('tHistoryTitle').textContent = L.historyTitle;
    document.getElementById('tLegendTitle').textContent = L.legendTitle;

    document.getElementById('tModeSolo').textContent = L.modeSolo;
    document.getElementById('tModeDuel').textContent = L.modeDuel;

    document.getElementById('tLblP1').textContent = L.lblP1;
    document.getElementById('tLblP2').textContent = L.lblP2;
    document.getElementById('tLblWins').textContent = L.lblWins;
    document.getElementById('tLblHandicap').textContent = L.lblHandicap;
    document.getElementById('tBack').textContent = L.back;
    document.getElementById('tStartMatch').textContent = L.startMatch;
    document.getElementById('tWinsLabel0').textContent = L.winsLabel;
    document.getElementById('tWinsLabel1').textContent = L.winsLabel;

    document.getElementById('nameP1').placeholder = L.defP1;
    document.getElementById('nameP2').placeholder = L.defP2;
    document.getElementById('guessInput').placeholder = L.placeholder;
    document.getElementById('finalInput').placeholder = L.finalInput;

    const duel = mode === 'duel';
    document.getElementById('tInsTitle').textContent = duel ? L.insDuelTitle : L.insTitle;
    document.getElementById('tInsBody').textContent = duel ? L.insDuelBody : L.insBody;

    buildHandicapOptions();
    buildLegend();
    renderAll();
  }

  // ================= НАВИГАЦИЯ =================
  function showScreen(name) {
    screen = name;
    document.getElementById('screenMode').classList.toggle('hidden', name !== 'mode');
    document.getElementById('screenSetup').classList.toggle('hidden', name !== 'setup');
    document.getElementById('screenGame').classList.toggle('hidden', name !== 'game');
    document.getElementById('card').classList.toggle('wide', name === 'game' && mode === 'duel');
    document.querySelector('.legend').classList.toggle('hidden', name !== 'game');
    if (name === 'setup') buildHandicapOptions();
  }

  function quitToMenu() {
    mode = null;
    D.matchOver = false;
    applyTranslations();
    showScreen('mode');
  }

  // ================= ОДИНОЧНАЯ ИГРА =================
  function chooseSolo() {
    mode = 'solo';
    resetSolo();
    applyTranslations();
    showScreen('game');
  }

  function resetSolo() {
    secret = Math.floor(Math.random() * 1000) + 1;
    history = [];
    gameOver = false;
    gameOverType = null;
    document.getElementById('finalInput').value = '';
    document.getElementById('guessInput').value = '';
    renderAll();
  }

  function handleGuess() {
    if (mode === 'duel') return duelGuess();
    if (gameOver) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < 1 || guess > 1000) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: null });
    input.value = '';

    if (distance === 0) {
      gameOver = true;
      gameOverType = 'win';
    } else if (history.length >= MAX_GUESSES) {
      gameOver = true;
      gameOverType = 'lose_waiting';
    }
    renderAll();
  }

  function submitFinal() {
    const input = document.getElementById('finalInput');
    const g = parseInt(input.value);
    if (isNaN(g)) return;
    gameOverType = (g === secret) ? 'win' : 'lose';
    renderAll();
  }

  // ================= ДУЭЛЬ =================
  function startMatch() {
    const L = t();
    mode = 'duel';
    D.names[0] = (document.getElementById('nameP1').value || '').trim() || L.defP1;
    D.names[1] = (document.getElementById('nameP2').value || '').trim() || L.defP2;
    D.winsNeeded = parseInt(document.getElementById('winsNeeded').value);
    D.handicap = parseInt(document.getElementById('handicap').value);
    D.wins = [0, 0];
    D.round = 1;
    D.matchOver = false;
    D.starter = (D.handicap === 3) ? 0 : (D.handicap === 4 ? 1 : 0);
    startRound();
    applyTranslations();
    showScreen('game');
  }

  function startRound() {
    secret = Math.floor(Math.random() * 1000) + 1;
    history = [];
    D.tokens = [1, 1];
    if (D.handicap === 1) D.tokens[0] = 2;
    if (D.handicap === 2) D.tokens[1] = 2;
    D.cur = D.starter;
    D.armed = false;
    D.roundOver = false;
    D.roundWinner = null;
    document.getElementById('guessInput').value = '';
    renderAll();
  }

  function nextRound() {
    D.round++;
    if (D.handicap !== 3 && D.handicap !== 4) D.starter = 1 - D.starter;
    startRound();
  }

  function newMatch() {
    D.wins = [0, 0];
    D.round = 1;
    D.matchOver = false;
    D.starter = (D.handicap === 3) ? 0 : (D.handicap === 4 ? 1 : 0);
    startRound();
  }

  function useToken(p) {
    if (mode !== 'duel' || D.roundOver || D.matchOver) return;
    if (p !== D.cur || D.armed) return;
    if (D.tokens[p] <= 0) return;
    if (history.length === 0) return;   // нельзя первым ходом забега
    D.tokens[p]--;
    D.armed = true;
    renderAll();
  }

  function duelGuess() {
    if (D.roundOver || D.matchOver) return;
    const input = document.getElementById('guessInput');
    const guess = parseInt(input.value);
    if (isNaN(guess) || guess < 1 || guess > 1000) return;

    const distance = Math.abs(guess - secret);
    const meta = getFeedback(distance);
    history.push({ guess, distance, meta, p: D.cur });
    input.value = '';

    const usedDouble = D.armed;
    D.armed = false;

    if (distance === 0) {
      D.roundOver = true;
      D.roundWinner = D.cur;
      D.wins[D.cur]++;
      if (D.wins[D.cur] >= D.winsNeeded) D.matchOver = true;
    } else if (!usedDouble) {
      D.cur = 1 - D.cur;
    }
    renderAll();
  }

  // ================= РЕНДЕР =================
  function getFeedback(distance) {
    return FEEDBACK_META.find(f => distance >= f.min && distance <= f.max) || FEEDBACK_META[0];
  }
  function getFbText(meta) { return t().labels[meta.labelIndex]; }

  function renderAll() {
    if (screen !== 'game' && mode === null) return;
    const duel = mode === 'duel';
    const board = document.getElementById('board');
    board.classList.toggle('duel', duel);
    board.classList.toggle('solo', !duel);
    document.getElementById('pcard0').classList.toggle('hidden', !duel);
    document.getElementById('pcard1').classList.toggle('hidden', !duel);
    document.getElementById('historyList').classList.toggle('tall', duel);

    renderFeedback();
    renderStatus();
    renderResult();
    renderHistory();
    if (duel) renderPlayers();
  }

  function renderFeedback() {
    const panel = document.getElementById('feedbackPanel');
    const last = history[history.length - 1];
    const hide = !last || (mode === 'duel' ? D.roundOver : gameOverType === 'win' || gameOverType === 'lose');
    if (hide) { panel.classList.add('hidden'); return; }
    panel.style.background = last.meta.bg;
    panel.style.border = '1px solid ' + last.meta.color;
    panel.classList.remove('hidden');
    const label = document.getElementById('feedbackLabel');
    label.textContent = getFbText(last.meta);
    label.style.color = last.meta.color;
  }

  function renderStatus() {
    const L = t();
    const duel = mode === 'duel';
    const attempts = document.getElementById('attemptsLabel');
    const banner = document.getElementById('turnBanner');

    if (duel) {
      attempts.textContent = L.roundLabel + D.round;
      attempts.className = 'attempts';
      if (D.roundOver) { banner.classList.add('hidden'); }
      else {
        banner.classList.remove('hidden');
        banner.textContent = L.turnOf + D.names[D.cur] + (D.armed ? '  ' + L.tokenArmed : '');
        banner.style.borderColor = P_COLORS[D.cur];
        banner.style.background = 'rgba(255,255,255,0.06)';
        banner.style.color = P_COLORS[D.cur];
      }
      document.getElementById('finalBox').classList.add('hidden');
      document.getElementById('guessSection').classList.toggle('hidden', D.roundOver);
    } else {
      banner.classList.add('hidden');
      const left = MAX_GUESSES - history.length;
      attempts.textContent = L.attemptsPrefix + left + ' / ' + MAX_GUESSES;
      attempts.className = 'attempts' + (left <= 3 ? ' low' : '');
      document.getElementById('finalBox').classList.toggle('hidden', gameOverType !== 'lose_waiting');
      document.getElementById('guessSection').classList.toggle('hidden', gameOver);
    }
  }

  function renderResult() {
    const box = document.getElementById('resultBox');
    const L = t();
    box.innerHTML = '';

    if (mode === 'duel') {
      if (!D.roundOver) { box.classList.add('hidden'); return; }
      const w = D.roundWinner;
      box.className = 'result-box ' + (D.matchOver ? 'result-win' : 'result-round');
      const title = document.createElement('div');
      title.textContent = D.names[w] + (D.matchOver ? L.matchWin : L.roundWin);
      const sub = document.createElement('div');
      sub.className = 'r-sub';
      sub.textContent = L.secretWas + secret + '   ·   ' + D.names[0] + ' ' + D.wins[0] + ' : ' + D.wins[1] + ' ' + D.names[1];
      const actions = document.createElement('div');
      actions.className = 'r-actions';
      if (D.matchOver) {
        actions.innerHTML = '<button class="btn" onclick="newMatch()">' + L.newMatch + '</button>' +
                            '<button class="btn-ghost" onclick="quitToMenu()">' + L.toMenu + '</button>';
      } else {
        actions.innerHTML = '<button class="btn" onclick="nextRound()">' + L.nextRound + '</button>';
      }
      box.appendChild(title); box.appendChild(sub); box.appendChild(actions);
      box.classList.remove('hidden');
      return;
    }

    if (gameOverType === 'win' || gameOverType === 'lose') {
      box.className = 'result-box ' + (gameOverType === 'win' ? 'result-win' : 'result-lose');
      const title = document.createElement('div');
      title.textContent = gameOverType === 'win' ? L.resultWin : (L.resultLose + secret);
      const actions = document.createElement('div');
      actions.className = 'r-actions';
      actions.innerHTML = '<button class="btn" onclick="resetSolo()">' + L.newGame + '</button>' +
                          '<button class="btn-ghost" onclick="quitToMenu()">' + L.toMenu + '</button>';
      box.appendChild(title); box.appendChild(actions);
      box.classList.remove('hidden');
    } else {
      box.classList.add('hidden');
    }
  }

  function renderPlayers() {
    const L = t();
    for (let p = 0; p < 2; p++) {
      const card = document.getElementById('pcard' + p);
      card.style.borderColor = P_COLORS[p];
      card.style.background = (D.cur === p && !D.roundOver)
        ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.05)';
      card.classList.toggle('active', D.cur === p && !D.roundOver);

      const nameEl = document.getElementById('pname' + p);
      nameEl.textContent = D.names[p];
      nameEl.style.color = P_COLORS[p];

      let pips = '';
      for (let i = 0; i < D.winsNeeded; i++) pips += (i < D.wins[p] ? '●' : '○');
      const pipsEl = document.getElementById('ppips' + p);
      pipsEl.textContent = pips;
      pipsEl.style.color = P_COLORS[p];

      const btn = document.getElementById('ptoken' + p);
      const canUse = !D.roundOver && !D.matchOver && D.cur === p && !D.armed &&
                     D.tokens[p] > 0 && history.length > 0;
      btn.disabled = !canUse;
      btn.classList.toggle('armed', D.armed && D.cur === p);
      const count = D.tokens[p] > 1 ? ' ×' + D.tokens[p] : '';
      btn.textContent = (D.armed && D.cur === p) ? L.tokenArmed
                        : (D.tokens[p] === 0 ? L.tokenSpent : L.tokenBtn + count);
    }
  }

  function renderHistory() {
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');
    if (history.length === 0) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');
    list.innerHTML = '';

    [...history].reverse().forEach((h, i) => {
      const realIndex = history.length - i;
      const item = document.createElement('div');
      item.className = 'history-item';
      const accent = (h.p === null || h.p === undefined) ? h.meta.color : P_COLORS[h.p];
      item.style.borderLeft = '3px solid ' + accent;
      const who = (h.p === null || h.p === undefined)
        ? ''
        : '<span class="h-who" style="color:' + P_COLORS[h.p] + '">' + escapeHtml(D.names[h.p]) + '</span>';
      item.innerHTML =
        '<span class="h-num">#' + realIndex + '</span>' + who +
        '<span class="h-guess">' + h.guess + '</span>' +
        '<span class="h-label" style="color:' + h.meta.color + '">' + getFbText(h.meta) + '</span>';
      list.appendChild(item);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function buildLegend() {
    const grid = document.getElementById('legendGrid');
    grid.innerHTML = '';
    const labels = t().labels;
    FEEDBACK_META.slice(0, 8).forEach(meta => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = '<span class="l-label" style="color:' + meta.color + '">' + labels[meta.labelIndex] +
                       '</span><span class="l-range">' + meta.rangeSign + '</span>';
      grid.appendChild(item);
    });
  }

  function syncRulesOpen() {
    document.getElementById('rulesBox').open = window.innerWidth >= 860;
  }

  // ================= ИНИЦИАЛИЗАЦИЯ =================
  document.getElementById('guessInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleGuess(); });
  document.getElementById('finalInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitFinal(); });
  window.addEventListener('resize', syncRulesOpen);

  document.getElementById('langSwitcher').value = currentLang;
  applyTranslations();
  showScreen('mode');
  syncRulesOpen();
</script>
</body>
</html>
